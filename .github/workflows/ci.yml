name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  desktop:
    name: desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `apps/dante-desktop` is detached from the root workspace precisely
      # because it needs these: a webview + GTK stack for Tauri, and libopus +
      # ALSA for the mic/speaker bridge. The other jobs must stay free of them,
      # which is why this is a separate runner rather than a workspace member.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libopus-dev \
            libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/dante-desktop

      # Being detached, this crate is invisible to the root `cargo fmt --all`
      # and `clippy --workspace` above — so it gets its own checks here.
      - name: rustfmt
        working-directory: apps/dante-desktop
        run: cargo fmt --check

      - name: clippy
        working-directory: apps/dante-desktop
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        working-directory: apps/dante-desktop
        run: cargo build
