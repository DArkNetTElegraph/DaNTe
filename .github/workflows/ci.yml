name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  desktop:
    name: desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # `audiopus_sys` vendors a libopus whose CMakeLists.txt still declares
      # `cmake_minimum_required(VERSION <3.5)`, and CMake 4 removed
      # compatibility with that — configuring aborts outright. This is CMake's
      # own documented escape hatch for exactly this case.
      #
      # It only matters on Windows: Linux links the system libopus found via
      # pkg-config and never builds it from source. Drop this when audiopus_sys
      # ships a libopus that configures under CMake 4 on its own.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      # Every platform this ships on is built here. Don't let one platform's
      # failure hide another's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      # `apps/dante-desktop` is detached from the root workspace precisely
      # because it needs these: a webview + GTK stack for Tauri, and libopus +
      # ALSA for the mic/speaker bridge. The other jobs must stay free of them,
      # which is why this is a separate runner rather than a workspace member.
      # Windows needs none of it: WebView2 ships with the OS and the audio
      # backend is WASAPI. macOS ships WKWebView and CoreAudio the same way —
      # only libopus has no system copy, so pkg-config + Homebrew's opus let
      # the audio bridge link that instead of falling back to a from-source
      # CMake build of the vendored copy (the same one that needs
      # `CMAKE_POLICY_VERSION_MINIMUM` below on Windows).
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libopus-dev \
            libasound2-dev

      - name: System libraries
        if: runner.os == 'macOS'
        run: brew install pkg-config opus

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/dante-desktop
          key: ${{ matrix.os }}

      # Being detached, this crate is invisible to the root `cargo fmt --all`
      # and `clippy --workspace` above — so it gets its own checks here.
      - name: rustfmt
        if: runner.os == 'Linux'
        working-directory: apps/dante-desktop
        run: cargo fmt --check

      - name: clippy
        working-directory: apps/dante-desktop
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        working-directory: apps/dante-desktop
        run: cargo build
