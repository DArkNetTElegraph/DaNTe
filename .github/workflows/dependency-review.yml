name: Dependency Review

# Blocks a PR that introduces a dependency with a known vulnerability or an
# incompatible license, at review time — Dependabot (see .github/dependabot.yml)
# only opens update PRs for what's already merged; this catches a bad
# dependency before it lands. Runs only on pull_request, so it never touches
# the push-triggered jobs in ci.yml.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
