name: Release

# Release-time only: opt in by pushing a `v*` tag. There is deliberately no
# `pull_request` or push-to-main trigger, so this workflow can neither slow
# down nor break normal CI. It builds the Linux binaries with the same script
# and pinned toolchain a user can run locally, publishes SHA256SUMS, and signs
# it keyless with cosign (OIDC — tied to this workflow's identity, no managed
# key). See docs/REPRODUCIBLE_BUILDS.md for the verification story.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # cosign keyless signing via OIDC

jobs:
  linux-x86_64:
    name: build, checksum, sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-reproducible

      # The exact command in docs/REPRODUCIBLE_BUILDS.md. If a user runs the
      # same script at the same tag, they should get these bytes.
      - name: Build reproducibly
        run: scripts/repro-build.sh dist

      - name: Verify the checksum file
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the checksums (keyless OIDC)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.bundle dist/SHA256SUMS

      # Also keep the artifacts on the run itself, so they survive a failed
      # release step or a release being deleted later.
      - name: Upload the run's artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dante-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: |
            dist/dante
            dist/dante-relay
            dist/SHA256SUMS
            dist/SHA256SUMS.bundle

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag like v0.1.0-alpha.1 carries the pre-release marker itself
          # (deliberately kept out of the actual package version — Tauri's
          # Windows MSI bundler requires that to be a bare number, so
          # "alpha.1" would hard-fail it) — mirror it onto the GitHub
          # release with --prerelease so it shows the "Pre-release" badge
          # instead of looking like a normal, install-me release.
          prerelease_flag=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease_flag[@]}" \
            dist/dante dist/dante-relay dist/SHA256SUMS dist/SHA256SUMS.bundle

  desktop-bundle:
    name: desktop bundle (${{ matrix.os }})
    # The release must already exist (created above) before a bundle can be
    # attached to it.
    needs: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      # See the identical comment in ci.yml: audiopus_sys's vendored libopus
      # needs this under CMake 4. Only matters where there is no system
      # libopus (Windows; macOS skips it below by installing one).
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # Same package list as the `desktop shell` CI job in ci.yml — kept
      # identical on purpose so a passing CI run is a reliable predictor of a
      # working release build.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libopus-dev \
            libasound2-dev

      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config

      # A universal build lipo's together two independently-built binaries
      # (aarch64 + x86_64), so both targets' standard libraries need to be
      # installed before either `cargo build` pass below can run — see
      # `cargo tauri build`'s own `--target universal-apple-darwin` docs.
      - name: Install both macOS targets for a universal build
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/dante-desktop
          key: release-desktop-${{ matrix.os }}

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      # icons/icon.png is the only tracked icon (see apps/dante-desktop's
      # .gitignore) — every other size, plus the macOS .icns and Windows .ico
      # variants the bundler wants, are generated, not committed.
      - name: Generate the platform icon set
        working-directory: apps/dante-desktop
        run: cargo tauri icon icons/icon.png

      # Code-signing (Gatekeeper/SmartScreen trust) is unconfigured — this
      # project has no maintainer-held Apple/Windows certificates, so macOS
      # and Windows will still warn on first launch. See
      # apps/dante-desktop/README.md's "Release" section. Update-signing is
      # a separate, unrelated key (TAURI_SIGNING_PRIVATE_KEY): it proves an
      # update came from this project's own release process, nothing to do
      # with OS-level trust, and needs no certificate authority — just the
      # keypair `cargo tauri signer generate` made once. With it present,
      # `createUpdaterArtifacts: true` in tauri.conf.json makes this step
      # also emit a `.sig` file next to each updater-format artifact
      # (`.app.tar.gz` on macOS, `.AppImage.tar.gz` on Linux, the NSIS
      # installer `.exe` under `nsis-updater/` on Windows).
      # macOS builds universal (both Apple Silicon and Intel in one binary)
      # so every Mac gets offered the same update regardless of which arch
      # it's running — a separate step because it needs its own extra env
      # var, not because the command itself couldn't be conditional inline.
      - name: Build the bundle (macOS universal)
        if: runner.os == 'macOS'
        working-directory: apps/dante-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # `--target universal-apple-darwin` builds aarch64 and x86_64
          # separately, then `lipo`'s them together. audiopus_sys defaults
          # to `pkg-config` first on unix, but Homebrew's opus is
          # single-arch (whichever this runner natively is) — pkg-config
          # would happily hand back that single-arch dylib to link into
          # *both* passes, silently corrupting whichever half doesn't match
          # the runner's own arch. This env var (audiopus_sys's own escape
          # hatch) skips straight to its vendored CMake build instead,
          # which correctly targets whatever `cargo build --target <triple>`
          # is actually building for — the same vendored path Windows
          # already goes through via the CMAKE_POLICY_VERSION_MINIMUM
          # workaround above, just forced here rather than pkg-config
          # failing to find opus on its own.
          LIBOPUS_NO_PKG: "1"
        run: cargo tauri build --target universal-apple-darwin

      - name: Build the bundle
        if: runner.os != 'macOS'
        working-directory: apps/dante-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      # A universal macOS build's output lands under
      # target/universal-apple-darwin/release/bundle/ instead of the usual
      # target/release/bundle/ (cargo/Tauri's normal cross-compile-target
      # convention, applied here since `--target universal-apple-darwin`
      # is itself a target as far as the CLI's own output-path logic is
      # concerned) — both roots are listed unconditionally rather than
      # made per-OS: on Linux/Windows the universal-only path simply never
      # matches anything, same as `if-no-files-found: warn` already
      # tolerates elsewhere in this file.
      - name: Upload the run's artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dante-desktop-${{ github.ref_name }}-${{ matrix.os }}
          path: |
            apps/dante-desktop/target/release/bundle/**/*.dmg
            apps/dante-desktop/target/release/bundle/**/*.app.tar.gz
            apps/dante-desktop/target/release/bundle/**/*.app.tar.gz.sig
            apps/dante-desktop/target/release/bundle/**/*.msi
            apps/dante-desktop/target/release/bundle/**/*.exe
            apps/dante-desktop/target/release/bundle/**/*.exe.sig
            apps/dante-desktop/target/release/bundle/**/*.deb
            apps/dante-desktop/target/release/bundle/**/*.rpm
            apps/dante-desktop/target/release/bundle/**/*.AppImage
            apps/dante-desktop/target/release/bundle/**/*.AppImage.tar.gz
            apps/dante-desktop/target/release/bundle/**/*.AppImage.tar.gz.sig
            apps/dante-desktop/target/universal-apple-darwin/release/bundle/**/*.dmg
            apps/dante-desktop/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz
            apps/dante-desktop/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz.sig
          if-no-files-found: warn

      - name: Attach the bundle to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(apps/dante-desktop/target/release/bundle/**/*.dmg
                 apps/dante-desktop/target/release/bundle/**/*.app.tar.gz
                 apps/dante-desktop/target/release/bundle/**/*.msi
                 apps/dante-desktop/target/release/bundle/**/*.exe
                 apps/dante-desktop/target/release/bundle/**/*.deb
                 apps/dante-desktop/target/release/bundle/**/*.rpm
                 apps/dante-desktop/target/release/bundle/**/*.AppImage
                 apps/dante-desktop/target/release/bundle/**/*.AppImage.tar.gz
                 apps/dante-desktop/target/universal-apple-darwin/release/bundle/**/*.dmg
                 apps/dante-desktop/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no desktop bundle files were produced for ${{ matrix.os }}" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      # The .sig files themselves are never downloaded by anyone — the
      # updater client only ever fetches latest.json (assembled below, once
      # every platform's fragment is in) and the update artifact it points
      # to. This step just reads each .sig produced above and turns it,
      # plus the matching artifact's release download URL, into one JSON
      # fragment keyed by Tauri's own `{os}-{arch}` naming
      # (linux-x86_64/darwin-x86_64/darwin-aarch64/windows-x86_64) — see
      # tauri-plugin-updater's `updater_os`/`updater_arch` for where that
      # naming comes from. A platform with no updater artifact (nothing
      # built, or signing wasn't configured) contributes an empty fragment
      # rather than failing the job — this could plausibly run before
      # secrets are configured.
      - name: Assemble this platform's update-manifest fragment
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          case "${{ runner.os }}" in
            Linux) pattern="apps/dante-desktop/target/release/bundle/**/*.AppImage.tar.gz" ;;
            # A universal build (--target universal-apple-darwin) lands
            # under target/universal-apple-darwin/release/, not the usual
            # target/release/ — see the comment on "Upload the run's
            # artifacts" above for why.
            macOS) pattern="apps/dante-desktop/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz" ;;
            Windows) pattern="apps/dante-desktop/target/release/bundle/nsis-updater/*.exe" ;;
            *) echo "unknown runner.os: ${{ runner.os }}" >&2; exit 1 ;;
          esac
          artifacts=($pattern)
          fragment="{}"
          for artifact in "${artifacts[@]}"; do
            sig_file="$artifact.sig"
            if [ ! -f "$sig_file" ]; then
              echo "no .sig next to $artifact — signing secrets likely unset, skipping" >&2
              continue
            fi
            case "${{ runner.os }}" in
              Linux) keys=(linux-x86_64) ;;
              Windows) keys=(windows-x86_64) ;;
              # A universal build covers both Apple Silicon and Intel in one
              # binary, so this same artifact + signature is valid for
              # either arch's updater lookup — advertise both keys rather
              # than guessing one from the runner's own (irrelevant) arch.
              macOS) keys=(darwin-aarch64 darwin-x86_64) ;;
            esac
            url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename "$artifact")"
            sig="$(cat "$sig_file")"
            for key in "${keys[@]}"; do
              entry=$(jq -n --arg key "$key" --arg sig "$sig" --arg url "$url" \
                '{($key): {signature: $sig, url: $url}}')
              fragment=$(jq -s '.[0] * .[1]' <(echo "$fragment") <(echo "$entry"))
            done
          done
          echo "$fragment" > latest-json-fragment.json
          cat latest-json-fragment.json

      - name: Upload this platform's update-manifest fragment
        uses: actions/upload-artifact@v7
        with:
          name: latest-json-fragment-${{ matrix.os }}
          path: latest-json-fragment.json
          if-no-files-found: warn

  assemble-latest-json:
    name: assemble latest.json
    needs: desktop-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform's fragment
        uses: actions/download-artifact@v8
        with:
          pattern: latest-json-fragment-*
          path: fragments
          merge-multiple: false

      # Each fragment landed in its own subdirectory (merge-multiple:false,
      # so a platform contributing an empty `{}` can't collide filenames
      # with another's real fragment.json). `jq -s add` merges every
      # fragment object's keys into one `platforms` map — safe because each
      # platform's step above only ever sets its own `{os}-{arch}` key.
      - name: Merge into one manifest and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          platforms=$(find fragments -name '*.json' -exec cat {} \; | jq -s 'add // {}')
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg version "${{ github.ref_name }}" --arg pub_date "$pub_date" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: ("Release " + $version), pub_date: $pub_date, platforms: $platforms}' \
            > latest.json
          echo "-- assembled manifest --"
          cat latest.json
          if [ "$(jq '.platforms | length' latest.json)" -eq 0 ]; then
            echo "::warning::latest.json has no platforms — update-signing secrets are probably unset; publishing anyway so the release isn't blocked, but no client will find an update from it"
          fi
          gh release upload "${{ github.ref_name }}" latest.json --clobber
