[workspace]
resolver = "2"
members = [
    "crates/dante-crypto",
    "crates/dante-identity",
    "crates/dante-ledger",
    "crates/dante-proto",
    "crates/dante-net",
    "crates/dante-relay",
    "crates/dante-dm",
    "crates/dante-group",
    "crates/dante-mls",
    "crates/dante-core",
    "crates/dante-cli",
    "crates/dante-voice",
    "crates/dante-p2p",
    "crates/dante-relay-check",
]
# dante-p2p pulls the large libp2p tree. `default-members` omits it so a
# workspace-wide default build does not select it directly, but dante-core,
# dante-cli and dante-relay all enable their `p2p` feature by default, so a bare
# root `cargo build` still pulls the tree in transitively. Use
# `--no-default-features` for the lean TCP-only path, or build it explicitly
# (`-p dante-p2p`) / with `--workspace`.
default-members = [
    "crates/dante-crypto",
    "crates/dante-identity",
    "crates/dante-ledger",
    "crates/dante-proto",
    "crates/dante-net",
    "crates/dante-relay",
    "crates/dante-dm",
    "crates/dante-group",
    "crates/dante-mls",
    "crates/dante-core",
    "crates/dante-cli",
    "crates/dante-voice",
    "crates/dante-relay-check",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
# 1.91 is OpenMLS 0.9's floor (pulled in by dante-mls -> dante-core -> dante-cli).
rust-version = "1.91"
license = "AGPL-3.0-or-later"
repository = "https://github.com/DArkNetTElegraph/DaNTe"
authors = ["The DaNTe contributors"]

[workspace.dependencies]
# Internal crates. Explicit versions so `cargo deny` does not read the bare
# path deps as wildcard-version dependencies.
dante-crypto = { path = "crates/dante-crypto", version = "0.0.1" }
dante-identity = { path = "crates/dante-identity", version = "0.0.1" }
dante-ledger = { path = "crates/dante-ledger", version = "0.0.1" }
dante-proto = { path = "crates/dante-proto", version = "0.0.1" }
dante-net = { path = "crates/dante-net", version = "0.0.1" }
dante-dm = { path = "crates/dante-dm", version = "0.0.1" }
dante-group = { path = "crates/dante-group", version = "0.0.1" }
dante-mls = { path = "crates/dante-mls", version = "0.0.1" }
dante-core = { path = "crates/dante-core", version = "0.0.1" }
dante-voice = { path = "crates/dante-voice", version = "0.0.1" }
dante-p2p = { path = "crates/dante-p2p", version = "0.0.1" }

# Shared third-party deps (kept minimal; phases add their own)
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Testing only.
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Every test binary statically links the whole tree (webrtc, libp2p, openmls,
# ring). At the default `debug = true` that is ~350 MB of DWARF per binary, and
# cargo never prunes the copy it wrote for the previous source hash — a few days
# of building runs to tens of gigabytes. Line tables keep backtraces pointing at
# file:line, which is what we actually read, at a fraction of the size.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Crypto and hashing want optimization even in dev/test.
[profile.dev.package."*"]
opt-level = 2
