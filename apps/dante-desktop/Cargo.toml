# Detached from the main workspace on purpose: Tauri and the audio bridge need
# system libraries (webkit2gtk / libsoup / ALSA / libopus on Linux, WebView2 /
# WASAPI on Windows, WKWebView / CoreAudio on macOS) that a bare workspace build
# should not assume, so `cargo build --workspace` at the repo root must not try
# to compile it. CI builds it in a dedicated job (Linux, Windows, macOS); build
# it by hand from this directory:
#
#   cd apps/dante-desktop && cargo tauri dev
#
[workspace]

[package]
name = "dante-desktop"
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-or-later"
description = "DaNTe desktop shell — the dante-cli engine + web UI in a native window."
publish = false

[[bin]]
name = "dante-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The engine + HTTP/JSON API + embedded SPA, reused verbatim.
dante-cli = { path = "../../crates/dante-cli" }
dante-core = { path = "../../crates/dante-core" }
dante-crypto = { path = "../../crates/dante-crypto" }
dante-identity = { path = "../../crates/dante-identity" }
dante-ledger = { path = "../../crates/dante-ledger" }
# Mic/speaker for 1:1 calls: Opus + cpal. Also detached (links libopus and the
# platform audio stack), which is why the audio bridge lives in the desktop
# build rather than in `dante-cli`.
dante-audio = { path = "../../crates/dante-audio" }

# `tray-icon` pulls the platform tray backend (libayatana-appindicator on
# Linux, Shell_NotifyIcon on Windows); the notification plugin is what reaches
# the OS notification centre.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde_json = "1"
anyhow = "1"

[lints.rust]
unsafe_code = "forbid"
