[package]
name = "dante-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless DaNTe client for development and demos."

[lib]
name = "dante_cli"
path = "src/lib.rs"

[[bin]]
name = "dante"
path = "src/main.rs"

[features]
default = ["p2p"]
# libp2p transport + DHT, forwarded to dante-core. On by default; build with
# `--no-default-features` for a relay-only client with no libp2p tree.
p2p = ["dante-core/p2p"]

[dependencies]
dante-core.workspace = true
dante-crypto.workspace = true
dante-identity.workspace = true
dante-ledger.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "net", "sync", "signal"] }
# Opt-in link-preview unfurler (a hand-rolled minimal HTTPS GET client). rustls
# is already in the build graph via dante-voice/webrtc; these add only the
# tokio adapter and the OS trust-store reader.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"

[lints.rust]
unsafe_code = "forbid"
