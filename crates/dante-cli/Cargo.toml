[package]
name = "dante-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Headless DaNTe client for development and demos."

[lib]
name = "dante_cli"
path = "src/lib.rs"

[[bin]]
name = "dante"
path = "src/main.rs"

[features]
default = ["p2p"]
# libp2p transport + DHT, forwarded to dante-core and dante-relay. On by
# default; build with `--no-default-features` for a relay-only client with no
# libp2p tree.
p2p = ["dante-core/p2p", "dante-relay/p2p"]

[dependencies]
dante-core.workspace = true
dante-crypto.workspace = true
dante-identity.workspace = true
dante-ledger.workspace = true
# Just the token-bucket primitive, for a local rate limit on GIF search (see
# serve.rs) so a runaway loop can't burn through the operator's metered
# Tenor/Giphy API quota. dante-net is already in the build graph via
# dante-core/dante-relay; this makes it a direct dependency too. `unfurl`:
# the SSRF-guarded fetcher dante-cli's own unfurl.rs re-exports.
dante-net = { workspace = true, features = ["unfurl"] }
# `--also-relay`: embeds the same relay node the `dante-relay` binary runs,
# so a desktop user can opt in to being a relay for others without a second
# process. See dante_relay::run. `unfurl` costs nothing extra here — its only
# dependency (rustls) is already pulled in by dante-net's own `unfurl`
# feature above — so the embedded relay can offer the operator's opt-in
# relay-side unfurl toggle same as the standalone `dante-relay` binary.
dante-relay = { path = "../dante-relay", version = "0.1.0", features = ["unfurl"] }
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "time", "net", "sync", "signal"] }

[lints.rust]
unsafe_code = "forbid"
