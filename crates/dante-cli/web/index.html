<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DaNTe</title>
<style>
/* ============================================================================
   DaNTe web client — a deliberately throwaway UI, but structured so panes can
   be replaced piece by piece. Layout mirrors Discord: server rail | channel
   list | chat | member list. Baseline 800x500; below 800px the shell scrolls
   rather than collapsing.
   ========================================================================== */

/* Toggling visibility with el.hidden / the [hidden] attribute must win over
   any `display:` set by an id/class rule below (e.g. #onboard, .icon-btn). */
[hidden] { display: none !important; }

:root {
  /* ---- palette (from the project's inspiration set) ---------------------- */
  --blazing-flame:  #ff3c00;
  --space-indigo:   #2e294e;
  --alabaster-grey: #e2e2e2;
  --orange:         #ffae03;
  --cornflower-blue:#7692ff;

  /* ---- derived surfaces (dark) ----------------------------------------- */
  --bg-rail:    #171526;
  --bg-pane:    #211d3b;
  --bg-chat:    #29244a;
  --bg-input:   #1b1832;
  --bg-hover:   rgba(226, 226, 226, 0.06);
  --bg-active:  rgba(118, 146, 255, 0.16);

  --text:        var(--alabaster-grey);
  --text-muted:  #9591b0;
  --text-faint:  #6f6b8a;
  --divider:     rgba(226, 226, 226, 0.07);

  --accent:      var(--blazing-flame);
  --accent-warm: var(--orange);
  --link:        var(--cornflower-blue);

  /* ---- metrics ------------------------------------------------------------ */
  --rail:    64px;
  --pane:    228px;
  --members: 200px;
  --header-h: 48px;
  --radius:  8px;

  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: auto;                 /* shell overflows & scrolls under 800px */
  font: 15px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg-rail);
  color: var(--text);
}
button, input, textarea { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,.35); border-radius: 10px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============================ shell ====================================== */
#app {
  display: grid;
  grid-template-columns: var(--rail) var(--pane) minmax(320px, 1fr) var(--members);
  grid-template-rows: 100vh;
  min-width: 800px;
  min-height: 500px;
}
#app[data-members="hidden"] {
  grid-template-columns: var(--rail) var(--pane) minmax(320px, 1fr) 0;
}
#app[data-members="hidden"] #members { display: none; }

.col { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

/* ======================== server rail =================================== */
#rail {
  background: var(--bg-rail);
  align-items: center;
  padding: 10px 0;
  gap: 8px;
  overflow-y: auto;
}
.rail-btn {
  position: relative;
  width: 44px; height: 44px;
  flex: 0 0 44px;
  border: 0;
  border-radius: 50%;
  background: var(--bg-pane);
  color: var(--text);
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: border-radius .15s ease, background .15s ease;
}
.rail-btn:hover { border-radius: 34%; background: var(--accent-warm); color: #1b1832; }
.rail-btn.active { border-radius: 34%; background: var(--accent); color: #fff; }
.rail-btn.active::before,
.rail-btn:hover::before {
  content: "";
  position: absolute;
  left: -10px; top: 50%;
  width: 4px; height: 22px;
  background: var(--text);
  border-radius: 0 4px 4px 0;
  transform: translateY(-50%);
}
.rail-btn.active::before { height: 30px; }
.rail-sep { width: 32px; height: 2px; background: var(--divider); border-radius: 2px; flex: 0 0 2px; }
.rail-btn.add { color: var(--accent-warm); background: var(--bg-pane); }
.rail-btn.add:hover { color: #1b1832; }

/* ====================== channel / dm pane ============================== */
#pane { background: var(--bg-pane); }
.pane-head {
  height: var(--header-h);
  flex: 0 0 var(--header-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px;
  font-weight: 700;
  border-bottom: 1px solid var(--divider);
  box-shadow: 0 1px 0 rgba(0,0,0,.2);
}
.pane-head .head-actions { display: flex; gap: 4px; }
.icon-btn {
  border: 0; background: transparent; color: var(--text-muted);
  width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
  display: grid; place-items: center; font-size: 16px; line-height: 1;
}
.icon-btn:hover { color: var(--text); background: var(--bg-hover); }
#btn-verify:not(.verified) { filter: saturate(1.4); }
#btn-verify.verified { color: var(--cornflower-blue); }
img.emoji { height: 1.4em; width: auto; vertical-align: -0.3em; margin: 0 1px; }
.react-chip img.emoji { height: 1.15em; vertical-align: -0.2em; }
.chan-row .tag { margin-left: auto; font-size: 11px; color: var(--cornflower-blue); }
.chan-row.blocked .name { text-decoration: line-through; opacity: .55; }
#btn-contact.on { color: var(--orange); }
#btn-block.on { color: var(--blazing-flame); }
#btn-call.active, #btn-groupcall.active { color: var(--cornflower-blue); }

#callbar, #gcallbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  background: var(--bg-active); border-bottom: 1px solid var(--divider);
  font-size: 13px; color: var(--text); }
#callbar .dot, #gcallbar .dot { width: 8px; height: 8px; border-radius: 50%;
  background: var(--cornflower-blue); animation: pulse 1.2s ease-in-out infinite; }
#callbar.connected .dot, #gcallbar.joined .dot { background: #3fbf6f; animation: none; }
#callbar .spacer, #gcallbar .spacer { flex: 1; }
#callbar button, #gcallbar button { border: 0; border-radius: 6px; padding: 6px 12px;
  font-weight: 700; font-size: 12px; cursor: pointer; }
#callbar button.accept, #gcallbar button.accept { background: #3fbf6f; color: #08240f; }
#callbar button.hangup, #gcallbar button.hangup { background: var(--blazing-flame); color: #fff; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

#call-toast, #gcall-toast { position: fixed; right: 18px; z-index: 90;
  background: var(--bg-pane); border: 1px solid var(--divider); border-radius: 10px;
  box-shadow: 0 16px 40px rgba(0,0,0,.45); padding: 14px 16px; display: flex;
  gap: 10px; align-items: center; font-size: 13px; color: var(--text); }
#call-toast { bottom: 18px; }
#gcall-toast { bottom: 92px; }
#call-toast button, #gcall-toast button { border: 0; border-radius: 6px; padding: 6px 12px;
  font-weight: 700; font-size: 12px; cursor: pointer; }
#call-toast .accept, #gcall-toast .accept { background: #3fbf6f; color: #08240f; }
#call-toast .decline, #gcall-toast .decline { background: var(--blazing-flame); color: #fff; }

.pane-scroll { flex: 1; overflow-y: auto; padding: 10px 8px; }
.group-label {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 8px 4px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-faint);
}
.group-label button { border: 0; background: transparent; color: var(--text-faint); cursor: pointer; font-size: 15px; }
.group-label button:hover { color: var(--text); }

.chan-row {
  display: flex; align-items: center; gap: 6px;
  width: 100%;
  padding: 7px 8px;
  border: 0; border-radius: 6px;
  background: transparent; color: var(--text-muted);
  cursor: pointer; text-align: left;
  font-size: 14px;
}
.chan-row:hover { background: var(--bg-hover); color: var(--text); }
.chan-row.active { background: var(--bg-active); color: #fff; }
.chan-row .hash { color: var(--text-faint); font-weight: 700; }
.chan-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chan-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: 0 0 8px; }
.chan-row .badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--blazing-flame); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px;
  text-align: center; flex: 0 0 auto; }
.chan-row .badge.muted { background: var(--text-faint); }
.chan-row.muted .name { opacity: .55; }
.chan-row.muted .hash { opacity: .55; }
.chan-row .avatar { width: 20px; height: 20px; font-size: 10px; }

/* user panel */
#user-panel {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  background: var(--bg-input);
  border-top: 1px solid var(--divider);
}
#user-panel .who { flex: 1; min-width: 0; }
#user-panel .fp {
  font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  cursor: pointer;
}
#user-panel .fp:hover { color: var(--link); }
#user-panel .sub { font-size: 11px; color: var(--text-faint); }

.avatar {
  flex: 0 0 auto;
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700;
  background: var(--space-indigo); color: var(--text);
}

/* ============================ chat ==================================== */
#chat { background: var(--bg-chat); }
.chat-head {
  height: var(--header-h);
  flex: 0 0 var(--header-h);
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  border-bottom: 1px solid var(--divider);
  box-shadow: 0 1px 0 rgba(0,0,0,.2);
}
.chat-head .title { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.chat-head .title .hash { color: var(--text-faint); }
.chat-head .spacer { flex: 1; }
.chat-head .topic {
  color: var(--text-faint); font-size: 13px;
  padding-left: 10px; margin-left: 4px; border-left: 1px solid var(--divider);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch;
}

#log { flex: 1; overflow-y: auto; padding: 14px 16px 4px; }
.msg-group { display: flex; gap: 12px; padding: 6px 0; }
.msg-group .avatar { width: 38px; height: 38px; margin-top: 2px; }
.msg-group .body { min-width: 0; flex: 1; }
.msg-group .meta { display: flex; align-items: baseline; gap: 8px; }
.msg-group .author { font-weight: 600; color: #fff; }
.msg-group .author.you { color: var(--accent-warm); }
.msg-group .stamp { font-size: 11px; color: var(--text-faint); }
.msg-group .fp { font: 11px/1 ui-monospace, monospace; color: var(--text-faint); }
.msg-line { color: var(--text); white-space: pre-wrap; word-wrap: break-word; }
.msg-line.file { color: var(--link); }
.msg-line.deleted { color: var(--text-faint); font-style: italic; }
.edited-tag { color: var(--text-faint); font-size: 11px; }
#settings-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.55);
  display: flex; align-items: flex-start; justify-content: center; padding-top: 8vh; overflow-y: auto; }
.settings-box { width: min(520px, 92vw); background: var(--bg-pane); border: 1px solid var(--divider);
  border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.5); padding: 18px 20px 22px; margin-bottom: 8vh; }
.settings-box h3 { margin: 0 0 12px; font-size: 16px; }
.set-sec { border-top: 1px solid var(--divider); padding: 12px 0; }
.set-h { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); margin-bottom: 8px; }
.set-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.set-fp { font: 12px/1.4 ui-monospace, monospace; color: var(--text-muted); word-break: break-all; flex: 1; }
.set-mono { font-size: 12px; color: var(--text-faint); line-height: 1.5; }
.settings-box button { border: 1px solid var(--divider); background: var(--bg-input); color: var(--text);
  border-radius: 7px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
.settings-box button:hover { border-color: var(--cornflower-blue); }
.set-wide { display: block; width: 100%; margin-top: 8px; text-align: left; }
.set-pill.on { background: var(--bg-active); border-color: var(--cornflower-blue); color: #fff; }
.set-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; text-transform: none; letter-spacing: 0; }
.set-toggle input { width: auto; margin: 0; }
.set-sec.danger .set-h { color: var(--blazing-flame); }
.danger-btn { border-color: var(--blazing-flame) !important; color: var(--blazing-flame) !important; }
#search-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.5);
  display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }
.search-box { width: min(560px, 92vw); background: var(--bg-pane); border: 1px solid var(--divider);
  border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.5); overflow: hidden; }
.search-box > input { width: 100%; border: 0; border-bottom: 1px solid var(--divider); background: var(--bg-input);
  color: var(--text); font-size: 15px; padding: 14px 16px; outline: none; }
.search-results { max-height: 56vh; overflow-y: auto; }
.search-hit { padding: 10px 16px; border-bottom: 1px solid var(--divider); cursor: pointer; }
.search-hit:hover { background: var(--bg-active); }
.sh-where { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; }
.sh-text { font-size: 13px; color: var(--text); margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
.sh-text mark { background: var(--orange); color: #1a1200; border-radius: 2px; }
.search-empty { padding: 16px; color: var(--text-faint); font-size: 13px; text-align: center; }
.mention { background: color-mix(in srgb, var(--cornflower-blue) 22%, transparent); color: var(--cornflower-blue);
  border-radius: 4px; padding: 0 3px; font-weight: 600; }
.mention.mention-me { background: color-mix(in srgb, var(--orange) 28%, transparent); color: var(--orange); }
.mention-badge { color: var(--orange) !important; font-weight: 700; }
#mention-popup { position: fixed; z-index: 95; background: var(--bg-pane); border: 1px solid var(--divider);
  border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.4); overflow: hidden; max-height: 220px; overflow-y: auto; }
#mention-popup .mrow { padding: 6px 12px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
#mention-popup .mrow.sel, #mention-popup .mrow:hover { background: var(--bg-active); color: var(--text); }
.reply-quote { font-size: 12px; color: var(--text-faint); border-left: 2px solid var(--divider);
  padding-left: 6px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#replybar { display: flex; align-items: center; gap: 8px; padding: 6px 16px; font-size: 12px;
  color: var(--text-muted); background: var(--bg-active); border-top: 1px solid var(--divider); }
#replybar .reply-quote { border: 0; padding: 0; margin: 0; flex: 1; }
#replybar button { border: 0; background: none; color: var(--text-faint); cursor: pointer; font-size: 13px; }
#replybar button:hover { color: var(--text); }
.msg-group { position: relative; }
.msg-actions { position: absolute; top: 2px; right: 6px; gap: 2px; }
.msg-actions button { border: 1px solid var(--divider); background: var(--bg-pane); color: var(--text-muted);
  border-radius: 5px; padding: 1px 5px; font-size: 11px; cursor: pointer; }
.msg-actions button:hover { color: var(--text); border-color: var(--cornflower-blue); }
.sys { color: var(--text-faint); font-style: italic; padding: 4px 0; font-size: 13px; }
.pin-tag { color: var(--orange); font-size: 11px; font-weight: 600; margin-bottom: 1px; }
.fwd-tag { color: var(--text-faint); font-size: 11px; font-style: italic; margin-bottom: 1px; }
#fwd-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.5);
  display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }
.msg-actions button.on { color: var(--orange); border-color: var(--orange); }
#pins-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.5);
  display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }
.pins-box { width: min(560px, 92vw); background: var(--bg-pane); border: 1px solid var(--divider);
  border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.5); overflow: hidden; }
.pins-box h3 { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--divider); font-size: 14px; }
.pins-list { max-height: 56vh; overflow-y: auto; }
.pin-row { padding: 10px 16px; border-bottom: 1px solid var(--divider); cursor: pointer; }
.pin-row:hover { background: var(--bg-active); }
.pin-row .pr-meta { font-size: 11px; color: var(--text-faint); }
.pin-row .pr-text { font-size: 13px; color: var(--text); margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
.pins-empty { padding: 16px; color: var(--text-faint); font-size: 13px; text-align: center; }
.reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.react-chip { border: 1px solid var(--divider); background: var(--bg-input); color: var(--text-muted); border-radius: 10px; padding: 1px 7px; font-size: 12px; cursor: pointer; line-height: 1.5; }
.react-chip:hover { border-color: var(--cornflower-blue); color: var(--text); }
.react-chip.on { background: var(--bg-active); border-color: var(--cornflower-blue); color: #fff; }
.react-chip.add { color: var(--text-faint); }
.empty { color: var(--text-faint); text-align: center; margin-top: 20vh; }

#typing { height: 22px; padding: 0 18px; font-size: 12px; color: var(--text-muted); font-style: italic; }

.composer { padding: 6px 16px 16px; }
.composer form {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-input);
  border-radius: var(--radius);
  padding: 0 6px 0 14px;
}
.composer input {
  flex: 1;
  border: 0; background: transparent; outline: none;
  padding: 12px 0;
}
.composer input::placeholder { color: var(--text-faint); }
.composer button {
  border: 0; cursor: pointer;
  background: var(--accent); color: #fff;
  font-weight: 700;
  border-radius: 6px;
  padding: 8px 14px;
  margin: 5px 0;
}
.composer button:hover { background: var(--accent-warm); color: #1b1832; }
.composer button:disabled { opacity: .4; cursor: default; }
.composer #attach {
  background: transparent; color: var(--text-faint); font-weight: 400;
  font-size: 17px; padding: 6px 4px; margin: 0;
}
.composer #attach:hover:not(:disabled) { background: transparent; color: var(--text); }

/* ========================== members ================================== */
#members { background: var(--bg-pane); border-left: 1px solid var(--divider); }
#members .pane-head { justify-content: flex-start; gap: 8px; font-size: 13px; color: var(--text-muted); }
.role-label {
  padding: 14px 12px 4px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--text-faint);
}
.member-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px;
  color: var(--text-muted); font-size: 14px;
}
.member-row .avatar { width: 26px; height: 26px; font-size: 10px; }
.member-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.member-row.you .name { color: var(--accent-warm); }
.member-row .kick { margin-left: 2px; border: 0; background: transparent; color: var(--text-faint); cursor: pointer; font-size: 14px; line-height: 1; visibility: hidden; }
.member-row:hover .kick { visibility: visible; }
.member-row .kick:hover { color: var(--accent); }

/* misc */
.hint { padding: 16px; color: var(--text-faint); font-size: 13px; }

/* onboarding */
#onboard { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg-rail); z-index: 50; padding: 24px; overflow: auto; }
#onboard .card { width: 460px; max-width: 100%; background: var(--bg-pane); border: 1px solid var(--divider); border-radius: 12px; padding: 26px; }
#onboard h1 { margin: 0 0 4px; font-size: 22px; }
#onboard h1 b { color: var(--accent); }
#onboard p { color: var(--text-muted); font-size: 14px; margin: 6px 0 16px; }
#onboard label { display: block; font-size: 12px; color: var(--text-faint); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
#onboard input, #onboard textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--divider); border-radius: 6px; color: var(--text); padding: 10px; font: inherit; }
#onboard textarea { min-height: 84px; resize: vertical; font-family: ui-monospace, monospace; font-size: 12px; }
#onboard .row { display: flex; gap: 10px; margin-top: 18px; }
#onboard button { flex: 1; border: 0; border-radius: 6px; padding: 11px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; }
#onboard button.ghost { background: var(--bg-input); color: var(--text); border: 1px solid var(--divider); }
#onboard button:hover { background: var(--accent-warm); color: #1b1832; }
#onboard .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
#onboard .tabs button { flex: 1; background: var(--bg-input); color: var(--text-muted); border: 1px solid var(--divider); font-weight: 600; padding: 8px; }
#onboard .tabs button.on { background: var(--bg-active); color: #fff; }
#onboard .err { color: var(--accent); font-size: 13px; min-height: 1.2em; margin-top: 8px; }
#onboard .blob { background: var(--bg-input); border: 1px solid var(--divider); border-radius: 6px; padding: 10px; font: 11px/1.4 ui-monospace, monospace; word-break: break-all; color: var(--text-muted); max-height: 140px; overflow: auto; }

/* ---- in-app modal dialogs (replace window.alert / prompt / confirm) ----- */
#modal-layer { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
  background: rgba(10, 8, 20, 0.55); backdrop-filter: blur(2px); padding: 24px; }
#modal-layer.closing { animation: modal-out .12s ease forwards; }
.modal { width: 420px; max-width: 100%; background: var(--bg-pane); color: var(--text);
  border: 1px solid var(--divider); border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
  padding: 22px; animation: modal-in .14s cubic-bezier(.2,.9,.3,1); }
.modal h2 { margin: 0 0 10px; font-size: 16px; font-weight: 700; }
.modal .msg { white-space: pre-wrap; color: var(--text-muted); font-size: 13.5px; line-height: 1.5; margin-bottom: 14px; }
.modal .msg code { background: var(--bg-input); padding: 1px 5px; border-radius: 4px; font-size: 12px; word-break: break-all; }
.modal input, .modal textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--divider);
  border-radius: 6px; color: var(--text); padding: 9px 10px; font: inherit; margin-bottom: 4px; }
.modal textarea { min-height: 90px; resize: vertical; font: 12px/1.4 ui-monospace, monospace; }
.modal input:focus, .modal textarea:focus { outline: 2px solid var(--cornflower-blue); outline-offset: -1px; border-color: transparent; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.modal button { border: 0; border-radius: 6px; padding: 8px 16px; font-weight: 700; font-size: 13px; cursor: pointer;
  background: var(--accent); color: #fff; }
.modal button:hover { background: var(--accent-warm); color: #1b1832; }
.modal button.ghost { background: var(--bg-input); color: var(--text); border: 1px solid var(--divider); }
.modal button.ghost:hover { background: var(--bg-hover); color: var(--text); }
.modal button.danger { background: var(--blazing-flame); }
@keyframes modal-in  { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes modal-out { to { opacity: 0; } }

/* ======================= motion / micro-interactions ================== */
@keyframes fade-in   { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop-in    { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes toast-in  { from { opacity: 0; transform: translateX(24px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes slide-down { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes badge-pop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes msg-in    { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.msg-fresh { animation: msg-in .18s ease; }

#modal-layer { animation: fade-in .14s ease; }

/* Full-screen overlays fade their scrim and pop their card. */
#search-overlay, #settings-overlay, #pins-overlay, #fwd-overlay { animation: fade-in .16s ease; }
.search-box, .settings-box, .pins-box { animation: pop-in .18s cubic-bezier(.2,.9,.3,1); }
#mention-popup { animation: pop-in .12s cubic-bezier(.2,.9,.3,1); }

/* Toasts slide in from the right (JS only rebuilds them when they change). */
#call-toast:not([hidden]), #gcall-toast:not([hidden]) { animation: toast-in .22s cubic-bezier(.2,.9,.3,1); }

/* Bars that appear above the composer / log. */
#replybar:not([hidden]), #callbar:not([hidden]), #gcallbar:not([hidden]) { animation: slide-down .16s ease; }

/* Header icon buttons: lift on hover, squash on press. */
.icon-btn { transition: background .13s ease, color .13s ease, transform .12s ease; }
.icon-btn:hover  { transform: translateY(-1px); }
.icon-btn:active { transform: translateY(0) scale(.88); }

/* Rail server buttons. */
.rail-btn { transition: border-radius .15s ease, background .15s ease, transform .15s cubic-bezier(.2,.9,.3,1), color .15s ease; }
.rail-btn:hover  { transform: scale(1.06); }
.rail-btn:active { transform: scale(.94); }

/* Sidebar rows: quick tint + a growing left accent. */
.chan-row { transition: background .12s ease, color .12s ease, box-shadow .14s ease, transform .12s ease; }
.chan-row:hover  { box-shadow: inset 3px 0 0 var(--accent-warm); }
.chan-row.active { box-shadow: inset 3px 0 0 var(--accent); }
.chan-row:active { transform: scale(.985); }
.chan-row .badge { animation: badge-pop .24s cubic-bezier(.2,1.6,.4,1); transition: background .15s ease; }

/* Message hover actions: fade+rise instead of a hard show/hide. */
.msg-actions { display: flex; opacity: 0; transform: translateY(-3px);
  pointer-events: none; transition: opacity .12s ease, transform .12s ease; }
.msg-group:hover .msg-actions,
.msg-actions:focus-within { opacity: 1; transform: none; pointer-events: auto; }

/* Generic press feedback for the various pill / row / chip buttons. */
.modal button, .composer button, #onboard button,
#call-toast button, #gcall-toast button, #callbar button, #gcallbar button,
.search-hit, .pin-row, #mention-popup .mrow, .msg-actions button {
  transition: background .15s ease, border-color .15s ease, color .15s ease, transform .11s ease;
}
.modal button:active, .composer button:not(#attach):active, #onboard button:active,
#call-toast button:active, #gcall-toast button:active,
#callbar button:active, #gcallbar button:active { transform: scale(.95); }
.react-chip { transition: background .15s ease, border-color .15s ease, color .15s ease, transform .12s cubic-bezier(.2,.9,.3,1); }
.react-chip:hover  { transform: translateY(-1px); }
.react-chip:active { transform: scale(.9); }
.search-hit:active, .pin-row:active, #mention-popup .mrow:active { transform: scale(.99); }

#log { scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>

<div id="onboard" hidden>
  <div class="card">
    <h1>Welcome to <b>DaNTe</b></h1>
    <div id="ob-body"></div>
    <div class="err" id="ob-err"></div>
  </div>
</div>

<div id="app" data-members="shown">

  <!-- ---------- server rail ---------- -->
  <nav id="rail" class="col" aria-label="Servers"></nav>

  <!-- ---------- channel / DM pane ---------- -->
  <section id="pane" class="col">
    <header class="pane-head">
      <span id="pane-title">DaNTe</span>
      <span class="head-actions" id="pane-actions"></span>
    </header>
    <div class="pane-scroll" id="pane-list"></div>
    <div id="user-panel">
      <div class="avatar" id="me-avatar">·</div>
      <div class="who">
        <div class="fp" id="me-fp" title="click to copy">…</div>
        <div class="sub" id="me-sub">connecting…</div>
      </div>
      <button class="icon-btn" id="me-gear" title="recovery phrase">⚙</button>
    </div>
  </section>

  <!-- ---------- chat ---------- -->
  <section id="chat" class="col">
    <header class="chat-head">
      <span class="title" id="chat-title"><span class="hash">#</span> …</span>
      <span class="topic" id="chat-topic"></span>
      <span class="spacer"></span>
      <button class="icon-btn" id="btn-mute" title="Mute notifications" hidden>🔔</button>
      <button class="icon-btn" id="btn-call" title="Start a voice call" hidden>📞</button>
      <button class="icon-btn" id="btn-groupcall" title="Start a group call" hidden>📞👥</button>
      <button class="icon-btn" id="btn-contact" title="Save as contact" hidden>☆</button>
      <button class="icon-btn" id="btn-leave" title="Leave channel" hidden>🚪</button>
      <button class="icon-btn" id="btn-delchan" title="Delete channel" hidden>🗑</button>
      <button class="icon-btn" id="btn-block" title="Block" hidden>🚫</button>
      <button class="icon-btn" id="btn-verify" title="Safety number" hidden>🛡️</button>
      <button class="icon-btn" id="btn-emoji" title="Custom emoji" hidden>😀</button>
      <button class="icon-btn" id="btn-invite" title="Invite by fingerprint" hidden>➕👤</button>
      <button class="icon-btn" id="btn-link" title="Create invite link" hidden>🔗</button>
      <button class="icon-btn" id="btn-pins" title="Pinned messages" hidden>📌</button>
      <button class="icon-btn" id="btn-search" title="Search messages (Ctrl+K)">🔍</button>
      <button class="icon-btn" id="btn-members" title="Toggle member list">👥</button>
      <input type="file" id="emoji-file" accept="image/*" hidden>
    </header>
    <div id="callbar" hidden></div>
    <div id="gcallbar" hidden></div>
    <div id="log"><div class="empty">Pick a channel or start a DM.</div></div>
    <div id="typing"></div>
    <div id="replybar" hidden></div>
    <div class="composer">
      <form id="composer">
        <button type="button" id="attach" title="Attach a file (DMs only)" disabled>📎</button>
        <input id="text" autocomplete="off" placeholder="Message" disabled />
        <button id="send" disabled>Send</button>
      </form>
      <input type="file" id="chat-file" hidden>
    </div>
  </section>

  <!-- ---------- members ---------- -->
  <aside id="members" class="col" aria-label="Members">
    <header class="pane-head"><span id="members-count">Members</span></header>
    <div class="pane-scroll" id="members-list"></div>
  </aside>

</div>

<div id="call-toast" hidden></div>
<div id="gcall-toast" hidden></div>

<script>
"use strict";
/* ============================================================================
   Small modular front-end. Sections: dom helpers · store · api · views · wiring.
   No framework, no build step (served via include_str! by `dante serve`).
   ========================================================================== */

/* ---------- constants -------------------------------------------------- */
const PERM_SEND = 1, PERM_KICK = 2, PERM_MANAGE_CHANNELS = 4, PERM_MANAGE_ROLES = 8;

/* ---------- dom helpers -------------------------------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const initials = s => (s || "?").replace(/[^a-z0-9]/gi, "").slice(0, 2).toUpperCase() || "?";
const short = s => (s && s.includes("-")) ? s.split("-").slice(0, 2).join("-") : (s || "");

/* messaging yourself is a local-only "Private Note" — no relay round-trip,
   so it never comes back and doubles. */
const isSelf  = fp => !!fp && store.me.fingerprint &&
  (fp === store.me.fingerprint || short(fp) === short(store.me.fingerprint));
const petname = fp => { const c = store.contacts.find(c => c.fp === fp); return c && c.petname ? c.petname : null; };
const isBlocked = fp => store.blocked.includes(fp);
const dmLabel = fp => isSelf(fp) ? "Private Note" : (petname(fp) || short(fp));

const LS = {
  get(k, d) { try { const v = localStorage.getItem("dante." + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("dante." + k, JSON.stringify(v)); } catch (_) {} },
};

/* ---------- store ------------------------------------------------------- */
const store = {
  me: { fingerprint: "", words: "" },
  channels: [],                       // [{id,name,server}]
  dms: LS.get("dms", []),             // [{fp}]
  messages: [],                       // flat inbox, each tagged with _target
  seen: 0,
  unread: new Map(),                  // target -> count of unseen messages
  mentions: new Set(),               // targets where I was @-mentioned
  muted: new Set(LS.get("muted", [])), // targets with notifications silenced
  view: LS.get("view", { server: "@dm", target: null }),
  typingText: "",
  policies: {},                       // server root -> policy JSON
  reactions: {},                      // ref_seq -> [{emoji,count,by}]
  pins: {},                           // "#channel" -> { ref_seq: {by, at_ms} }
  dmEdits: {},                        // dm msg_id (hex) -> { text, deleted }
  safety: {},                         // dm fp -> {number,verified,available}
  emojis: {},                         // server root -> { shortcode: hexhash }
  contacts: [],                       // [{fp,petname,verified,added_ms}]
  blocked: [],                        // [fp]
  calls: [],                          // [{peer,state,incoming}]
  groupCalls: [],                     // [{channel,channel_name,joined,participants,invited_by}]

  roleName(root, memberFp) {
    const p = this.policies[root];
    if (!p) return null;
    if (memberFp === p.owner) return "Owner";
    const a = (p.assignments || []).find(x => x.member === memberFp);
    if (!a) return null;
    const rs = p.roles.filter(r => a.roles.includes(r.id)).sort((x, y) => y.rank - x.rank);
    return rs[0] ? rs[0].name : null;
  },
  myPerms(root) { return (this.policies[root] || {}).me_perms || PERM_SEND; },

  servers() {
    const names = [];
    for (const c of this.channels) if (!names.includes(c.server)) names.push(c.server);
    return names;
  },
  channelsOf(server) { return this.channels.filter(c => c.server === server); },
  rootOf(server) { const c = this.channels.find(c => c.server === server); return c ? c.root : null; },
  channelName(id) { const c = this.channels.find(c => c.id === id); return c ? c.name : short(id); },
  msgsFor(target) { return this.messages.filter(m => m._target === target); },
  membersFor(target) {
    const set = new Set();
    for (const m of this.msgsFor(target)) if (m.from && m.from !== "you") set.add(m.from);
    return [...set].sort((a, b) => a.localeCompare(b));
  },

  unreadFor(t) { return this.unread.get(t) || 0; },
  bumpUnread(t) { this.unread.set(t, this.unreadFor(t) + 1); },
  totalUnread() { let n = 0; for (const [t, c] of this.unread) if (!this.muted.has(t)) n += c; return n; },
  isMuted(t) { return this.muted.has(t); },
  toggleMute(t) {
    if (this.muted.has(t)) this.muted.delete(t); else this.muted.add(t);
    LS.set("muted", [...this.muted]);
  },
};

/* ---------- api ------------------------------------------------------- */
const api = {
  async get(p) { const r = await fetch(p); if (!r.ok) throw new Error(await r.text()); return r.json(); },
  async post(p, body) {
    const r = await fetch(p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const t = await r.text();
    if (!r.ok) throw new Error(t || r.statusText);
    try { return JSON.parse(t); } catch (_) { return {}; }
  },
  me()        { return this.get("/api/me"); },
  channels()  { return this.get("/api/channels"); },
  messages(since) { return this.get("/api/messages?since=" + since); },
  typing()    { return this.get("/api/typing"); },
  send(to, text, replyTo) { return this.post("/api/send", replyTo ? { to, text, reply_to: replyTo } : { to, text }); },
  editDm(peer, msgId, text) { return this.post("/api/dm/edit", { peer, msg_id: msgId, text }); },
  forward(to, origin, text) { return this.post("/api/forward", { to, origin, text }); },
  createServer(name)      { return this.post("/api/server", { name }); },
  createChannel(server, name, password) { return this.post("/api/channel", { server, name, password: password || "" }); },
  invite(channel, peer)   { return this.post("/api/invite", { channel, peer }); },
  policy(root)            { return this.get("/api/policy?server=" + encodeURIComponent(root)); },
  sendTyping(to)          { return fetch("/api/typing", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ to }) }).catch(() => {}); },
};

/* ---------- in-app modal dialogs -------------------------------------- */
/* Renders `msg` with pre-wrap; a fragment wrapped in <code>…</code> is kept
   as an element (so long fingerprints/links wrap nicely). */
function modalMsg(msg) {
  const box = el("div", "msg");
  const parts = String(msg).split(/(<code>[\s\S]*?<\/code>)/);
  for (const p of parts) {
    const m = p.match(/^<code>([\s\S]*)<\/code>$/);
    if (m) box.appendChild(Object.assign(el("code"), { textContent: m[1] }));
    else if (p) box.appendChild(document.createTextNode(p));
  }
  return box;
}

let modalDepth = 0;
function openModal({ title, msg, fields, buttons }) {
  return new Promise(resolve => {
    const layer = el("div"); layer.id = "modal-layer";
    const card = el("div", "modal");
    if (title) card.appendChild(Object.assign(el("h2"), { textContent: title }));
    if (msg != null) card.appendChild(modalMsg(msg));

    const inputs = {};
    for (const f of (fields || [])) {
      if (f.type === "check") {
        const wrap = el("label"); wrap.style.cssText = "display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px;color:var(--text);text-transform:none;letter-spacing:0";
        const cb = el("input"); cb.type = "checkbox"; cb.checked = !!f.value;
        cb.style.cssText = "width:auto;margin:0";
        wrap.appendChild(cb);
        wrap.appendChild(document.createTextNode(f.label));
        card.appendChild(wrap);
        inputs[f.name] = cb;
        continue;
      }
      if (f.label) card.appendChild(Object.assign(el("label"), { textContent: f.label, style: "display:block;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px" }));
      const inp = el(f.multiline ? "textarea" : "input");
      if (!f.multiline) inp.type = f.password ? "password" : "text";
      if (f.placeholder) inp.placeholder = f.placeholder;
      if (f.value != null) inp.value = f.value;
      card.appendChild(inp);
      inputs[f.name] = inp;
    }

    const row = el("div", "row");
    const done = val => {
      layer.classList.add("closing");
      setTimeout(() => layer.remove(), 120);
      modalDepth--;
      document.removeEventListener("keydown", onKey);
      resolve(val);
    };
    const cancelVal = () => buttons.find(b => b.cancel)?.value ?? null;
    let primaryBtn = null;
    for (const b of buttons) {
      const btn = Object.assign(el("button", b.class || ""), { textContent: b.label });
      btn.onclick = () => done(typeof b.value === "function" ? b.value(inputs) : b.value);
      if (b.primary) primaryBtn = btn;
      row.appendChild(btn);
    }
    card.appendChild(row);
    layer.appendChild(card);
    layer.onclick = e => { if (e.target === layer) done(cancelVal()); };
    const onKey = e => {
      if (e.key === "Escape") { e.preventDefault(); done(cancelVal()); }
      else if (e.key === "Enter" && !e.shiftKey && primaryBtn && document.activeElement.tagName !== "TEXTAREA") {
        e.preventDefault();
        primaryBtn.click();
      }
    };
    document.addEventListener("keydown", onKey);
    document.body.appendChild(layer);
    modalDepth++;
    const first = card.querySelector("input, textarea, button");
    if (first) first.focus();
  });
}

const ui = {
  /* Prompt for one line of text. Returns the trimmed value, or null if cancelled. */
  async ask(msg, def, opts = {}) {
    const v = await openModal({
      title: opts.title || "",
      msg,
      fields: [{ name: "v", value: def || "", password: !!opts.password, multiline: !!opts.multiline, placeholder: opts.placeholder || "" }],
      buttons: [
        { label: "Cancel", class: "ghost", value: null, cancel: true },
        { label: opts.ok || "OK", primary: true, value: i => i.v.value },
      ],
    });
    return v == null ? null : v.trim();
  },
  /* Show a message with an OK button. */
  say(msg, opts = {}) {
    return openModal({
      title: opts.title || "",
      msg,
      buttons: [{ label: opts.ok || "OK", primary: true, value: true, cancel: true, class: opts.danger ? "danger" : "" }],
    });
  },
  /* Ask a yes/no question. Resolves true / false. */
  async confirm(msg, opts = {}) {
    return !!(await openModal({
      title: opts.title || "",
      msg,
      buttons: [
        { label: opts.cancelLabel || "Cancel", class: "ghost", value: false, cancel: true },
        { label: opts.ok || "OK", primary: true, value: true, class: opts.danger ? "danger" : "" },
      ],
    }));
  },
  /* Collect several fields at once. `fields`: [{name,label,value,password,multiline,placeholder}].
     Resolves an object of trimmed values, or null if cancelled. */
  async form(title, fields, opts = {}) {
    const r = await openModal({
      title, msg: opts.msg,
      fields,
      buttons: [
        { label: "Cancel", class: "ghost", value: null, cancel: true },
        { label: opts.ok || "Save", primary: true, value: i => {
          const out = {};
          for (const f of fields) out[f.name] = f.type === "check" ? i[f.name].checked : i[f.name].value.trim();
          return out;
        } },
      ],
    });
    return r;
  },
  sys(text) {
    const log = $("#log");
    if (log.querySelector(".empty")) log.innerHTML = "";
    log.appendChild(el("div", "sys", text));
    log.scrollTop = log.scrollHeight;
  },
};

/* ---------- view helpers -------------------------------------------- */
const isDM      = () => store.view.server === "@dm";
const curTarget = () => store.view.target;

function selectTarget(server, target) {
  store.view = { server, target };
  LS.set("view", store.view);
  store.unread.delete(target);
  store.mentions.delete(target);
  render();
  const box = $("#text");
  box.disabled = !target; $("#send").disabled = !target;
  // Attachments go through the DM file-transfer path only.
  $("#attach").disabled = !target || target.startsWith("#") || isSelf(target);
  if (target) box.focus();
}

/* ---------- renderers --------------------------------------------- */
function renderRail() {
  const rail = $("#rail");
  rail.innerHTML = "";

  const dm = el("button", "rail-btn" + (isDM() ? " active" : ""), "DM");
  dm.title = "Direct Messages";
  dm.onclick = () => selectTarget("@dm", store.dms[0] ? store.dms[0].fp : null);
  rail.appendChild(dm);
  rail.appendChild(el("div", "rail-sep"));

  for (const name of store.servers()) {
    const b = el("button", "rail-btn" + (store.view.server === name ? " active" : ""), initials(name));
    b.title = name;
    b.onclick = () => { const ch = store.channelsOf(name)[0]; selectTarget(name, ch ? "#" + ch.id : null); };
    rail.appendChild(b);
  }

  const add = el("button", "rail-btn add", "+");
  add.title = "Create a server";
  add.onclick = createServerFlow;
  rail.appendChild(add);

  const join = el("button", "rail-btn add", "🔗");
  join.title = "Join with an invite link";
  join.onclick = redeemFlow;
  rail.appendChild(join);

  const disc = el("button", "rail-btn add", "🧭");
  disc.title = "Browse public servers";
  disc.onclick = discoverFlow;
  rail.appendChild(disc);
}

async function discoverFlow() {
  let list;
  try { list = await api.get("/api/discover"); }
  catch (e) { return ui.say("Could not load discovery: " + e.message); }
  if (!list.length) return ui.say("No public servers listed right now.");
  const menu = list.map((s, i) =>
    `${i + 1}. ${s.name}${s.summary ? " — " + s.summary : ""}${s.tags && s.tags.length ? "  [" + s.tags.join(", ") + "]" : ""}`
  ).join("\n");
  const pick = parseInt(await ui.ask("Public servers:\n\n" + menu + "\n\nJoin which number?"), 10);
  const chosen = list[pick - 1];
  if (!chosen) return;
  const password = await ui.ask("Server password? (blank if none)") || "";
  try {
    await api.post("/api/discover/join", { server: chosen.root, password });
    ui.sys(`Joining "${chosen.name}" — you'll appear once the host is online.`);
    setTimeout(refreshChannels, 3000);
  } catch (e) { ui.say("Join failed: " + e.message); }
}

async function publishFlow(server) {
  const root = store.rootOf(server);
  if (!root) return ui.say("Unknown server root.");
  if (!await ui.confirm('List "' + server + '" on the public discovery directory? Anyone will be able to join (subject to a join password if set).', { ok: "List it" })) {
    if (await ui.confirm("Remove it from discovery instead?", { ok: "Unlist" })) {
      try { await api.post("/api/discover", { server: root, on: false }); ui.sys("Unlisted."); }
      catch (e) { ui.say("Failed: " + e.message); }
    }
    return;
  }
  const f = await ui.form("Public listing", [
    { name: "summary", label: "Short description (optional)" },
    { name: "tags", label: "Tags, comma-separated (optional)" },
  ], { ok: "Publish" });
  if (!f) return;
  const tags = (f.tags || "").split(",").map(t => t.trim()).filter(Boolean);
  try {
    await api.post("/api/discover", { server: root, on: true, summary: f.summary || "", tags });
    ui.sys("Server is now public.");
  } catch (e) { ui.say("Could not publish (host only): " + e.message); }
}

  const srvRoot = store.rootOf(server);

// Append an unread-count badge (or nothing) to a sidebar row.

let msgPaintTs = 0;
function renderChat() {
  const target = curTarget();
  const titleEl = $("#chat-title");
  const log = $("#log");
  const inviteBtn = $("#btn-invite");
  const linkBtn = $("#btn-link");
  const verifyBtn = $("#btn-verify");
  verifyBtn.hidden = true;
  const emojiBtn = $("#btn-emoji");
  emojiBtn.hidden = true;
  const contactBtn = $("#btn-contact");
  contactBtn.hidden = true;
  const blockBtn = $("#btn-block");
  blockBtn.hidden = true;
  const leaveBtn = $("#btn-leave");
  leaveBtn.hidden = true;
  const delChanBtn = $("#btn-delchan");
  delChanBtn.hidden = true;
  const pinsBtn = $("#btn-pins");
  pinsBtn.hidden = true;
  const muteBtn = $("#btn-mute");
  muteBtn.hidden = true;
  const callBtn = $("#btn-call");
  callBtn.hidden = true;
  const gcallBtn = $("#btn-groupcall");
  gcallBtn.hidden = true;
  $("#callbar").hidden = true;
  $("#gcallbar").hidden = true;

  if (!target) {
    titleEl.innerHTML = '<span class="hash">#</span> —';
    $("#chat-topic").textContent = "";
    inviteBtn.hidden = true; linkBtn.hidden = true;
    log.innerHTML = '<div class="empty">Pick a channel or start a DM.</div>';
    return;
  }

  if (!isSelf(target)) {
    muteBtn.hidden = false;
    const m = store.isMuted(target);
    muteBtn.textContent = m ? "🔕" : "🔔";
    muteBtn.title = m ? "Notifications muted — click to unmute" : "Mute notifications";
    muteBtn.onclick = () => { store.toggleMute(target); render(); };
  }

  if (target.startsWith("#")) {
    titleEl.innerHTML = '<span class="hash">#</span> ' + esc(store.channelName(target.slice(1)));
    $("#chat-topic").textContent = store.view.server;
    inviteBtn.hidden = false;
    inviteBtn.onclick = () => inviteFlow(target);
    linkBtn.hidden = false;
    linkBtn.onclick = () => inviteLinkFlow(target);
    emojiBtn.hidden = false;
    emojiBtn.onclick = () => emojiFlow(store.rootOf(store.view.server));
    pinsBtn.hidden = false;
    pinsBtn.onclick = () => openPins(target);
    const gc = groupCallFor(target.slice(1));
    gcallBtn.hidden = false;
    gcallBtn.classList.toggle("active", !!(gc && gc.joined));
    gcallBtn.title = gc && gc.joined ? "In the group call — open the bar to leave"
      : gc ? "Join the group call" : "Start a group call";
    gcallBtn.onclick = () => {
      if (gc && gc.joined) return;
      groupCallAction(target.slice(1), gc ? "join" : "start");
    };
    const root = store.rootOf(store.view.server);
    const iOwn = root && store.policies[root] && store.policies[root].owner === store.me.fingerprint;
    if (iOwn) {
      delChanBtn.hidden = false;
      delChanBtn.onclick = async () => {
        if (!await ui.confirm("Delete #" + store.channelName(target.slice(1)) + " for everyone? This cannot be undone.")) return;
        try { await api.post("/api/channel/delete", { channel: target }); await refreshChannels(); selectTarget("@dm", null); }
        catch (e) { ui.sys("delete failed: " + e.message); }
      };
    } else {
      leaveBtn.hidden = false;
      leaveBtn.onclick = async () => {
        if (!await ui.confirm("Leave " + store.channelName(target.slice(1)) + "? You'll need a new invite to rejoin.")) return;
        try { await api.post("/api/leave", { channel: target }); await refreshChannels(); selectTarget("@dm", null); }
        catch (e) { ui.sys("leave failed: " + e.message); }
      };
    }
  } else if (isSelf(target)) {
    titleEl.innerHTML = '<span class="hash">📝</span> Private Note';
    $("#chat-topic").textContent = "only you can see this";
    inviteBtn.hidden = true; linkBtn.hidden = true;
  } else {
    titleEl.innerHTML = '<span class="hash">@</span> ' + esc(dmLabel(target));
    $("#chat-topic").textContent = "direct message · " + target;
    inviteBtn.hidden = true; linkBtn.hidden = true;

    const known = store.contacts.some(c => c.fp === target);
    contactBtn.hidden = false;
    contactBtn.textContent = known ? "★" : "☆";
    contactBtn.classList.toggle("on", known);
    contactBtn.title = known ? "Edit contact" : "Save as contact";
    contactBtn.onclick = () => contactFlow(target);

    const ac = callFor(target);
    callBtn.hidden = false;
    callBtn.classList.toggle("active", !!ac);
    callBtn.title = ac ? "In a call — open the call bar to hang up" : "Start a voice call";
    callBtn.onclick = () => { if (!ac) callAction(target, "start"); };

    const blk = isBlocked(target);
    blockBtn.hidden = false;
    blockBtn.classList.toggle("on", blk);
    blockBtn.title = blk ? "Unblock" : "Block";
    blockBtn.onclick = async () => {
      try { await api.post(blk ? "/api/unblock" : "/api/block", { peer: target }); await refreshBlocked(); }
      catch (e) { ui.sys("block failed: " + e.message); }
    };
    if (blk) {
      $("#chat-topic").textContent = "blocked — their messages are hidden";
      $("#log").innerHTML = '<div class="empty">You blocked this person. Their messages and typing are hidden. Unblock (🚫) to resume.</div>';
      $("#typing").textContent = "";
      $("#text").disabled = true; $("#send").disabled = true;
      return;
    }

    const s = store.safety[target];
    if (s === undefined) { loadSafety(target); }
    else if (s && s.available) {
      verifyBtn.hidden = false;
      verifyBtn.textContent = s.verified ? "🛡️" : "⚠️";
      verifyBtn.classList.toggle("verified", !!s.verified);
      verifyBtn.title = s.verified ? "Verified — safety number confirmed" : "Unverified — compare the safety number";
      verifyBtn.onclick = () => verifyFlow(target);
    }
  }

  const msgs = store.msgsFor(target);
  log.innerHTML = "";
  if (!msgs.length) {
    log.appendChild(el("div", "empty", "No messages yet — say hello."));
    renderCallbar(); renderGroupCallbar();
    return;
  }

  let lastAuthor = null;
  const freshCut = msgPaintTs;   // groups newer than the last paint slide in
  for (const m of msgs) {
    if (m.kind === "file") {
      const g = groupShell(m, m.from === lastAuthor);
      if (m._at && m._at > freshCut - 80) g.node.classList.add("msg-fresh");
      g.body.appendChild(Object.assign(el("div", "msg-line file"),
        { textContent: `📎 ${m.filename} (${m.size} bytes)` + (m.saved ? ` — saved to ${m.saved}` : "") }));
      log.appendChild(g.node); lastAuthor = m.from;
      continue;
    }
    const g = groupShell(m, m.from === lastAuthor);
    if (m._at && m._at > freshCut - 80) g.node.classList.add("msg-fresh");
    if (m.reply_to && !m._deleted) {
      const tgt = store.messages.find(x => x.kind === "channel" && x._target === target && x.ref_seq === m.reply_to);
      const q = el("div", "reply-quote");
      if (tgt) {
        const who = tgt.from === "you" ? "you" : short(tgt.from);
        q.textContent = "↩ " + who + ": " + (tgt._deleted ? "(deleted)" : (tgt.text || "").slice(0, 100));
      } else {
        q.textContent = "↩ replying to an earlier message";
      }
      g.body.appendChild(q);
    }
    const pinned = target.startsWith("#") && store.pins[target] && store.pins[target][m.ref_seq];
    if (pinned && !m._deleted) {
      g.body.appendChild(Object.assign(el("div", "pin-tag"), { textContent: "📌 pinned" }));
    }
    const dmEd = (!target.startsWith("#") && m.msg_id) ? store.dmEdits[m.msg_id] : null;
    const deleted = m._deleted || (dmEd && dmEd.deleted);
    let bodyText = dmEd ? dmEd.text : m.text;
    let fwdOrigin = null;
    if (!deleted) {
      if (target.startsWith("#") && m.forwarded_from) {
        fwdOrigin = m.forwarded_from;
      } else if (!target.startsWith("#") && bodyText.startsWith(FWD_PREFIX)) {
        const nl = bodyText.indexOf("\n");
        fwdOrigin = bodyText.slice(FWD_PREFIX.length, nl < 0 ? undefined : nl);
        bodyText = nl < 0 ? "" : bodyText.slice(nl + 1);
      }
    }
    if (fwdOrigin) g.body.appendChild(Object.assign(el("div", "fwd-tag"),
      { textContent: "↪ Forwarded from " + fwdOrigin }));
    const line = el("div", "msg-line");
    if (deleted) {
      line.className = "msg-line deleted";
      line.textContent = "(message deleted)";
    } else if (target.startsWith("#")) {
      line.innerHTML = richText(bodyText);
      if (m._edited) line.appendChild(Object.assign(el("span", "edited-tag"), { textContent: " (edited)" }));
    } else {
      line.textContent = bodyText;
      if (dmEd) line.appendChild(Object.assign(el("span", "edited-tag"), { textContent: " (edited)" }));
    }
    g.body.appendChild(line);
    if (target.startsWith("#") && m.ref_seq && !m._deleted) {
      addMsgActions(g.body, target, m);
      renderReactions(g.body, target, m.ref_seq);
    }
    if (!target.startsWith("#") && !deleted && !isSelf(target)) {
      addDmActions(g.body, target, m, bodyText);
    }
    if (m.ref_seq) g.node._refSeq = m.ref_seq;
    log.appendChild(g.node);
    lastAuthor = m.from;
  }
  log.scrollTop = log.scrollHeight;
  msgPaintTs = Date.now();
  renderCallbar();
  renderGroupCallbar();
  renderReplyBar();
}

const QUICK_EMOJI = ["👍", "❤️", "😂", "🎉", "🔥", "👀", "✅"];
const FWD_PREFIX = "↪ Forwarded from ";

// Reply / forward / edit / delete affordances on channel messages.
function addMsgActions(body, channelTarget, m) {
  if (!m.ref_seq) return;
  const bar = el("div", "msg-actions");
  const reply = el("button", null, "↩"); reply.title = "Reply";
  reply.onclick = () => {
    store._replyTo = { target: channelTarget, seq: m.ref_seq, from: m.from, text: m.text };
    renderReplyBar();
    $("#text").focus();
  };
  bar.appendChild(reply);
  const fwd = el("button", null, "↪"); fwd.title = "Forward";
  fwd.onclick = () => openForwardPicker(m, channelTarget);
  bar.appendChild(fwd);
  const isPinned = store.pins[channelTarget] && store.pins[channelTarget][m.ref_seq];
  const pin = el("button", isPinned ? "on" : null, "📌");
  pin.title = isPinned ? "Unpin" : "Pin";
  pin.onclick = async () => {
    try { await api.post("/api/pin", { channel: channelTarget, seq: m.ref_seq, pinned: !isPinned }); }
    catch (e) { ui.say("Pin failed: " + e.message); }
  };
  bar.appendChild(pin);
  if (m.from === "you") {
    const edit = el("button", null, "✎"); edit.title = "Edit";
    edit.onclick = async () => {
      const t = await ui.ask("Edit message", m.text);
      if (t == null || t === m.text) return;
      try { await api.post("/api/edit", { channel: channelTarget, seq: m.ref_seq, text: t }); }
      catch (e) { ui.say("Edit failed: " + e.message); }
    };
    const del = el("button", null, "🗑"); del.title = "Delete";
    del.onclick = async () => {
      if (!await ui.confirm("Delete this message for everyone?")) return;
      try { await api.post("/api/edit", { channel: channelTarget, seq: m.ref_seq, text: "" }); }
      catch (e) { ui.say("Delete failed: " + e.message); }
    };
    bar.append(edit, del);
  }
  body.appendChild(bar);
}

// Forward / edit / delete affordances on direct messages.
function addDmActions(body, peer, m, bodyText) {
  const bar = el("div", "msg-actions");
  const fwd = el("button", null, "↪"); fwd.title = "Forward";
  fwd.onclick = () => openForwardPicker({ ...m, text: bodyText }, peer);
  bar.appendChild(fwd);
  if (m.from === "you" && m.msg_id) {
    const cur = () => (store.dmEdits[m.msg_id] && store.dmEdits[m.msg_id].text) || m.text;
    const edit = el("button", null, "✎"); edit.title = "Edit";
    edit.onclick = async () => {
      const t = await ui.ask("Edit message", cur());
      if (t == null || t === cur()) return;
      try { await api.editDm(peer, m.msg_id, t); store.dmEdits[m.msg_id] = { text: t, deleted: false }; renderChat(); }
      catch (e) { ui.say("Edit failed: " + e.message); }
    };
    const del = el("button", null, "🗑"); del.title = "Delete";
    del.onclick = async () => {
      if (!await ui.confirm("Delete this message for everyone?")) return;
      try { await api.editDm(peer, m.msg_id, ""); store.dmEdits[m.msg_id] = { text: "", deleted: true }; renderChat(); }
      catch (e) { ui.say("Delete failed: " + e.message); }
    };
    bar.append(edit, del);
  }
  body.appendChild(bar);
}

// Pick a destination conversation and forward `m` there.
function openForwardPicker(m, srcTarget) {
  if ($("#fwd-overlay")) return;
  const text = (m.text || "").replace(new RegExp("^" + FWD_PREFIX.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ".*\\n?"), "");
  if (!text) return;
  const origin = m.from === "you" ? "you" : (dmLabel(m.from) || short(m.from) || "someone");

  const ov = el("div"); ov.id = "fwd-overlay";
  const box = el("div", "pins-box");
  box.appendChild(el("h3", null, "↪ Forward to…"));
  box.appendChild(Object.assign(el("div", "pins-empty"), {
    textContent: (text.length > 80 ? text.slice(0, 80) + "…" : text), style: "text-align:left;color:var(--text)"
  }));
  const list = el("div", "pins-list");
  box.appendChild(list);
  ov.appendChild(box);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.addEventListener("keydown", function esc(e) {
    if (e.key === "Escape" && $("#fwd-overlay")) { ov.remove(); document.removeEventListener("keydown", esc); }
  });
  document.body.appendChild(ov);

  const dests = [];
  for (const s of store.servers())
    for (const c of store.channelsOf(s)) dests.push({ to: "#" + c.id, label: "#" + c.name + "  ·  " + s });
  for (const c of store.contacts) if (!isSelf(c.fp)) dests.push({ to: c.fp, label: dmLabel(c.fp) });
  for (const d of store.dms) if (!isSelf(d.fp) && !dests.some(x => x.to === d.fp)) dests.push({ to: d.fp, label: dmLabel(d.fp) });

  for (const d of dests) {
    if (d.to === srcTarget) continue;
    const row = el("div", "pin-row");
    row.textContent = d.label;
    row.onclick = async () => {
      ov.remove();
      try {
        const res = await api.forward(d.to, origin, text);
        if (!d.to.startsWith("#")) {
          const mid = res && typeof res.ok === "string" && /^[0-9a-f]{32}$/.test(res.ok) ? res.ok : undefined;
          store.messages.push({ kind: "message", from: "you", text: FWD_PREFIX + origin + "\n" + text, _target: d.to, _at: Date.now(), seq: -1, msg_id: mid });
        }
        ui.sys("Forwarded to " + d.label);
        render();
      } catch (e) { ui.say("Forward failed: " + e.message); }
    };
    list.appendChild(row);
  }
  if (!list.children.length) list.appendChild(el("div", "pins-empty", "No other conversation to forward to."));
}

function renderReplyBar() {
  const bar = $("#replybar");
  const r = store._replyTo;
  if (!r || r.target !== curTarget()) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = "";
  const who = r.from === "you" ? "yourself" : (dmLabel(r.from) || short(r.from) || "someone");
  bar.appendChild(el("span", "reply-quote", "↩ " + who + ": " + (r.text || "").slice(0, 80)));
  const x = el("button", null, "✕"); x.title = "Cancel reply";
  x.onclick = () => { store._replyTo = null; renderReplyBar(); };
  bar.appendChild(x);
}

function renderReactions(body, channelTarget, refSeq) {
  const row = el("div", "reacts");
  const mine = store.me.fingerprint;
  const list = store.reactions[refSeq] || [];
  for (const r of list) {
    const has = (r.by || []).includes(mine);
    const chip = el("button", "react-chip" + (has ? " on" : ""));
    chip.innerHTML = richText(r.emoji) + " " + r.count;
    chip.title = (r.by || []).map(short).join(", ");
    chip.onclick = () => toggleReact(channelTarget, refSeq, r.emoji, has);
    row.appendChild(chip);
  }
  const add = el("button", "react-chip add", "＋");
  add.title = "Add a reaction";
  add.onclick = async () => {
    const custom = Object.keys(emojiMap()).map(n => ":" + n + ":").join(" ");
    const e = await ui.ask("React with which emoji?\n(" + QUICK_EMOJI.join(" ") + (custom ? "  " + custom : "") + ")", "👍");
    if (e) toggleReact(channelTarget, refSeq, e, false);
  };
  row.appendChild(add);
  body.appendChild(row);
}

async function emojiFlow(root) {
  if (!root) { ui.say("Open one of your own server's channels to manage its emoji."); return; }
  const listed = Object.keys(store.emojis[root] || {});
  const name = await ui.ask(
    "Custom emoji shortcode — letters, digits, underscore.\n" +
    "Prefix with '-' to remove one instead.\n\n" +
    (listed.length ? "current: " + listed.map(n => ":" + n + ":").join("  ") : "none yet"),
    "");
  if (!name) return;
  if (name.startsWith("-")) {
    api.post("/api/emoji/remove", { server: root, name: name.slice(1).trim() })
      .then(refreshPolicies)
      .catch(e => ui.sys("remove failed: " + e.message));
    return;
  }
  const inp = $("#emoji-file");
  inp.onchange = async () => {
    const f = inp.files[0];
    inp.value = "";
    if (!f) return;
    if (f.size > 256 * 1024) { ui.say("image must be 256 KiB or smaller"); return; }
    const bytes = new Uint8Array(await f.arrayBuffer());
    let hex = "";
    for (const b of bytes) hex += b.toString(16).padStart(2, "0");
    try {

function renderMembers() {

  $("#members-count").textContent = `Members — ${all.length}`;

  const inChannel = target && target.startsWith("#");
  const root = inChannel ? store.rootOf(store.view.server) : null;
  const canKick = root && (store.myPerms(root) & PERM_KICK) !== 0;
  const canRoles = root && (store.myPerms(root) & (PERM_MANAGE_ROLES | PERM_KICK)) !== 0
    && store.policies[root] && store.policies[root].owner === store.me.fingerprint;

  // group by role
  const groups = new Map();
  for (const fp of all) {
    const rn = (root && store.roleName(root, fp)) || "Members";
    if (!groups.has(rn)) groups.set(rn, []);
    groups.get(rn).push(fp);
  }
  const order = ["Owner", ...[...groups.keys()].filter(k => k !== "Owner" && k !== "Members").sort(), "Members"];
  for (const g of order) {
    const members = groups.get(g);
    if (!members) continue;
    wrap.appendChild(el("div", "role-label", g + " — " + members.length));
    for (const fp of members) {
      const isMe = fp === store.me.fingerprint;

      row.appendChild(el("div", "avatar", initials(fp)));

const esc = s => { const d = el("div"); d.textContent = s; return d.innerHTML; };

/* custom-emoji map for the server currently in view: { shortcode: hexhash } */
function emojiMap() {
  const root = store.rootOf(store.view.server);
  return (root && store.emojis[root]) || {};
}
/* escape, then swap :shortcode: for a custom emoji <img> and @fp for a mention */
function richText(s) {
  const m = emojiMap();
  let out = esc(s).replace(/:([a-z0-9_]{1,32}):/g, (whole, name) =>
    m[name]
      ? `<img class="emoji" alt=":${name}:" title=":${name}:" src="/api/emoji?hash=${m[name]}">`
      : whole);
  out = out.replace(/@([A-Z0-9]{4}(?:-[A-Z0-9]{4}){2,12})/g, (whole, fp) => {
    const hit = resolveMention(fp);
    if (!hit) return whole;
    const me = hit === store.me.fingerprint;
    return `<span class="mention${me ? " mention-me" : ""}" title="${hit}">@${esc(mentionLabel(hit))}</span>`;
  });
  return out;
}

/* Resolve an @-token (full fp or unambiguous prefix) against people we know. */
function knownPeople() {
  const t = curTarget();
  const set = new Set([store.me.fingerprint]);
  if (t && t.startsWith("#")) for (const fp of store.membersFor(t)) set.add(fp);
  for (const c of store.contacts) set.add(c.fp);
  return [...set];
}
function resolveMention(token) {
  const people = knownPeople();
  if (people.includes(token)) return token;
  const pfx = people.filter(p => p.startsWith(token));
  return pfx.length === 1 ? pfx[0] : null;
}
function mentionLabel(fp) {
  const c = store.contacts.find(x => x.fp === fp);
  return (c && c.petname) || (fp === store.me.fingerprint ? "you" : short(fp));
}

/* Best-effort desktop notification (asks permission once, silently degrades). */
function notify(title, body) {
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    try { new Notification(title, { body: (body || "").slice(0, 140) }); } catch (_) {}
  } else if (Notification.permission !== "denied") {
    Notification.requestPermission().catch(() => {});
  }
}

/* ---------- polling ---------------------------------------------- */
function ingest(items) {
  for (const it of items) {
    // Skip anything already applied — the SSE stream and the fallback poll can
    // both deliver the same item, and the folding below isn't idempotent.
    if (it.seq > 0 && it.seq <= store.seen) continue;
    store.seen = Math.max(store.seen, it.seq);
    it._at = Date.now();
    if (it.kind === "channeledit") {
      // Fold an edit/delete into the channel message it points at.
      const tgt = "#" + it.channel;
      const msg = store.messages.find(m => m.kind === "channel" && m._target === tgt && m.ref_seq === it.ref_seq);
      if (msg) {
        if (it.deleted) { msg._deleted = true; msg.text = ""; }
        else { msg.text = it.text; msg._edited = true; }
      }
      continue;
    }
    if (it.kind === "channelpin") {
      const tgt = "#" + it.channel;
      const bag = store.pins[tgt] || (store.pins[tgt] = {});
      if (it.pinned) bag[it.ref_seq] = { by: it.by, at_ms: it.at_ms };
      else delete bag[it.ref_seq];
      continue;
    }
    if (it.kind === "dmedit") {
      store.dmEdits[it.msg_id] = { text: it.text, deleted: it.deleted };
      continue;
    }
    if (it.kind === "channel") {
      it._target = "#" + it.channel;
      if (!it.from) it.from = "you";
    } else {
      // message / file: attribute to the DM it belongs to
      it._target = it.peer || (it.from === "you" ? (store._pendingDmTarget || curTarget()) : it.from);
    }
    store.messages.push(it);
    const elsewhere = it._target && it._target !== curTarget();
    const fromOther = it.from && it.from !== "you";
    if (elsewhere && fromOther) store.bumpUnread(it._target);
    // Mention: a channel message from someone else naming my fingerprint.
    if (it.kind === "channel" && fromOther && it.text
        && it.text.includes("@" + store.me.fingerprint)) {
      store.mentions.add(it._target);
      if (it._target !== curTarget() && !store.isMuted(it._target))
        notify("Mentioned in " + store.channelName(it.channel), it.text);
    } else if (elsewhere && fromOther && it.kind !== "channel" && it.text
        && document.hidden && !store.isMuted(it._target)) {
      // A DM while the tab is in the background.
      notify(dmLabel(it._target), it.text);
    }
    // auto-list an unknown DM partner
    if (it.kind !== "channel" && it.from !== "you" && it.from && !store.dms.some(d => short(d.fp) === it.from || d.fp === it.from)) {
      store.dms.push({ fp: it.from }); LS.set("dms", store.dms);
    }
  }
  if (store.messages.length > 4000) store.messages.splice(0, store.messages.length - 4000);
}

async function poll() {
  try {
    const items = await api.messages(store.seen);
    if (items.length) { ingest(items); render(); }
  } catch (_) {}
}

// Server-Sent Events: near-instant delivery. `poll()` stays as a slow fallback
// for when the stream is down. On error we close and reopen with the *current*
// cursor rather than let the browser replay from a stale `since=` (which would
// double messages, since `ingest` isn't dedup-idempotent).
let es = null;
function openStream() {
  try { if (es) es.close(); } catch (_) {}
  try {
    es = new EventSource("/api/stream?since=" + store.seen);
    es.onmessage = ev => {
      try { ingest([JSON.parse(ev.data)]); render(); } catch (_) {}
    };
    es.onerror = () => {
      try { es.close(); } catch (_) {}
      es = null;
      setTimeout(openStream, 2000);
    };
  } catch (_) { es = null; }
}
async function pollTyping() {
  try {
    const r = await api.typing();
    if (r.text !== store.typingText) { store.typingText = r.text; renderTyping(); }
  } catch (_) {}
}
async function refreshChannels() {
  try {
    const ch = await api.channels();
    const changed = JSON.stringify(ch) !== JSON.stringify(store.channels);
    store.channels = ch;
    if (changed) render();
  } catch (_) {}
}
async function refreshPolicies() {
  const roots = [...new Set(store.channels.map(c => c.root))];
  for (const root of roots) {
    try {
      const p = await api.policy(root);
      if (p && p.version != null) {
        const changed = JSON.stringify(p) !== JSON.stringify(store.policies[root]);
        store.policies[root] = p;
        store.emojis[root] = Object.fromEntries((p.emojis || []).map(e => [e.name, e.hash]));
        if (changed) render();
      }
    } catch (_) {}
  }
  // Keep the open DM's verification badge fresh (a key rotation can flip it).
  const t = curTarget();
  if (isDM() && t && !isSelf(t)) {
    try {
      const s = await api.get("/api/safety?peer=" + encodeURIComponent(t));
      if (JSON.stringify(s) !== JSON.stringify(store.safety[t])) { store.safety[t] = s; renderChat(); }
    } catch (_) {}
  }
}

const MAX_ATTACH = 9 * 1024 * 1024;
async function sendFile(file) {
  const t = curTarget();
  if (!t || t.startsWith("#") || isSelf(t)) { ui.say("Files can only be sent in a direct message."); return; }
  if (!file) return;
  if (file.size > MAX_ATTACH) { ui.say("That file is larger than " + Math.round(MAX_ATTACH / 1048576) + " MiB."); return; }
  const stamp = { kind: "file", from: "you", filename: file.name, size: file.size, saved: "", _target: t, _at: Date.now(), seq: -1 };
  store.messages.push(stamp); renderChat();

      { method: "POST", body: buf });

}

let mentionState = null; // { start, matches, sel }
function closeMentionPopup() {
  mentionState = null;
  const p = $("#mention-popup"); if (p) p.hidden = true;
}
function mentionAutocomplete() {
  const box = $("#text");
  const t = curTarget();
  if (!t || !t.startsWith("#")) return closeMentionPopup();
  const upto = box.value.slice(0, box.selectionStart);
  const m = upto.match(/(?:^|\s)@([A-Za-z0-9-]*)$/);
  if (!m) return closeMentionPopup();
  const q = m[1].toUpperCase();
  const start = box.selectionStart - m[1].length;
  const people = knownPeople().filter(fp => fp !== store.me.fingerprint);
  const matches = people
    .map(fp => ({ fp, label: mentionLabel(fp) }))
    .filter(x => x.fp.replace(/-/g, "").startsWith(q.replace(/-/g, "")) || x.label.toUpperCase().includes(q))
    .slice(0, 8);
  if (!matches.length) return closeMentionPopup();
  mentionState = { start, matches, sel: 0 };
  renderMentionPopup();
}
function renderMentionPopup() {
  let p = $("#mention-popup");
  if (!p) { p = el("div"); p.id = "mention-popup"; document.body.appendChild(p); }
  p.hidden = false;
  p.innerHTML = "";
  mentionState.matches.forEach((x, i) => {
    const row = el("div", "mrow" + (i === mentionState.sel ? " sel" : ""));
    row.textContent = x.label + "  " + short(x.fp);
    row.onmousedown = e => { e.preventDefault(); pickMention(i); };
    p.appendChild(row);
  });
  const box = $("#text");
  const r = box.getBoundingClientRect();
  p.style.left = r.left + "px";
  p.style.bottom = (window.innerHeight - r.top + 4) + "px";
  p.style.minWidth = r.width + "px";
}
function mentionKeydown(e) {
  if (!mentionState) return;
  if (e.key === "ArrowDown") { e.preventDefault(); mentionState.sel = (mentionState.sel + 1) % mentionState.matches.length; renderMentionPopup(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); mentionState.sel = (mentionState.sel + mentionState.matches.length - 1) % mentionState.matches.length; renderMentionPopup(); }
  else if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); pickMention(mentionState.sel); }
  else if (e.key === "Escape") { closeMentionPopup(); }
}
function pickMention(i) {
  const box = $("#text");
  const x = mentionState.matches[i];
  const before = box.value.slice(0, mentionState.start - 1); // drop the '@'
  const after = box.value.slice(box.selectionStart);
  box.value = before + "@" + x.fp + " " + after;
  const pos = (before + "@" + x.fp + " ").length;
  box.setSelectionRange(pos, pos);
  closeMentionPopup();
  box.focus();
}

  });
  document.body.appendChild(ov);
  inp.focus();
  inp.addEventListener("input", () => {
    clearTimeout(searchTimer);
    const q = inp.value.trim();
    if (q.length < 2) { results.innerHTML = ""; return; }
    searchTimer = setTimeout(async () => {
      try {
        const hits = await api.get("/api/search?q=" + encodeURIComponent(q));
        results.innerHTML = "";
        if (!hits.length) { results.appendChild(el("div", "search-empty", "No matches.")); return; }
        for (const h of hits) {
          const row = el("div", "search-hit");
          const where = h.channel ? ("#" + (h.scope_name || short(h.scope))) : ("@ " + (dmLabel(h.scope) || short(h.scope)));
          row.appendChild(Object.assign(el("div", "sh-where"), { textContent: where + "  ·  " + (h.from === "you" ? "you" : short(h.from)) }));
          row.appendChild(Object.assign(el("div", "sh-text"), { innerHTML: highlight(h.text, q) }));
          row.onclick = () => {
            ov.remove();
            if (h.channel) {
              const ch = store.channels.find(c => c.id === h.scope);
              if (ch) selectTarget(ch.server, "#" + h.scope);

            }
          };
          results.appendChild(row);
        }
      } catch (e) { results.innerHTML = ""; results.appendChild(el("div", "search-empty", "Search failed.")); }
    }, 180);
  });
}
function highlight(text, q) {
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(text.slice(0, 200));
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length, i + q.length + 160));
}

  });

  if (!seqs.length) { list.appendChild(el("div", "pins-empty", "Nothing pinned yet.")); return; }
  for (const rs of seqs) {
    const info = bag[rs];
    const msg = store.messages.find(m => m.kind === "channel" && m._target === target && m.ref_seq === rs);
    const row = el("div", "pin-row");
    const who = msg ? (msg.from === "you" ? "you" : short(msg.from)) : "";
    row.appendChild(Object.assign(el("div", "pr-meta"), {
      textContent: (who ? who + "  ·  " : "") + "pinned by " + short(info.by) + "  ·  " + relTime(info.at_ms),
    }));
    row.appendChild(Object.assign(el("div", "pr-text"), {
      innerHTML: msg ? (msg._deleted ? "<i>(message deleted)</i>" : richText(msg.text)) : "<i>message not loaded</i>",
    }));
    row.onclick = () => { ov.remove(); if (msg) flashMessage(target, rs); };
    list.appendChild(row);
  }
}

function relTime(ms) {
  if (!ms) return "";
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

function flashMessage(target, refSeq) {
  if (curTarget() !== target) {
    const ch = store.channels.find(c => "#" + c.id === target);
    if (ch) selectTarget(ch.server, target);
  }
  setTimeout(() => {
    const log = $("#log");
    for (const g of log.querySelectorAll(".msg-group")) {
      if (g._refSeq === refSeq) { g.scrollIntoView({ block: "center" }); g.style.transition = "background .3s"; g.style.background = "var(--bg-active)"; setTimeout(() => g.style.background = "", 900); break; }
    }
  }, 80);
}

/* ---------- boot ----------------------------------------------- */
async function init() {

  catch (_) { state = { ready: false, has_keystore: false }; }
  if (!state.ready) { renderOnboard(state); return; }

  $("#app").dataset.members = LS.get("members", "shown");

    store.me = await api.me();

    $("#me-fp").title = store.me.fingerprint + "  (click to copy)";
    $("#me-avatar").textContent = initials(store.me.fingerprint);
    $("#me-sub").textContent = "online";
  } catch (_) { $("#me-sub").textContent = "offline"; }

  // restore local Private Notes
  for (const n of LS.get("notes", [])) {
    store.messages.push({ kind: "message", from: "you", text: n.text, _target: store.me.fingerprint, _at: n.at, seq: -1 });
  }

  await refreshChannels();

  // restore last view if still valid
  const v = store.view;
  if (v.server !== "@dm" && !store.servers().includes(v.server)) store.view = { server: "@dm", target: store.dms[0] ? store.dms[0].fp : null };
  selectTarget(store.view.server, store.view.target);

  poll();
  openStream();
  refreshPolicies();
  refreshContacts();
  refreshBlocked();
  refreshCalls();
  refreshGroupCalls();
  setInterval(poll, 3000);
  setInterval(pollTyping, 1200);
  setInterval(refreshChannels, 5000);
  setInterval(refreshReactions, 1500);
  setInterval(refreshPolicies, 6000);
  setInterval(refreshContacts, 8000);
  setInterval(refreshBlocked, 8000);
  setInterval(refreshCalls, 1200);
  setInterval(refreshGroupCalls, 1500);
}
init();
</script>
</body>
</html>
