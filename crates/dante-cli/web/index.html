async function loadSafety(fp) {
  store.safety[fp] = null;                         // "pending" — avoids a refetch loop
  try {
    store.safety[fp] = await api.get("/api/safety?peer=" + encodeURIComponent(fp));
  } catch (_) {
    store.safety[fp] = { available: false };
  }
  if (curTarget() === fp) renderChat();
}

function fmtSafety(n) {                            // 12 groups -> 3 rows of 4
  const g = (n || "").split(" ");
  return [g.slice(0, 4), g.slice(4, 8), g.slice(8, 12)].map(r => r.join("  ")).join("\n");
}

async function verifyFlow(fp) {
  const s = store.safety[fp];
  if (!s || !s.available) { ui.say("No safety number yet — the peer must be known to the ledger."); return; }
  const msg =
    "Safety number for " + short(fp) + "\n\n" + fmtSafety(s.number) +
    "\n\nCompare this with your contact over a channel you already trust " +
    "(in person, a call, …). It matches on both sides only if no one is in the middle." +
    "\n\nCurrently: " + (s.verified ? "VERIFIED" : "not verified") +
    "\n\nOK = " + (s.verified ? "clear verification" : "mark as verified") + ".";
  if (!await ui.confirm(msg)) return;
  try {
    await api.post("/api/verify", { peer: fp, verified: !s.verified });
    await loadSafety(fp);
  } catch (e) { ui.sys("verify failed: " + e.message); }
}

const humanSize = n => n < 1024 ? n + " B"
  : n < 1048576 ? (n / 1024).toFixed(1) + " KB"
  : (n / 1048576).toFixed(1) + " MB";

// A file message: inline image if we can show it, otherwise a download row.
function renderFile(m) {
  const src = m.url || m._localUrl;          // _localUrl = optimistic outgoing
  const isImg = (m.mime || "").startsWith("image/") ||
    (!m.mime && /\.(png|jpe?g|gif|webp)$/i.test(m.filename || ""));
  if (src && isImg) {
    const wrap = el("div", "msg-line file");
    const a = el("a"); a.href = src; a.target = "_blank"; a.rel = "noopener"; a.title = "Open " + m.filename;
    const img = el("img", "chat-image"); img.src = src; img.alt = m.filename || "image"; img.loading = "lazy";
    a.appendChild(img);
    wrap.appendChild(a);
    wrap.appendChild(Object.assign(el("div", "file-cap"), { textContent: `${m.filename} · ${humanSize(m.size)}` }));
    return wrap;
  }
  // Whole row is a link: click opens / downloads the file.
  const row = el(src ? "a" : "div", "msg-line file file-row");
  if (src) { row.href = src; row.download = m.filename || "file"; row.target = "_blank"; row.rel = "noopener"; }
  row.appendChild(Object.assign(el("span", "file-ic"), { innerHTML: svgIcon("paperclip") }));
  const meta = el("div", "file-meta");
  meta.appendChild(Object.assign(el("div", "file-name"), { textContent: m.filename || "file" }));
  meta.appendChild(Object.assign(el("div", "file-cap"), {
    textContent: humanSize(m.size) + (src ? " · click to download" : " · not held — ask them to resend"),
  }));
  row.appendChild(meta);
  return row;
}

function groupShell(m, sameAuthor) {
  const node = el("div", "msg-group" + (sameAuthor ? " cont" : ""));
  const name = m.from === "you" ? (store.me.username || short(store.me.fingerprint)) : authorLabel(m.from);
  const fp = m.from === "you" ? store.me.fingerprint : m.from;
  const hhmm = m._at ? new Date(m._at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
  const body = el("div", "body");
  if (!sameAuthor) {
    const av = avatar(name, fp);
    if (fp) { av.classList.add("clickable"); av.onclick = () => openProfile(fp); }
    node.appendChild(av);
    const meta = el("div", "meta");
    const a = el("span", "author" + (m.from === "you" ? " you" : ""), name);
    a.onclick = () => fp && openProfile(fp);
    meta.appendChild(a);
    if (m.from !== "you" && m.from) meta.appendChild(el("span", "fp", short(m.from)));
    meta.appendChild(el("span", "stamp", hhmm));
    body.appendChild(meta);
  } else {
    // Continuation line: the avatar gutter instead holds a faint timestamp
    // that appears on hover (Discord-style).
    const gutter = el("div", "msg-gutter");
    if (hhmm) gutter.appendChild(el("span", "cont-time", hhmm));
    node.appendChild(gutter);
  }
  node.appendChild(body);
  return { node, body };
}

function renderMembers() {
  const target = curTarget();
  const wrap = $("#members-list");
  wrap.innerHTML = "";
  const names = target ? store.membersFor(target) : [];
  const all = [store.me.fingerprint, ...names];
  $("#members-count").textContent = `Members — ${all.length}`;

  const inChannel = target && target.startsWith("#");
  const root = inChannel ? store.rootOf(store.view.server) : null;
  const canKick = root && (store.myPerms(root) & PERM_KICK) !== 0;
  const iAmOwner = root && store.policies[root] && store.policies[root].owner === store.me.fingerprint;
  const canRoles = root && (store.myPerms(root) & (PERM_MANAGE_ROLES | PERM_KICK)) !== 0 && iAmOwner;

  // group by role
  const groups = new Map();
  for (const fp of all) {
    const rn = (root && store.roleName(root, fp)) || "Members";
    if (!groups.has(rn)) groups.set(rn, []);
    groups.get(rn).push(fp);
  }
  const roleIcons = new Map();
  if (root) for (const r of ((store.policies[root] || {}).roles || [])) if (r.icon) roleIcons.set(r.name, r.icon);
  const order = ["Owner", ...[...groups.keys()].filter(k => k !== "Owner" && k !== "Members").sort(), "Members"];
  for (const g of order) {
    const members = groups.get(g);
    if (!members) continue;
    const label = el("div", "role-label");
    const icon = root && roleIcons.get(g);
    const hash = icon && store.emojis[root] && store.emojis[root][icon];
    if (hash) {
      const im = el("img", "emoji");
      im.alt = ":" + icon + ":";
      im.title = ":" + icon + ":";
      im.src = "/api/emoji?hash=" + encodeURIComponent(hash);
      label.appendChild(im);
      label.appendChild(document.createTextNode(" "));
    }
    label.appendChild(document.createTextNode(g + " — " + members.length));
    wrap.appendChild(label);
    for (const fp of members) {
      const isMe = fp === store.me.fingerprint;
      const label = isMe
        ? (nicknameOf(root, fp) || store.me.username || "you")
        : (petname(fp) || (root && nicknameOf(root, fp)) || username(fp) || short(fp));
      const row = el("div", "member-row" + (isMe ? " you" : ""));
      const av = avatar(label, fp, "avatar clickable");
      av.onclick = () => openProfile(fp);
      row.appendChild(av);
      const nm = el("span", "name", label);
      nm.style.cursor = "pointer";
      nm.onclick = () => openProfile(fp);
      if (username(fp) || isMe) nm.appendChild(Object.assign(el("span", "member-id"), { textContent: short(fp) }));
      row.appendChild(nm);
      if (inChannel && !isMe && canRoles) {
        const rb = actBtn("shield", "Assign / remove a role", "kick");
        rb.onclick = () => assignRoleFlow(store.view.server, fp);
        row.appendChild(rb);
      }
      if (inChannel && !isMe && iAmOwner) {
        const nb = actBtn("edit", "Set nickname", "kick");
        nb.onclick = () => nicknameFlow(root, fp);
        row.appendChild(nb);
      }
      if (inChannel && isMe) {
        const mb = actBtn("edit", "Set my nickname", "kick");
        mb.onclick = () => myNicknameFlow(root);
        row.appendChild(mb);
      }
      const isOwner = root && store.policies[root] && store.policies[root].owner === fp;
      // A member with kick/manage power is staff — only the owner may kick staff.
      const isStaff = root && (store.permsOf(root, fp) & (PERM_KICK | PERM_MANAGE_ROLES)) !== 0;
      if (inChannel && !isMe && canKick && !isOwner && (iAmOwner || !isStaff)) {
        const kick = el("button", "kick", "×");
        kick.title = "Kick / ban from server";
        kick.onclick = e => {
          e.stopPropagation();
          ctxShow(e.clientX, e.clientY, [
            { iconName: "log-out", label: "Kick from server", run: () => serverKickFlow(target, fp, false) },
            { iconName: "ban", danger: true, label: "Ban from server", run: () => serverKickFlow(target, fp, true) },
          ]);
        };
        row.appendChild(kick);
      }
      wrap.appendChild(row);
    }
  }
}

async function rolesFlow(server) {
  const root = store.rootOf(server);
  if (!root) return ui.say("Unknown server root.");
  const p = store.policies[root];
  const avail = Object.keys((root && store.emojis[root]) || {});
  const list = p && p.roles.length
    ? p.roles.map(r => `  [${r.id}]${r.icon ? " :" + r.icon + ":" : ""} ${r.name}` +
        (r.deny & PERM_SEND ? "  (muted)" : "") +
        (r.allow & PERM_KICK ? "  (can kick)" : "") +
        (r.allow & PERM_MANAGE_ROLES ? "  (manage)" : "")).join("\n")
    : "  (none yet)";
  const f = await ui.form("New role", [
    { name: "name", label: "Role name", placeholder: "Moderator" },
    { name: "icon", label: "Icon (custom emoji name)", placeholder: avail[0] || "party_parrot" },
    { name: "kick", type: "check", label: "Can kick members" },
    { name: "manage", type: "check", label: "Can manage roles & channels" },
    { name: "mute", type: "check", label: "Muted (cannot send messages)" },
  ], { ok: "Create role", msg: "Existing roles:\n" + list +
      (avail.length
        ? "\n\nAvailable custom emoji: " + avail.map(n => ":" + n + ":").join(" ")
        : "\n\nNo custom emoji on this server yet.") });
  if (!f || !f.name) return;
  let allow = 0, deny = 0;
  if (f.kick) allow |= PERM_KICK;
  if (f.manage) allow |= PERM_MANAGE_ROLES | PERM_MANAGE_CHANNELS;
  if (f.mute) deny |= PERM_SEND;
  try {
    const r = await api.post("/api/role", { server: root, name: f.name, icon: f.icon || null, allow, deny, rank: 10 });
    ui.sys(`Role "${f.name}" created (id ${r.ok}).`);
    refreshPolicies();
  } catch (e) { ui.say("Could not create role (host only): " + e.message); }
}

async function assignRoleFlow(server, memberFp) {
  const root = store.rootOf(server);
  const p = store.policies[root];
  if (!p || !p.roles.length) return ui.say("No roles defined yet — use the shield button on a member.");
  const idStr = await ui.ask("Toggle which role id on " + short(memberFp) + "?\n" +
    p.roles.map(r => `  [${r.id}]${r.icon ? " :" + r.icon + ":" : ""} ${r.name}`).join("\n"));
  const role_id = parseInt(idStr, 10);
  if (!Number.isFinite(role_id)) return;
  const has = (p.assignments.find(a => a.member === memberFp) || { roles: [] }).roles.includes(role_id);
  try {
    await api.post("/api/roleassign", { server: root, member: memberFp, role_id, add: !has });
    ui.sys((has ? "Removed" : "Assigned") + " role " + role_id + " " + (has ? "from " : "to ") + short(memberFp));
    refreshPolicies();
  } catch (e) { ui.say("Failed: " + e.message); }
}

async function autoKickFlow(server) {
  const root = store.rootOf(server);
  if (!root) return ui.say("Unknown server root.");
  const cur = (store.channelsOf(server)[0] || {}).auto_kick_days || 0;
  const ans = await ui.ask("Auto-remove members inactive for how many days? (0 = off)", String(cur));
  if (ans == null) return;
  const days = parseFloat(ans) || 0;
  try {
    await api.post("/api/autokick", { server: root, days });
    ui.sys(days > 0 ? `Auto-kick set to ${days} day(s) of inactivity.` : "Auto-kick disabled.");
    refreshChannels();
  } catch (e) { ui.say("Could not set auto-kick (host only): " + e.message); }
}

async function serverKickFlow(channelTarget, memberFp, ban) {
  const who = username(memberFp) || short(memberFp);
  const verb = ban ? "Ban" : "Kick";
  const msg = ban
    ? `Ban ${who} from this server? They're removed from every channel and can't be re-invited until you unban them.`
    : `Kick ${who} from this server? They're removed from every channel but can be invited back.`;
  if (!await ui.confirm(msg, { ok: verb, danger: true })) return;
  try {
    await api.post(ban ? "/api/server/ban" : "/api/server/kick", { channel: channelTarget, member: memberFp });
    ui.sys(`${verb === "Ban" ? "Banned" : "Kicked"} ${who}.`);
    setTimeout(refreshChannels, 1500);
  } catch (e) { ui.say(verb + " failed: " + e.message); }
}

let emojiPop = null;
function emojiPopClose() {
  if (emojiPop) { emojiPop.remove(); emojiPop = null; }
  removeEventListener("click", emojiPopOutside);   // always, however we closed
}
// Open the picker anchored to `anchor`; `onPick(str)` gets an emoji char or
// `:shortcode:` for a custom one.
function openEmojiPicker(anchor, onPick) {
  if (emojiPop) { emojiPopClose(); return; }
  const pop = el("div", "emoji-pop");
  const tabs = el("div", "emoji-tabs");
  const grid = el("div", "emoji-grid");
  const custom = emojiMap();
  const cats = [];
  if (Object.keys(custom).length) {
    cats.push(["Custom", "⭐", null, Object.entries(custom)]);
  }
  for (const [name, icon, chars] of EMOJI_CATS) cats.push([name, icon, chars, null]);

  const showCat = i => {
    for (const b of tabs.children) b.classList.toggle("on", +b.dataset.i === i);
    grid.innerHTML = "";
    const [, , chars, customList] = cats[i];
    if (customList) {
      for (const [nm, hash] of customList) {
        const b = el("button", "emoji-cell");
        // Build the <img> with escaped attributes: `nm` is a server-supplied
        // shortcode and `hash` a server-supplied string. The engine now rejects
        // a non-`[a-z0-9_]` shortcode, but escape here too so the render sink is
        // safe on its own.
        const img = el("img", "emoji");
        img.src = "/api/emoji?hash=" + encodeURIComponent(hash);
        img.alt = ":" + nm + ":";
        b.appendChild(img);
        b.title = ":" + nm + ":";
        b.onclick = () => { onPick(":" + nm + ":"); emojiPopClose(); };
        grid.appendChild(b);
      }
      return;
    }
    for (const ch of chars.split(" ")) {
      const b = el("button", "emoji-cell", ch);
      b.onclick = () => { onPick(ch); emojiPopClose(); };
      grid.appendChild(b);
    }
  };
  cats.forEach(([name, icon], i) => {
    const t = el("button", "emoji-tab", icon);
    t.title = name; t.dataset.i = i;
    t.onclick = () => showCat(i);
    tabs.appendChild(t);
  });
  pop.appendChild(tabs);
  pop.appendChild(grid);
  pop.style.visibility = "hidden";
  document.body.appendChild(pop);
  emojiPop = pop;
  showCat(0);                       // fill it BEFORE measuring
  const r = anchor.getBoundingClientRect();
  const h = pop.offsetHeight, w = pop.offsetWidth;
  const above = r.top - 8 - h;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
  // Prefer above the anchor; drop below only if there isn't room up top.
  pop.style.top = (above >= 8 ? above : Math.min(r.bottom + 8, innerHeight - h - 8)) + "px";
  pop.style.visibility = "";
  setTimeout(() => addEventListener("click", emojiPopOutside), 0);
}
function emojiPopOutside(e) {

// Send `:name:` as its own message on the current target (channel or DM).
async function sendSticker(name) {
  const t = curTarget();
  if (!t) return;
  const text = ":" + name + ":";
  try {
    if (isSelf(t)) {
      store.messages.push({ kind: "message", from: "you", text, _target: t, _at: Date.now(), seq: -1 });
      renderChat();
    } else if (t.startsWith("#")) {
      await api.send(t, text, null);
    } else {
      store._pendingDmTarget = t;
      const res = await api.send(t, text);
      store._pendingDmTarget = null;
      const mid = res && typeof res.ok === "string" && /^[0-9a-f]{32}$/.test(res.ok) ? res.ok : undefined;
      store.messages.push({ kind: "message", from: "you", text, _target: t, _at: Date.now(), seq: -1, msg_id: mid });
      renderChat();
    }
  } catch (err) { ui.sys("Send failed: " + err.message); }
}

/* escape, then swap :shortcode: for a custom emoji <img> and @fp for a mention */
function richText(s) {
  // A message that is nothing but one :name: matching a server sticker renders
  // as a large standalone image, not an inline emoji.
  const lone = s.trim().match(/^:([a-z0-9_]{1,32}):$/);

/* Discord-flavoured markdown -> safe HTML.
   Safety: every piece of user text is HTML-escaped before any tag is
   introduced; code spans are pulled out first so their contents are never
   re-parsed as markup; autolinks are restricted to http(s) URLs, which after
   escaping cannot contain a quote or angle bracket, so they are safe in an
   href. Supports: ```code blocks```, `inline code`, **bold**, *italic* / _italic_,
   ***bold italic***, __underline__, ~~strike~~, ||spoiler||, > blockquotes,
   # / ## / ### headers, -# subtext, - / 1. lists, [masked](links), bare links,
   :emoji:, @mentions, and line breaks. */
function mdRender(src) {
  const codes = [];
  const stash = (h) => "\u0000" + (codes.push(h) - 1) + "\u0000";
  // Strip real NULs so a user can't forge a code-span placeholder token.
  let s = src.replace(/\u0000/g, "").replace(/\r\n?/g, "\n");
  // 1. Pull out code spans first (their contents are escaped, never re-parsed).
  s = s.replace(/```(?:[a-zA-Z0-9_+.-]*\n)?([\s\S]*?)```/g,
    (_, code) => stash('<pre class="md-pre"><code>' + esc(code.replace(/\n+$/, "")) + "</code></pre>"));
  s = s.replace(/`([^`\n]+)`/g, (_, code) => stash('<code class="md-code">' + esc(code) + "</code>"));
  // 2. Escape everything that remains.
  s = esc(s);
  // 3. Inline emphasis (escaped text; single-level nesting covers the common cases).
  // Emphasis. The inner run must be flanked by non-space (\S…\S, or a single
  // \S), so stray delimiters around spaces — "2 * 3", "a ~~ b" — are left
  // alone; the [^delim] class stops a run from crossing into the next pair.
  s = s.replace(/\|\|([\s\S]+?)\|\|/g, '<span class="md-spoiler">$1</span>');
  s = s.replace(/\*\*\*(\S[^*\n]*\S|\S)\*\*\*/g, "<strong><em>$1</em></strong>");
  s = s.replace(/\*\*(\S[^*\n]*\S|\S)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__(\S[^_\n]*\S|\S)__/g, "<u>$1</u>");
  s = s.replace(/(^|[^*])\*(\S[^*\n]*\S|\S)\*(?!\*)/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_\w])_(\S[^_\n]*\S|\S)_(?![_\w])/g, "$1<em>$2</em>");
  s = s.replace(/~~(\S[^~\n]*\S|\S)~~/g, "<s>$1</s>");
  // 4. Custom emoji.
  const m = emojiMap();
  s = s.replace(/:([a-z0-9_]{1,32}):/g, (whole, name) =>
    m[name] ? `<img class="emoji" alt=":${name}:" title=":${name}:" src="/api/emoji?hash=${m[name]}">` : whole);
  // 5. Mentions.
  s = s.replace(/@([A-Z0-9]{4}(?:-[A-Z0-9]{4}){2,12})/g, (whole, fp) => {
    const hit = resolveMention(fp);
    if (!hit) return whole;
    const me = hit === store.me.fingerprint;
    return `<span class="mention${me ? " mention-me" : ""}" title="${esc(hit)}">@${esc(mentionLabel(hit))}</span>`;
  });
  // 6a. Masked links [label](url) — restricted to http(s); href quote-escaped.
  // Stash the finished anchor so the bare-autolink pass below can't re-match the
  // URL sitting inside its href.
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => {
    const href = url.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    return stash(`<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`);
  });
  // 6b. Autolink bare http(s). NB esc() (textContent->innerHTML) does NOT escape
  // double quotes, so a URL can carry a `"` that would break out of the href
  // attribute — quote-escape it explicitly. The visible text is in element
  // content position, where a bare quote is harmless.
  s = s.replace(/\bhttps?:\/\/[^\s<]+/g, (u) => {
    const url = u.replace(/[.,;:!?)\]]+$/, "");
    const tail = u.slice(url.length);
    const href = url.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    return `<a href="${href}" target="_blank" rel="noopener noreferrer">${url}</a>` + tail;
  });
  // 7. Block structure: headers, subtext, blockquotes, lists, and line breaks.
  // Code tokens are single-line, so this is safe.
  const lines = s.split("\n");
  let out = "";
  let prevText = false;
  let li = 0;
  while (li < lines.length) {
    const ln = lines[li];
    // Blockquote: group consecutive "> " lines.
    let mm = ln.match(/^&gt;\s?(.*)$/);
    if (mm) {
      const buf = [];
      while (li < lines.length && (mm = lines[li].match(/^&gt;\s?(.*)$/))) { buf.push(mm[1]); li++; }
      out += '<blockquote class="md-quote">' + buf.join("<br>") + "</blockquote>";
      prevText = false; continue;
    }
    // Headers / subtext (check -# before the "- " list rule).
    if ((mm = ln.match(/^###\s+(.*)$/))) { out += '<div class="md-h3">' + mm[1] + "</div>"; prevText = false; li++; continue; }
    if ((mm = ln.match(/^##\s+(.*)$/)))  { out += '<div class="md-h2">' + mm[1] + "</div>"; prevText = false; li++; continue; }
    if ((mm = ln.match(/^#\s+(.*)$/)))   { out += '<div class="md-h1">' + mm[1] + "</div>"; prevText = false; li++; continue; }
    if ((mm = ln.match(/^-#\s+(.*)$/)))  { out += '<div class="md-sub">' + mm[1] + "</div>"; prevText = false; li++; continue; }
    // Unordered list.
    if (/^[-*]\s+\S/.test(ln)) {
      const buf = [];
      while (li < lines.length && /^[-*]\s+/.test(lines[li])) { buf.push("<li>" + lines[li].replace(/^[-*]\s+/, "") + "</li>"); li++; }
      out += '<ul class="md-list">' + buf.join("") + "</ul>";
      prevText = false; continue;
    }
    // Ordered list.
    if (/^\d+\.\s+\S/.test(ln)) {
      const buf = [];
      while (li < lines.length && /^\d+\.\s+/.test(lines[li])) { buf.push("<li>" + lines[li].replace(/^\d+\.\s+/, "") + "</li>"); li++; }
      out += '<ol class="md-list">' + buf.join("") + "</ol>";
      prevText = false; continue;
    }
    // Plain line.
    out += (prevText ? "<br>" : "") + ln;
    prevText = true; li++;
  }
  // 8. Restore code spans and stashed links.
  return out.replace(/\u0000(\d+)\u0000/g, (_, i) => codes[+i] || "");
}

/* Resolve an @-token (full fp or unambiguous prefix) against people we know. */
function knownPeople() {
  const t = curTarget();
  const set = new Set([store.me.fingerprint]);
  if (t && t.startsWith("#")) for (const fp of store.membersFor(t)) set.add(fp);
  for (const c of store.contacts) set.add(c.fp);
  return [...set];
}
function resolveMention(token) {
  const people = knownPeople();
  if (people.includes(token)) return token;
  const pfx = people.filter(p => p.startsWith(token));
  return pfx.length === 1 ? pfx[0] : null;
}
function mentionLabel(fp) {
  const c = store.contacts.find(x => x.fp === fp);
  return (c && c.petname) || (fp === store.me.fingerprint ? "you" : short(fp));
}

/* Best-effort desktop notification (asks permission once, silently degrades). */
function notify(title, body) {
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    try { new Notification(title, { body: (body || "").slice(0, 140) }); } catch (_) {}
  } else if (Notification.permission !== "denied") {
    Notification.requestPermission().catch(() => {});
  }
}

/* `/api/ice` rows -> `RTCIceServer` entries. TURN rows carry short-lived
   coturn credentials; drop them and the browser gathers only host + srflx
   candidates, so two peers behind symmetric NAT never connect. */
function iceToRtc(rows) {
  return (rows || [])
    .filter(s => s && Array.isArray(s.urls) && s.urls.length)
    .map(s => s.username
      ? { urls: s.urls, username: s.username, credential: s.credential || "" }
      : { urls: s.urls });
}

/* ---------- 1:1 DM calls: real browser WebRTC audio --------------------
   Mirrors the voice-channel mesh but for a single peer. The engine's own
   Call (CallOffer/CallIce) still runs and feeds the native desktop bridge;
   this parallel browser peer connection is what makes 1:1 calls audible in
   `dante serve`. Signalling rides CallSignal DMs via /api/call/signal,
   delivered back as `callsignal` stream items. To avoid glare the lower
   fingerprint offers, and only once the engine says the call is connected
   (so the mic prompt only appears after the user starts/accepts). */
const callRtc = {
  peer: null, pc: null, localStream: null, audio: null,
  polite: false, pending: [], offered: false, makingOffer: false, iceServers: [],
};

async function callRtcStart(fp) {
  if (callRtc.peer === fp && callRtc.pc) return;
  if (callRtc.peer) callRtcStop();               // one 1:1 call at a time
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("this browser has no microphone API (needs a secure context)");
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  callRtc.peer = fp;
  callRtc.localStream = stream;
  applyVoiceCtl();                 // honour an existing mute/deafen
  monitorStream(store.me.fingerprint, stream);
  callRtc.offered = false;
  callRtc.pending = [];
  callRtc.polite = store.me.fingerprint > fp;    // higher fp is the polite peer
  try {
    callRtc.iceServers = iceToRtc(await api.get("/api/ice"));
  } catch (_) { callRtc.iceServers = []; }
  const pc = new RTCPeerConnection({ iceServers: callRtc.iceServers });
  callRtc.pc = pc;
  for (const t of stream.getTracks()) pc.addTrack(t, stream);
  pc.onicecandidate = e => { if (e.candidate) callSignalSend(2, JSON.stringify(e.candidate)); };
  pc.ontrack = e => {
    let a = callRtc.audio;
    if (!a) { a = new Audio(); a.autoplay = true; callRtc.audio = a; }
    a.muted = voiceCtl.deafened;
    a.srcObject = e.streams[0];
    a.play().catch(() => {});
    if (callRtc.peer) monitorStream(callRtc.peer, e.streams[0]);
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "failed") callRtcStop();
  };
}

function callRtcStop() {
  if (callRtc.peer) { callSignalSend(3, ""); stopMonitor(callRtc.peer); }  // best-effort teardown
  stopMonitor(store.me.fingerprint);
  if (callRtc.pc) { try { callRtc.pc.close(); } catch (_) {} }
  if (callRtc.audio) { try { callRtc.audio.srcObject = null; } catch (_) {} }
  if (callRtc.localStream) { for (const t of callRtc.localStream.getTracks()) t.stop(); }
  callRtc.peer = null; callRtc.pc = null; callRtc.localStream = null;
  callRtc.audio = null; callRtc.pending = []; callRtc.offered = false; callRtc.makingOffer = false;
}

/* ---------- global mute / deafen (Discord-style) --------------------
   One control for every voice session (voice channels + 1:1 calls).
   Mute silences your mic; deafen mutes everyone you hear AND, like Discord,
   forces your mic off while active. Applied by toggling track.enabled on the
   local mic and .muted on each remote <audio>, so there's no renegotiation. */
const voiceCtl = { muted: false, deafened: false };
function micEnabled() { return !(voiceCtl.muted || voiceCtl.deafened); }
function applyVoiceCtl() {
  const on = micEnabled();
  for (const st of [voiceRtc.localStream, callRtc.localStream]) {
    if (st) for (const t of st.getAudioTracks()) t.enabled = on;
  }
  voiceRtc.micOn = on;
  for (const entry of voiceRtc.peers.values()) if (entry.audio) entry.audio.muted = voiceCtl.deafened;
  if (callRtc.audio) callRtc.audio.muted = voiceCtl.deafened;
}
function toggleMute() { voiceCtl.muted = !voiceCtl.muted; applyVoiceCtl(); paintVoiceCtl(); renderCallbar(); }
function toggleDeafen() { voiceCtl.deafened = !voiceCtl.deafened; applyVoiceCtl(); paintVoiceCtl(); renderCallbar(); }
function paintVoiceCtl() {
  const mb = $("#me-mute"), db = $("#me-deafen");
  if (mb) {
    mb.classList.toggle("on", voiceCtl.muted);
    mb.dataset.tip = voiceCtl.muted ? "Unmute" : "Mute";
    mb.innerHTML = svgIcon(voiceCtl.muted ? "mic-off" : "mic");
  }
  if (db) {
    db.classList.toggle("on", voiceCtl.deafened);
    db.dataset.tip = voiceCtl.deafened ? "Undeafen" : "Deafen";
    db.innerHTML = svgIcon("headphones");
  }
}

function callRtcMicOn() { return micEnabled(); }
function callRtcToggleMic() { toggleMute(); }

/* ---------- speaking indicator (Web Audio level meter) --------------
   Each mic/remote stream gets an AnalyserNode; when its RMS crosses a
   threshold that fingerprint is "speaking" and every [data-fp] element for
   them (voice tiles, sidebar members) gets a `.speaking` class → a green
   aura in CSS. Runs on a single rAF loop; benign no-op if Web Audio is
   unavailable. Muted mic produces silence, so you don't light up when muted. */
const speakingSet = new Set();
const speakMon = new Map();   // fp -> { ctx, src, analyser, buf }
let speakRaf = 0;
function monitorStream(fp, stream) {
  if (!fp || !stream || speakMon.has(fp)) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  let ctx, src, analyser;
  try {
    ctx = new AC();
    ctx.resume && ctx.resume().catch(() => {});
    src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
  } catch (_) { return; }
  speakMon.set(fp, { ctx, src, analyser, buf: new Uint8Array(analyser.fftSize) });
  if (!speakRaf) speakRaf = requestAnimationFrame(speakTick);
}
function stopMonitor(fp) {
  const m = speakMon.get(fp);
  if (m) { try { m.src.disconnect(); m.ctx.close(); } catch (_) {} speakMon.delete(fp); }
  if (speakingSet.delete(fp)) setSpeakingClass(fp, false);
  if (!speakMon.size && speakRaf) { cancelAnimationFrame(speakRaf); speakRaf = 0; }
}
function setSpeakingClass(fp, on) {
  for (const e of document.querySelectorAll("[data-fp]"))
    if (e.dataset.fp === fp) e.classList.toggle("speaking", on);
}
function speakTick() {
  speakRaf = speakMon.size ? requestAnimationFrame(speakTick) : 0;
  for (const [fp, m] of speakMon) {
    m.analyser.getByteTimeDomainData(m.buf);
    let sum = 0;
    for (let i = 0; i < m.buf.length; i++) { const v = (m.buf[i] - 128) / 128; sum += v * v; }
    const speaking = Math.sqrt(sum / m.buf.length) > 0.045;
    const was = speakingSet.has(fp);
    if (speaking && !was) { speakingSet.add(fp); setSpeakingClass(fp, true); }
    else if (!speaking && was) { speakingSet.delete(fp); setSpeakingClass(fp, false); }
  }
}

// Called each poll: once the call is connected, the lower fp sends the offer;
// when the call is gone or dead, tear the media leg down.
function callRtcSync() {
  const fp = callRtc.peer;
  if (!fp) return;
  const c = callFor(fp);
  if (!c || c.state === "failed" || c.state === "disconnected") {
    if (!c || c.state === "failed") callRtcStop();
    return;
  }
  const ready = c.state === "connected" || c.state === "connecting";
  if (ready && !callRtc.offered && !callRtc.makingOffer
      && store.me.fingerprint < fp && callRtc.pc) {
    callRtc.offered = true;
    (async () => {
      try {
        callRtc.makingOffer = true;
        await callRtc.pc.setLocalDescription(await callRtc.pc.createOffer());
        callSignalSend(0, callRtc.pc.localDescription.sdp);
      } catch (_) { callRtc.offered = false; } finally { callRtc.makingOffer = false; }
    })();
  }
}

function callSignalSend(kind, data) {
  if (!callRtc.peer) return;
  api.post("/api/call/signal", { to: callRtc.peer, kind, data }).catch(() => {});
}

async function callRtcOnSignal(fp, kind, data) {
  if (callRtc.peer !== fp || !callRtc.pc) return;   // not our current call leg
  const pc = callRtc.pc;
  try {
    if (kind === 3) { callRtcStop(); return; }       // bye
    if (kind === 0) {                                 // offer
      const collision = callRtc.makingOffer || pc.signalingState !== "stable";
      if (collision && !callRtc.polite) return;       // impolite peer ignores
      if (collision) await pc.setLocalDescription({ type: "rollback" });
      await pc.setRemoteDescription({ type: "offer", sdp: data });
      for (const c of callRtc.pending.splice(0)) { try { await pc.addIceCandidate(c); } catch (_) {} }
      await pc.setLocalDescription(await pc.createAnswer());
      callSignalSend(1, pc.localDescription.sdp);
    } else if (kind === 1) {                           // answer
      await pc.setRemoteDescription({ type: "answer", sdp: data });
      for (const c of callRtc.pending.splice(0)) { try { await pc.addIceCandidate(c); } catch (_) {} }
    } else if (kind === 2) {                           // ICE
      const cand = JSON.parse(data);
      if (pc.remoteDescription && pc.remoteDescription.type) {
        try { await pc.addIceCandidate(cand); } catch (_) {}
      } else { callRtc.pending.push(cand); }
    }
  } catch (_) { /* negotiation races recover on the next poll */ }
}

function callFor(fp) { return store.calls.find(c => c.peer === fp) || null; }

async function callAction(fp, action) {
  const path = action === "start" ? "/api/call"
    : action === "accept" ? "/api/call/accept" : "/api/call/hangup";
  if (action === "hangup") {
    callRtcStop();
    try { await api.post(path, { peer: fp }); await refreshCalls(); }
    catch (e) { ui.sys("call: " + e.message); }
    return;
  }
  // start / accept: open the mic first (this pops the permission prompt), then
  // tell the engine. The browser peer connection is what carries the audio.
  try {
    await callRtcStart(fp);
  } catch (e) {
    const msg = (e && e.name === "NotAllowedError")
      ? "Microphone permission denied — allow it in the browser to talk."
      : "call: " + (e && e.message ? e.message : e);
    ui.say(msg);
    return;
  }
  try { await api.post(path, { peer: fp }); await refreshCalls(); }
  catch (e) { callRtcStop(); ui.sys("call: " + e.message); }
}

function renderCallbar() {
  const bar = $("#callbar");
  const t = curTarget();
  const c = (t && !t.startsWith("#") && !isSelf(t)) ? callFor(t) : null;
  if (!c) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.className = c.state === "connected" ? "connected" : "";
  bar.innerHTML = "";
  bar.appendChild(el("span", "dot"));
  const label = { calling: "Calling…", ringing: "Incoming call", connecting: "Connecting…",
    connected: "On a call", disconnected: "Reconnecting…", failed: "Call failed" }[c.state] || c.state;
  const labEl = el("span");
  labEl.innerHTML = svgIcon("phone") + " " + esc(label);
  bar.appendChild(labEl);
  bar.appendChild(el("span", "spacer"));
  if (c.incoming && c.state === "ringing") {
    const acc = el("button", "accept", "Accept");
    acc.onclick = () => callAction(t, "accept");
    bar.appendChild(acc);
  }
  if (c.state === "connected" && callRtc.peer === t && callRtc.localStream) {
    const mic = el("button");
    mic.innerHTML = svgIcon(callRtcMicOn() ? "mic" : "mic-off") + (callRtcMicOn() ? " Mute" : " Unmute");
    mic.onclick = callRtcToggleMic;
    bar.appendChild(mic);
  }
  const hang = el("button", "hangup", c.incoming && c.state === "ringing" ? "Decline" : "Hang up");
  hang.onclick = () => callAction(t, "hangup");
  bar.appendChild(hang);
}

function renderCallToast() {
  const toast = $("#call-toast");
  // Ring for an incoming call that isn't the DM currently open.
  const ring = store.calls.find(c => c.incoming && c.state === "ringing" && c.peer !== curTarget());
  if (!ring) { toast.hidden = true; return; }
  toast.hidden = false;
  toast.innerHTML = "";
  const ringLbl = el("span");
  ringLbl.innerHTML = svgIcon("phone") + " " + esc(dmLabel(ring.peer));
  toast.appendChild(ringLbl);
  const acc = el("button", "accept", "Accept");
  acc.onclick = () => { selectTarget("@dm", ring.peer); callAction(ring.peer, "accept"); };
  const dec = el("button", "decline", "Decline");
  dec.onclick = () => callAction(ring.peer, "hangup");
  toast.appendChild(acc);
  toast.appendChild(dec);
}

function renderGroupCallBar() {
  const bar = $("#gcallbar");
  const t = curTarget();
  const c = (t && t.startsWith("#")) ? groupCallFor(t.slice(1)) : null;
  if (!c) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.className = c.joined ? "joined" : "";
  bar.innerHTML = "";
  bar.appendChild(el("span", "dot"));
  const n = c.participants.length;
  const label = c.joined
    ? (n === 0 ? "In a group call — waiting for others" : "In a group call — " + n + " other" + (n === 1 ? "" : "s"))
    : "Group call in progress";
  const labEl = el("span");
  labEl.innerHTML = svgIcon("phone") + " " + esc(label);
  bar.appendChild(labEl);
  bar.appendChild(el("span", "spacer"));
  if (!c.joined) {
    const join = el("button", "accept", "Join");
    join.onclick = () => groupCallAction(c.channel, "join");

  }
  if (voiceRtc.channelId === c.channel && voiceRtc.localStream) {
    const mic = el("button");

    mic.onclick = voiceToggleMic;
    bar.appendChild(mic);
  }
  const leave = el("button", "hangup", "Leave");

function renderGroupCallToast() {
  const toast = $("#gcall-toast");
  // An invite/in-progress call for a channel that isn't the one currently open.
  const t = curTarget();
  const pending = Object.values(store.groupCalls).find(
    c => !c.joined && "#" + c.channel !== t
  );
  if (!pending) { toast.hidden = true; return; }
  toast.hidden = false;
  toast.innerHTML = "";
  const lbl = el("span");
  const who = pending.invited_by ? dmLabel(pending.invited_by) || short(pending.invited_by) : "someone";
  lbl.innerHTML = svgIcon("phone") + " Group call in " + esc(pending.channel_name || "a channel")
    + " (" + esc(who) + ")";
  toast.appendChild(lbl);
  const acc = el("button", "accept", "Join");
  acc.onclick = () => { selectTarget(store.view.server, "#" + pending.channel); groupCallAction(pending.channel, "join"); };
  const dec = el("button", "decline", "Dismiss");
  dec.onclick = () => { delete store.groupCalls[pending.channel]; renderGroupCallToast(); };
  toast.appendChild(acc);
  toast.appendChild(dec);
}

async function refreshVoice() {
  try {
    const v = await api.voice();
    if (JSON.stringify(v) !== JSON.stringify(store.voice)) {
      store.voice = v;
      render();
    }
    // Keep the mesh in step with who the relay says is in the room.
    if (voiceRtc.channelId) voiceSyncPeers();
  } catch (_) {}
}

/* ---------- ad-hoc group calls: the same real-audio mesh, started in an
   ordinary channel rather than a dedicated voice channel. Membership rides
   MLS (start/join/leave DMs), not a presence beacon, so the participant list
   comes from /api/groupcalls instead of /api/voice — voiceSyncPeers() reads
   whichever of the two has an entry for the connected channel. */
async function refreshGroupCalls() {
  try {
    const rows = await api.groupCalls();
    const map = {};
    for (const r of rows) map[r.channel] = r;
    if (JSON.stringify(map) !== JSON.stringify(store.groupCalls)) {
      store.groupCalls = map;
      renderGroupCallBar();
      renderGroupCallToast();
    }
    if (voiceRtc.channelId) voiceSyncPeers();
  } catch (_) {}
}

function groupCallFor(channelId) { return store.groupCalls[channelId] || null; }

async function groupCallAction(channelId, action) {
  try {
    if (action === "leave") {
      voiceRtcStop();
      await api.groupCallLeave(channelId);
    } else {
      // Mic first — this is what pops the browser permission prompt.
      await voiceRtcStart(channelId);
      if (action === "start") await api.groupCallStart(channelId);
      else await api.groupCallJoin(channelId);
    }
    await refreshGroupCalls();
    render();
    renderGroupCallBar();
  } catch (e) {
    voiceRtcStop();
    try { await api.groupCallLeave(channelId); } catch (_) {}
    const msg = (e && e.name === "NotAllowedError")
      ? "Microphone permission denied — allow it in the browser to talk."
      : (e && e.name === "NotFoundError")
      ? "No microphone found."
      : "group call: " + (e && e.message ? e.message : e);
    ui.say(msg);
    await refreshGroupCalls();
  }
}

/* ---------- voice channels: real browser WebRTC audio -------------------
   The browser owns the peer connections; `dante serve` only relays the
   offer / answer / ICE blobs (POST /api/voice/signal, delivered back as
   `voicesignal` stream items). A full mesh: for each pair, the lower
   fingerprint makes the offer. Presence still rides the engine's beacon
   via /api/voice so we know who to connect to. */
const voiceRtc = {
  channelId: null,        // id of the voice channel we're connected to (media)
  localStream: null,      // our mic MediaStream
  screenStream: null,     // our getDisplayMedia stream while sharing, else null
  micOn: true,
  iceServers: [],
  peers: new Map(),       // fingerprint -> { pc, audio, polite, pending, screenSenders, remoteScreen }
  // SFrame layer: an extra AES-GCM pass over each Opus frame, keyed off the
  // channel's MLS group-call key. The mesh's DTLS-SRTP already protects the
  // audio hop-by-hop; this is what would let a future SFU forward the media
  // without being able to decode it. No-op unless the browser exposes
  // WebRTC encoded transforms (Chromium `createEncodedStreams`).
  sframe: { epoch: -1, key: null, prevKey: null, prevAt: 0, timer: null },
};

// Re-paint the voice room if it's the open view (used by async media callbacks).
function voiceRerender() {
  if (curTarget() === "#" + voiceRtc.channelId) renderChat();
}

/* ---------- SFrame media layer -------------------------------------- */
const SFRAME_MAGIC = [0x44, 0x53, 0x46, 0x31];   // "DSF1"
function sframeAvailable() {
  return typeof RTCRtpSender !== "undefined"
    && "createEncodedStreams" in RTCRtpSender.prototype
    && "createEncodedStreams" in RTCRtpReceiver.prototype
    && typeof crypto !== "undefined" && crypto.subtle;
}
function sframeActive() { return !!voiceRtc.sframe.key; }
function sframePrevValid() {
  return voiceRtc.sframe.prevKey && (Date.now() - voiceRtc.sframe.prevAt) < 12000;
}

async function sframeDeriveKey(hex) {
  const raw = new Uint8Array(hex.match(/../g).map(h => parseInt(h, 16)));
  const hk = await crypto.subtle.importKey("raw", raw, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "HKDF", hash: "SHA-256", salt: new Uint8Array(0),
      info: new TextEncoder().encode("dante/sframe/v1") },
    hk, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}

// Poll the engine for the current per-epoch call key; re-derive on an epoch bump.
async function sframeRefreshKey() {
  if (!voiceRtc.channelId || !sframeAvailable()) return;
  let r;
  try { r = await api.get("/api/voice/key?channel=" + encodeURIComponent(voiceRtc.channelId)); }
  catch (_) { return; }
  if (!r || !r.key) return;
  if (r.epoch === voiceRtc.sframe.epoch && voiceRtc.sframe.key) return;
  try {
    const next = await sframeDeriveKey(r.key);
    voiceRtc.sframe.prevKey = voiceRtc.sframe.key;
    voiceRtc.sframe.prevAt = Date.now();
    voiceRtc.sframe.key = next;
    voiceRtc.sframe.epoch = r.epoch;
    voiceRerender();
  } catch (_) {}
}

function sframeStart() {
  if (!sframeAvailable()) return;
  sframeRefreshKey();
  voiceRtc.sframe.timer = setInterval(sframeRefreshKey, 3000);
}
function sframeStop() {
  if (voiceRtc.sframe.timer) clearInterval(voiceRtc.sframe.timer);
  voiceRtc.sframe = { epoch: -1, key: null, prevKey: null, prevAt: 0, timer: null };
}

async function sframeEncrypt(frame, controller) {
  const key = voiceRtc.sframe.key;
  if (key) {
    try {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, frame.data));
      const out = new Uint8Array(4 + 12 + ct.byteLength);
      out.set(SFRAME_MAGIC, 0); out.set(iv, 4); out.set(ct, 16);
      frame.data = out.buffer;
    } catch (_) { /* pass the plaintext frame through */ }
  }
  controller.enqueue(frame);
}
async function sframeDecrypt(frame, controller) {
  const buf = new Uint8Array(frame.data);
  const tagged = buf.length > 16 && SFRAME_MAGIC.every((b, i) => buf[i] === b);
  if (!tagged) { controller.enqueue(frame); return; }   // a peer without SFrame
  const iv = buf.subarray(4, 16);
  const ct = buf.subarray(16);
  for (const key of [voiceRtc.sframe.key, sframePrevValid() ? voiceRtc.sframe.prevKey : null]) {
    if (!key) continue;
    try {
      frame.data = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
      controller.enqueue(frame);
      return;
    } catch (_) {}
  }
  // Key desync — drop rather than feed ciphertext to the decoder (Opus PLC
  // covers the gap; the next key poll recovers).
}

// Install the transform on one sender / receiver (audio only).
function sframeAttach(rtpObj, dir) {
  if (!sframeAvailable() || !rtpObj || !rtpObj.track || rtpObj.track.kind !== "audio") return;
  if (rtpObj._sframe) return;
  let streams;
  try { streams = rtpObj.createEncodedStreams(); }
  catch (_) { return; }
  rtpObj._sframe = true;
  const tx = new TransformStream({ transform: dir === "enc" ? sframeEncrypt : sframeDecrypt });
  streams.readable.pipeThrough(tx).pipeTo(streams.writable).catch(() => {});
}

async function voiceAction(channelId, join) {
  try {
    if (join) {
      // Mic first — this is what pops the browser permission prompt.
      await voiceRtcStart(channelId);
      await api.voiceJoin(channelId);
    } else {
      voiceRtcStop();
      await api.voiceLeave(channelId);
    }
    await refreshVoice();
    render();
  } catch (e) {
    voiceRtcStop();
    try { await api.voiceLeave(channelId); } catch (_) {}
    const msg = (e && e.name === "NotAllowedError")
      ? "Microphone permission denied — allow it in the browser to talk."
      : (e && e.name === "NotFoundError")
      ? "No microphone found."
      : "voice: " + (e && e.message ? e.message : e);
    ui.say(msg);
    await refreshVoice();
  }
}

async function voiceRtcStart(channelId) {
  if (voiceRtc.channelId === channelId) return;
  if (voiceRtc.channelId) voiceRtcStop();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("this browser has no microphone API (needs a secure context)");
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  voiceRtc.localStream = stream;
  voiceRtc.micOn = true;
  applyVoiceCtl();                 // honour an existing mute/deafen
  monitorStream(store.me.fingerprint, stream);
  voiceRtc.channelId = channelId;
  try {
    voiceRtc.iceServers = iceToRtc(await api.get("/api/ice"));
  } catch (_) { voiceRtc.iceServers = []; }
  sframeStart();
  voiceSyncPeers();
}

function voiceRtcStop() {
  sframeStop();
  stopMonitor(store.me.fingerprint);
  for (const fp of [...voiceRtc.peers.keys()]) {
    voiceSignalSend(fp, 3, "");
    voicePeerClose(fp);
  }
  if (voiceRtc.localStream) {
    for (const t of voiceRtc.localStream.getTracks()) t.stop();
  }
  if (voiceRtc.screenStream) {
    for (const t of voiceRtc.screenStream.getTracks()) t.stop();
  }
  voiceRtc.localStream = null;
  voiceRtc.screenStream = null;
  voiceRtc.channelId = null;
  voiceRtc.peers.clear();
}

function voiceToggleMic() { toggleMute(); render(); }

// Share (or stop sharing) this screen into the room. Adding / removing the
// video track fires `onnegotiationneeded`; the perfect-negotiation logic in
// voicePeerConnect / voiceOnSignal renegotiates each peer transparently.
async function voiceToggleScreen() {
  if (!voiceRtc.channelId) return;
  if (voiceRtc.screenStream) { voiceStopScreen(); render(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    ui.say("this browser can't share a screen (needs a secure context)");
    return;
  }
  const fps = screenShareFps();
  const [resW, resH] = SCREEN_RES[screenShareRes()];
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        width: { ideal: resW, max: resW }, height: { ideal: resH, max: resH },
        frameRate: { ideal: fps, max: fps },
      },
      audio: false,
    });
  } catch (e) {
    if (e && e.name === "NotAllowedError") return;   // user dismissed the picker
    ui.say("screen share: " + (e && e.message ? e.message : e));
    return;
  }
  voiceRtc.screenStream = stream;
  const vid = stream.getVideoTracks()[0];
  if (vid) vid.onended = () => { voiceStopScreen(); render(); };  // "Stop sharing" in the browser chrome
  if (vid) vid.contentHint = "motion";   // bias capture itself toward smoothness
  for (const entry of voiceRtc.peers.values()) {
    for (const t of stream.getTracks()) {
      const sender = entry.pc.addTrack(t, stream);
      entry.screenSenders.push(sender);
      if (t.kind === "video") applyScreenSenderParams(sender, fps);
    }
  }
  render();
}

function voiceStopScreen() {
  const s = voiceRtc.screenStream;
  if (!s) return;
  for (const entry of voiceRtc.peers.values()) {
    for (const sender of entry.screenSenders.splice(0)) {
      try { entry.pc.removeTrack(sender); } catch (_) {}
    }
  }
  for (const t of s.getTracks()) t.stop();
  voiceRtc.screenStream = null;
}

// Connect to everyone the relay says is present; drop anyone who left.
// `cid` may be a dedicated voice channel (presence-driven, store.voice) or a
// channel with an ad-hoc group call in progress (MLS-membership-driven,
// store.groupCalls) — whichever has a live entry for it.
function voiceSyncPeers() {
  const cid = voiceRtc.channelId;
  if (!cid) return;
  const room = store.voice[cid] || store.groupCalls[cid] || { participants: [] };
  const me = store.me.fingerprint;
  const present = new Set((room.participants || []).filter(fp => fp !== me && short(fp) !== short(me)));
  for (const fp of present) {
    if (!voiceRtc.peers.has(fp)) voicePeerConnect(fp, me < fp);   // lower fp offers
  }
  for (const fp of [...voiceRtc.peers.keys()]) {
    if (!present.has(fp)) voicePeerClose(fp);
  }
}

function voicePeerClose(fp) {
  const p = voiceRtc.peers.get(fp);
  if (!p) return;
  try { p.pc.close(); } catch (_) {}
  if (p.audio) { try { p.audio.srcObject = null; } catch (_) {} }
  voiceRtc.peers.delete(fp);
  stopMonitor(fp);
  voiceRerender();
}

async function voicePeerConnect(fp, initiator) {
  if (voiceRtc.peers.has(fp)) return;
  const pc = new RTCPeerConnection({ iceServers: voiceRtc.iceServers });
  const entry = {
    pc, audio: null, polite: store.me.fingerprint > fp, pending: [], makingOffer: false,
    screenSenders: [], remoteScreen: null,
  };
  voiceRtc.peers.set(fp, entry);

  for (const t of voiceRtc.localStream.getTracks()) pc.addTrack(t, voiceRtc.localStream);
  // If we're already sharing when this peer joins, send them the screen too.
  if (voiceRtc.screenStream) {
    const fps = screenShareFps();
    for (const t of voiceRtc.screenStream.getTracks()) {
      const sender = pc.addTrack(t, voiceRtc.screenStream);
      entry.screenSenders.push(sender);
      if (t.kind === "video") applyScreenSenderParams(sender, fps);
    }
  }
  for (const s of pc.getSenders()) sframeAttach(s, "enc");

  pc.onicecandidate = e => {
    if (e.candidate) voiceSignalSend(fp, 2, JSON.stringify(e.candidate));
  };
  pc.ontrack = e => {
    if (e.track.kind === "video") {                 // a peer's shared screen
      entry.remoteScreen = e.streams[0];
      e.track.onended = () => { entry.remoteScreen = null; voiceRerender(); };
      e.track.onmute = voiceRerender;
      e.track.onunmute = voiceRerender;
      voiceRerender();
      return;
    }
    sframeAttach(e.receiver, "dec");
    let a = entry.audio;
    if (!a) { a = new Audio(); a.autoplay = true; entry.audio = a; }
    a.muted = voiceCtl.deafened;
    a.srcObject = e.streams[0];
    monitorStream(fp, e.streams[0]);
    a.play().catch(() => {});
    voiceRerender();
  };
  pc.onconnectionstatechange = () => {
    if (["failed", "closed", "disconnected"].includes(pc.connectionState)) {
      // Let presence-driven voiceSyncPeers re-establish if they're still here.
      if (pc.connectionState === "failed") voicePeerClose(fp);
    }
    voiceRerender();
  };
  pc.onnegotiationneeded = async () => {
    try {
      entry.makingOffer = true;
      await pc.setLocalDescription(await pc.createOffer());
      voiceSignalSend(fp, 0, pc.localDescription.sdp);
    } catch (_) {} finally { entry.makingOffer = false; }
  };
  // Non-initiators wait for the offer; `onnegotiationneeded` fires on the
  // initiator once tracks are added.
  if (!initiator) { /* wait */ }
}

function voiceSignalSend(fp, kind, data) {
  api.post("/api/voice/signal", { channel: voiceRtc.channelId, to: fp, kind, data }).catch(() => {});
}

// Play a soundboard clip (own trigger or a relayed one). `hashHex` is the
// server blob's SHA-256; the clip is fetched same-origin and played locally.
let _lastRoomSoundAt = 0;
function playRoomSound(hashHex) {
  if (!/^[0-9a-f]{64}$/.test(hashHex)) return;
  try {
    const a = new Audio("/api/sound?hash=" + encodeURIComponent(hashHex));
    a.volume = 0.8;
    a.play().catch(() => {});
  } catch (_) {}
}
function triggerRoomSound(hashHex) {
  const now = Date.now();
  if (now - _lastRoomSoundAt < 1000) return;   // one clip/sec, client-side
  _lastRoomSoundAt = now;
  playRoomSound(hashHex);
  for (const fp of voiceRtc.peers.keys()) voiceSignalSend(fp, 4, hashHex);
}

// A relayed offer / answer / ICE / bye / soundboard from another participant.
async function voiceOnSignal(fp, kind, data) {
  if (!voiceRtc.channelId) return;
  if (kind === 4) { playRoomSound(data); return; }
  if (kind === 3) { voicePeerClose(fp); return; }
  if (!voiceRtc.peers.has(fp)) {
    if (kind !== 0) return;                 // only an offer bootstraps a peer
    await voicePeerConnect(fp, false);
  }
  const entry = voiceRtc.peers.get(fp);
  const pc = entry.pc;
  try {
    if (kind === 0) {                       // offer
      const collision = entry.makingOffer || pc.signalingState !== "stable";
      if (collision && !entry.polite) return;   // impolite peer ignores
      if (collision) await pc.setLocalDescription({ type: "rollback" });
      await pc.setRemoteDescription({ type: "offer", sdp: data });
      for (const c of entry.pending.splice(0)) { try { await pc.addIceCandidate(c); } catch (_) {} }
      await pc.setLocalDescription(await pc.createAnswer());
      voiceSignalSend(fp, 1, pc.localDescription.sdp);
    } else if (kind === 1) {                // answer
      await pc.setRemoteDescription({ type: "answer", sdp: data });
      for (const c of entry.pending.splice(0)) { try { await pc.addIceCandidate(c); } catch (_) {} }
    } else if (kind === 2) {                // ICE candidate
      const cand = JSON.parse(data);
      if (pc.remoteDescription && pc.remoteDescription.type) {
        try { await pc.addIceCandidate(cand); } catch (_) {}
      } else {
        entry.pending.push(cand);
      }
    }
  } catch (e) { /* renegotiation races are expected; presence sync recovers */ }
}

/* ---------- polling ---------------------------------------------- */
function ingest(items) {
  for (const it of items) {
    // Skip anything already applied — the SSE stream and the fallback poll can
    // both deliver the same item, and the folding below isn't idempotent.
    if (it.seq > 0 && it.seq <= store.seen) continue;
    store.seen = Math.max(store.seen, it.seq);
    it._at = Date.now();
    if (it.kind === "channeledit") {
      // Fold an edit/delete into the channel message it points at.
      const tgt = "#" + it.channel;
      const msg = store.messages.find(m => m.kind === "channel" && m._target === tgt && m.ref_seq === it.ref_seq);
      if (msg) {
        if (it.deleted) { msg._deleted = true; msg.text = ""; }
        else { msg.text = it.text; msg._edited = true; }
      }
      continue;
    }
    if (it.kind === "channelpin") {
      const tgt = "#" + it.channel;
      const bag = store.pins[tgt] || (store.pins[tgt] = {});
      if (it.pinned) bag[it.ref_seq] = { by: it.by, at_ms: it.at_ms };
      else delete bag[it.ref_seq];
      continue;
    }
    if (it.kind === "dmedit") {
      store.dmEdits[it.msg_id] = { text: it.text, deleted: it.deleted };
      continue;
    }
    if (it.kind === "voicesignal") {
      if (it.channel === voiceRtc.channelId) voiceOnSignal(it.from, it.sig_kind, it.data);
      continue;
    }
    if (it.kind === "callsignal") {
      callRtcOnSignal(it.from, it.sig_kind, it.data);
      continue;
    }
    if (it.kind === "notice") {
      notify("DaNTe", it.text);
      if (it.tag === "invite") {
        // Actionable — surface it in the tray list, don't stack it as a
        // dismissable notice.
        refreshInvites();
        renderNotifButton();
        continue;
      }
      store.notices.unshift({ tag: it.tag, text: it.text, scope: it.scope || "", at: Date.now() });
      store.notices = store.notices.slice(0, 50);
      if (it.tag === "kicked" && it.scope) {
        // Drop the removed server's channels and their history right away.
        const gone = new Set(store.channels.filter(c => c.root === it.scope).map(c => "#" + c.id));
        store.channels = store.channels.filter(c => c.root !== it.scope);
        store.messages = store.messages.filter(m => !gone.has(m._target));
        if (gone.has(curTarget())) selectTarget("@dm", null);
      }
      renderNotifButton();
      render();
      continue;
    }
    if (it.kind === "channel") {
      it._target = "#" + it.channel;
      if (!it.from) it.from = "you";
    } else {
      // message / file: attribute to the DM it belongs to
      it._target = it.peer || (it.from === "you" ? (store._pendingDmTarget || curTarget()) : it.from);
    }
    store.messages.push(it);
    const elsewhere = it._target && it._target !== curTarget();
    const fromOther = it.from && it.from !== "you";
    if (elsewhere && fromOther) store.bumpUnread(it._target);
    // Mention: a channel message from someone else naming my fingerprint.
    if (it.kind === "channel" && fromOther && it.text
        && it.text.includes("@" + store.me.fingerprint)) {
      store.mentions.add(it._target);
      if (it._target !== curTarget() && !store.isMuted(it._target))
        notify("Mentioned in " + store.channelName(it.channel), it.text);
    } else if (elsewhere && fromOther && it.kind !== "channel" && it.text
        && document.hidden && !store.isMuted(it._target)) {
      // A DM while the tab is in the background.
      notify(dmLabel(it._target), it.text);
    }
    // auto-list an unknown DM partner — only for a real text DM (has a msg id),
    // never for system lines (call notices etc.)
    if (it.kind === "message" && it.msg_id && it.from && it.from !== "you"
        && !store.dms.some(d => short(d.fp) === it.from || d.fp === it.from)) {
      store.dms.push({ fp: it.from }); LS.set("dms", store.dms);
    }
  }
  if (store.messages.length > 4000) store.messages.splice(0, store.messages.length - 4000);
}

async function poll() {
  try {
    const items = await api.messages(store.seen);
    if (items.length) { ingest(items); render(); }
  } catch (_) {}
}

// Server-Sent Events: near-instant delivery. `poll()` stays as a slow fallback
// for when the stream is down. On error we close and reopen with the *current*
// cursor rather than let the browser replay from a stale `since=` (which would
// double messages, since `ingest` isn't dedup-idempotent).
let es = null;
function openStream() {
  try { if (es) es.close(); } catch (_) {}
  try {
    es = new EventSource("/api/stream?since=" + store.seen);
    es.onmessage = ev => {
      try { ingest([JSON.parse(ev.data)]); render(); } catch (_) {}
    };
    es.onerror = () => {
      try { es.close(); } catch (_) {}
      es = null;
      setTimeout(openStream, 2000);
    };
  } catch (_) { es = null; }
}
async function pollTyping() {
  try {
    const r = await api.typing();
    // `who` carries fingerprints — render with display names.
    const names = (r.who || []).map(fp => authorLabel(fp));
    let text = "";
    if (names.length === 1) text = names[0] + " is typing…";
    else if (names.length === 2) text = names[0] + " and " + names[1] + " are typing…";
    else if (names.length === 3) text = names[0] + ", " + names[1] + " and " + names[2] + " are typing…";
    else if (names.length > 3) text = "several people are typing…";
    else text = r.text || "";
    if (text !== store.typingText) { store.typingText = text; renderTyping(); }
  } catch (_) {}
}
async function refreshChannels() {
  try {
    const ch = await api.channels();
    const changed = JSON.stringify(ch) !== JSON.stringify(store.channels);
    store.channels = ch;
    if (changed) render();
  } catch (_) {}
}
async function refreshPolicies() {
  const roots = [...new Set(store.channels.map(c => c.root))];
  for (const root of roots) {
    try {
      const p = await api.policy(root);
      if (p && p.version != null) {
        const changed = JSON.stringify(p) !== JSON.stringify(store.policies[root]);
        store.policies[root] = p;
        store.emojis[root] = Object.fromEntries((p.emojis || []).map(e => [e.name, e.hash]));
        store.stickers[root] = Object.fromEntries((p.stickers || []).map(e => [e.name, e.hash]));
        store.sounds[root] = Object.fromEntries((p.sounds || []).map(e => [e.name, e.hash]));
        updateStickerButton();
        if (changed) render();
      }
    } catch (_) {}
  }
  // Keep the open DM's verification badge fresh (a key rotation can flip it).
  const t = curTarget();
  if (isDM() && t && !isSelf(t)) {
    try {
      const s = await api.get("/api/safety?peer=" + encodeURIComponent(t));
      if (JSON.stringify(s) !== JSON.stringify(store.safety[t])) { store.safety[t] = s; renderChat(); }
    } catch (_) {}
  }
}

$("#composer").addEventListener("submit", async e => {
  e.preventDefault();
  const box = $("#text");
  const text = box.value.trim();
  const t = curTarget();
  if (!text || !t) return;
  box.value = "";
  try {
    if (isSelf(t)) {
      // Local-only note: no relay round-trip, so nothing echoes back to double.
      const note = { kind: "message", from: "you", text, _target: t, _at: Date.now(), seq: -1 };
      store.messages.push(note);
      const notes = LS.get("notes", []); notes.push({ text: note.text, at: note._at }); LS.set("notes", notes);
      renderChat();
    } else if (t.startsWith("#")) {
      const rt = (store._replyTo && store._replyTo.target === t) ? store._replyTo.seq : null;
      store._replyTo = null; renderReplyBar();
      await api.send(t, text, rt);             // channel echo comes back via poll
    } else {
      store._pendingDmTarget = t;
      const res = await api.send(t, text);
      store._pendingDmTarget = null;
      const mid = res && typeof res.ok === "string" && /^[0-9a-f]{32}$/.test(res.ok) ? res.ok : undefined;
      store.messages.push({ kind: "message", from: "you", text, _target: t, _at: Date.now(), seq: -1, msg_id: mid });
      renderChat();
    }
  } catch (err) { ui.sys("Send failed: " + err.message); }
});
// ---- file attachments (DMs only) --------------------------------
const MAX_ATTACH = 9 * 1024 * 1024;
async function sendFile(file) {
  const t = curTarget();
  if (!t || t.startsWith("#") || isSelf(t)) { ui.say("Files can only be sent in a direct message."); return; }
  if (!file) return;
  if (file.size > MAX_ATTACH) { ui.say("That file is larger than " + Math.round(MAX_ATTACH / 1048576) + " MiB."); return; }
  const stamp = { kind: "file", from: "you", filename: file.name, size: file.size, saved: "",
    mime: file.type || "", _target: t, _at: Date.now(), seq: -1 };
  try { stamp._localUrl = URL.createObjectURL(file); } catch (_) {}
  store.messages.push(stamp); renderChat();
  try {
    const buf = await file.arrayBuffer();
    await fetch("/api/file?to=" + encodeURIComponent(t) + "&name=" + encodeURIComponent(file.name),
      { method: "POST", body: buf });
  } catch (e) {
    stamp.saved = "(send failed)"; renderChat();
    ui.say("File send failed: " + e.message);
  }
}

// ---- @mention autocomplete ----------------------------------------
let mentionState = null; // { start, matches, sel }
function closeMentionPopup() {
  mentionState = null;
  const p = $("#mention-popup"); if (p) p.hidden = true;
}
function mentionAutocomplete() {
  const box = $("#text");
  const t = curTarget();
  if (!t || !t.startsWith("#")) return closeMentionPopup();
  const upto = box.value.slice(0, box.selectionStart);
  const m = upto.match(/(?:^|\s)@([A-Za-z0-9-]*)$/);
  if (!m) return closeMentionPopup();
  const q = m[1].toUpperCase();
  const start = box.selectionStart - m[1].length;
  const people = knownPeople().filter(fp => fp !== store.me.fingerprint);
  const matches = people
    .map(fp => ({ fp, label: mentionLabel(fp) }))
    .filter(x => x.fp.replace(/-/g, "").startsWith(q.replace(/-/g, "")) || x.label.toUpperCase().includes(q))
    .slice(0, 8);
  if (!matches.length) return closeMentionPopup();
  mentionState = { start, matches, sel: 0 };
  renderMentionPopup();
}
function renderMentionPopup() {
  let p = $("#mention-popup");
  if (!p) { p = el("div"); p.id = "mention-popup"; document.body.appendChild(p); }
  p.hidden = false;
  p.innerHTML = "";
  mentionState.matches.forEach((x, i) => {
    const row = el("div", "mrow" + (i === mentionState.sel ? " sel" : ""));
    row.textContent = x.label + "  " + short(x.fp);
    row.onmousedown = e => { e.preventDefault(); pickMention(i); };
    p.appendChild(row);
  });
  const box = $("#text");
  const r = box.getBoundingClientRect();
  p.style.left = r.left + "px";
  p.style.bottom = (window.innerHeight - r.top + 4) + "px";
  p.style.minWidth = r.width + "px";
}
function mentionKeydown(e) {
  if (!mentionState) return;
  if (e.key === "ArrowDown") { e.preventDefault(); mentionState.sel = (mentionState.sel + 1) % mentionState.matches.length; renderMentionPopup(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); mentionState.sel = (mentionState.sel + mentionState.matches.length - 1) % mentionState.matches.length; renderMentionPopup(); }
  else if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); pickMention(mentionState.sel); }
  else if (e.key === "Escape") { closeMentionPopup(); }
}
function pickMention(i) {
  const box = $("#text");
  const x = mentionState.matches[i];
  const before = box.value.slice(0, mentionState.start - 1); // drop the '@'
  const after = box.value.slice(box.selectionStart);
  box.value = before + "@" + x.fp + " " + after;
  const pos = (before + "@" + x.fp + " ").length;
  box.setSelectionRange(pos, pos);
  closeMentionPopup();
  box.focus();
}

$("#btn-notif").onclick = () => {
  const items = [];
  const seen = new Set();
  const label = t => t === store.me.fingerprint ? "Private Note"
    : t.startsWith("#") ? "#" + store.channelName(t.slice(1)) : ("@ " + dmLabel(t));
  // Pending channel invites — actionable.
  for (const inv of store.invites) {
    items.push({ iconName: "user-plus", label: `Accept invite · #${inv.channel_name} in ${inv.server_name}`,
      run: () => respondInvite(inv.channel, true) });
    items.push({ iconName: "x", label: `Decline · #${inv.channel_name}`,
      run: () => respondInvite(inv.channel, false) });
  }
  if (store.invites.length) items.push("sep");
  for (const n of store.notices.slice(0, 10)) {
    items.push({ iconName: "ban", label: n.text, run: () => {} });
  }
  if (store.notices.length && (store.mentions.size || [...store.unread].some(([, c]) => c))) items.push("sep");
  for (const t of store.mentions) {
    seen.add(t);
    items.push({ iconName: "bell", label: "Mention · " + label(t), run: () => jumpTo(t) });
  }
  for (const [t, c] of store.unread) {
    if (seen.has(t) || store.isMuted(t) || !c) continue;
    items.push({ iconName: "hash", label: `${c} unread · ${label(t)}`, run: () => jumpTo(t) });
  }
  if (!items.length) items.push({ label: "Nothing new", disabled: true, run: () => {} });
  if (store.notices.length) {
    items.push("sep");
    items.push({ iconName: "x", label: "Clear notices", run: () => { store.notices = []; renderNotifButton(); } });
  }
  ctxAnchor($("#btn-notif"), items);
};
function jumpTo(t) {

/* ---------- screen share quality settings ------------------------------- */
// Resolution presets, ideal dimensions handed to getDisplayMedia as a cap —
// asking the browser to encode at 4K when the user picked 720p is how a
// screen share ends up choppy: bitrate goes to pixels instead of frames.
const SCREEN_RES = {
  "480p": [854, 480], "720p": [1280, 720], "1080p": [1920, 1080],
  "1440p": [2560, 1440], "2160p": [3840, 2160],
};
const SCREEN_FPS_OPTS = [15, 30, 60, 120];

function screenShareFps() {
  const v = LS.get("screen_fps", 30);
  return SCREEN_FPS_OPTS.includes(v) ? v : 30;
}
function screenShareRes() {
  const v = LS.get("screen_res", "1080p");
  return SCREEN_RES[v] ? v : "1080p";
}

// Bias the encoder toward frame rate over resolution under bandwidth
// pressure. WebRTC's default (`balanced`) drops fps first to protect
// sharpness, which is the usual cause of a screen share looking choppy even
// on a fine connection — most of what's shared is motion (video, scrolling,
// cursor movement), not fine static detail.
function applyScreenSenderParams(sender, fps) {
  if (!sender || !sender.setParameters || !sender.getParameters) return;
  try {
    const params = sender.getParameters();
    if (!params.encodings || !params.encodings.length) params.encodings = [{}];
    params.encodings[0].maxFramerate = fps;
    params.degradationPreference = "maintain-framerate";
    sender.setParameters(params).catch(() => {});
  } catch (_) {}
}

async function bansFlow(server) {
  const root = store.rootOf(server);
  if (!root) return ui.say("Unknown server root.");
  let bans;
  try { bans = await api.get("/api/server/bans?server=" + encodeURIComponent(root)); }
  catch (e) { return ui.say("Could not load bans: " + e.message); }
  if (!bans.length) return ui.say("No one is banned from " + server + ".");
  const list = bans.map((fp, i) => `${i + 1}. ${username(fp) || short(fp)}  (${short(fp)})`).join("\n");
  const pick = parseInt(await ui.ask(
    "Banned from " + server + ":\n\n" + list + "\n\nUnban which number? (blank to close)"), 10);
  const fp = bans[pick - 1];
  if (!fp) return;
  try { await api.post("/api/server/unban", { server: root, member: fp }); ui.sys("Unbanned " + (username(fp) || short(fp)) + "."); }
  catch (e) { ui.say("Unban failed: " + e.message); }
}

let searchTimer = null;
function openSearch() {
  if ($("#search-overlay")) return;
  const ov = el("div"); ov.id = "search-overlay";
  const box = el("div", "search-box");
  const inp = el("input"); inp.placeholder = "Search your messages…"; inp.autocomplete = "off";
  const results = el("div", "search-results");
  box.append(inp, results);
  ov.appendChild(box);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.addEventListener("keydown", function esc(e) {
    if (e.key === "Escape" && $("#search-overlay")) { ov.remove(); document.removeEventListener("keydown", esc); }
  });
  document.body.appendChild(ov);
  inp.focus();
  inp.addEventListener("input", () => {
    clearTimeout(searchTimer);
    const q = inp.value.trim();
    if (q.length < 2) { results.innerHTML = ""; return; }
    searchTimer = setTimeout(async () => {
      try {
        const hits = await api.get("/api/search?q=" + encodeURIComponent(q));
        results.innerHTML = "";
        if (!hits.length) { results.appendChild(el("div", "search-empty", "No matches.")); return; }
        for (const h of hits) {
          const row = el("div", "search-hit");
          const where = h.channel ? ("#" + (h.scope_name || short(h.scope))) : ("@ " + (dmLabel(h.scope) || short(h.scope)));
          row.appendChild(Object.assign(el("div", "sh-where"), { textContent: where + "  ·  " + (h.from === "you" ? "you" : short(h.from)) }));
          row.appendChild(Object.assign(el("div", "sh-text"), { innerHTML: highlight(h.text, q) }));
          row.onclick = () => {
            ov.remove();
            if (h.channel) {
              const ch = store.channels.find(c => c.id === h.scope);
              if (ch) selectTarget(ch.server, "#" + h.scope);
            } else {
              selectTarget("@dm", h.scope);
            }
          };
          results.appendChild(row);
        }
      } catch (e) { results.innerHTML = ""; results.appendChild(el("div", "search-empty", "Search failed.")); }
    }, 180);
  });
}
function highlight(text, q) {
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(text.slice(0, 200));
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length, i + q.length + 160));
}

function openPins(target) {
  if ($("#pins-overlay")) return;
  const ov = el("div"); ov.id = "pins-overlay";
  const box = el("div", "pins-box");
  box.appendChild(Object.assign(el("h3"), { innerHTML: svgIcon("pin") + " Pinned in #" + esc(store.channelName(target.slice(1))) }));
  const list = el("div", "pins-list");
  box.appendChild(list);
  ov.appendChild(box);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.addEventListener("keydown", function esc(e) {
    if (e.key === "Escape" && $("#pins-overlay")) { ov.remove(); document.removeEventListener("keydown", esc); }
  });
  document.body.appendChild(ov);

  const bag = store.pins[target] || {};
  const seqs = Object.keys(bag).map(Number).sort((a, b) => a - b);
  if (!seqs.length) { list.appendChild(el("div", "pins-empty", "Nothing pinned yet.")); return; }
  for (const rs of seqs) {
    const info = bag[rs];
    const msg = store.messages.find(m => m.kind === "channel" && m._target === target && m.ref_seq === rs);
    const row = el("div", "pin-row");
    const who = msg ? (msg.from === "you" ? "you" : short(msg.from)) : "";
    row.appendChild(Object.assign(el("div", "pr-meta"), {
      textContent: (who ? who + "  ·  " : "") + "pinned by " + short(info.by) + "  ·  " + relTime(info.at_ms),
    }));
    row.appendChild(Object.assign(el("div", "pr-text"), {
      innerHTML: msg ? (msg._deleted ? "<i>(message deleted)</i>" : richText(msg.text)) : "<i>message not loaded</i>",
    }));
    row.onclick = () => { ov.remove(); if (msg) flashMessage(target, rs); };
    list.appendChild(row);
  }
}

function relTime(ms) {
  if (!ms) return "";
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

function flashMessage(target, refSeq) {
  if (curTarget() !== target) {
    const ch = store.channels.find(c => "#" + c.id === target);
    if (ch) selectTarget(ch.server, target);
  }
  setTimeout(() => {
    const log = $("#log");
    for (const g of log.querySelectorAll(".msg-group")) {
      if (g._refSeq === refSeq) { g.scrollIntoView({ block: "center" }); g.style.transition = "background .3s"; g.style.background = "var(--bg-active)"; setTimeout(() => g.style.background = "", 900); break; }
    }
  }, 80);
}

/* ---------- boot ----------------------------------------------- */
async function init() {
  let state;
  try { state = await (await fetch("/api/state")).json(); }
  catch (_) { state = { ready: false, has_keystore: false }; }
  if (!state.ready) { renderOnboard(state); return; }

  $("#app").dataset.members = LS.get("members", "shown");
  try {
    store.me = await api.me();
    paintMe(true);
  } catch (_) { $("#me-sub").textContent = "offline"; }

  // localStorage is per-origin, so a different identity reusing this port would
  // otherwise inherit the previous one's DM list / notes / mutes. Wipe them
  // when the identity changes.
  if (store.me.fingerprint && LS.get("identity", "") !== store.me.fingerprint) {
    for (const k of ["dms", "notes", "muted", "view"]) LS.set(k, k === "view" ? { server: "@dm", target: null } : []);
    store.dms = []; store.muted = new Set(); store.view = { server: "@dm", target: null };
    LS.set("identity", store.me.fingerprint);
  }

  // restore local Private Notes
  for (const n of LS.get("notes", [])) {
    store.messages.push({ kind: "message", from: "you", text: n.text, _target: store.me.fingerprint, _at: n.at, seq: -1 });
  }

  await refreshChannels();

  // restore last view if still valid
  const v = store.view;
  if (v.server !== "@dm" && !store.servers().includes(v.server)) store.view = { server: "@dm", target: store.dms[0] ? store.dms[0].fp : null };
  selectTarget(store.view.server, store.view.target);

  // Re-assert the opt-in link-preview choice; the server defaults it off on
  // every restart, so a stale enabled flag here can't silently keep it on.
  if (store.embedsOn) api.post("/api/embeds", { on: true }).catch(() => {});

  poll();
  openStream();
  refreshPolicies();
  refreshContacts();
  refreshBlocked();
  refreshUsernames();
  refreshInvites();
  refreshCalls();
  refreshVoice();
  refreshGroupCalls();
  setInterval(poll, 3000);
  setInterval(pollTyping, 1200);
  setInterval(refreshChannels, 5000);
  setInterval(refreshReactions, 1500);
  setInterval(refreshPolicies, 6000);
  setInterval(refreshContacts, 8000);
  setInterval(refreshBlocked, 8000);
  setInterval(refreshUsernames, 10000);
  setInterval(refreshInvites, 6000);
  setInterval(refreshCalls, 1200);
  setInterval(refreshVoice, 1500);
  setInterval(refreshGroupCalls, 1500);
}
paintIcons();
init();
</script>
</body>
</html>
