<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DaNTe</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e9ef; --muted:#8b93a7; --accent:#6ee7b7; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { padding:.6rem 1rem; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:1rem; align-items:baseline; flex-wrap:wrap; }
  header b { color:var(--accent); }
  header .fp { font-family:ui-monospace,monospace; color:var(--muted); word-break:break-all; }
  #bar { padding:.5rem 1rem; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  #bar input { flex:1; min-width:14rem; }
  input, button { font:inherit; background:#0b0d11; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:.45rem .6rem; }
  button { background:var(--accent); color:#08130d; border:0; cursor:pointer; font-weight:600; }
  button.ghost { background:#0b0d11; color:var(--fg); border:1px solid var(--line); font-weight:500; }
  #chans { padding:.4rem 1rem; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; }
  #chans .lbl { color:var(--muted); font-size:.85em; }
  .chip { background:#0b0d11; border:1px solid var(--line); border-radius:999px; padding:.25rem .7rem; cursor:pointer; font-size:.85em; }
  .chip.active { background:#123326; border-color:#1c5140; color:var(--accent); }
  #targetbar { padding:.3rem 1rem; }
  #target { color:var(--muted); font-size:.85em; font-family:ui-monospace,monospace; word-break:break-all; }
  #log { flex:1; overflow:auto; padding:1rem; display:flex; flex-direction:column; gap:.4rem; }
  .msg { max-width:70ch; padding:.4rem .6rem; border-radius:8px; background:var(--panel); border:1px solid var(--line); }
  .msg.me { align-self:flex-end; background:#123326; border-color:#1c5140; }
  .msg .who { color:var(--muted); font-size:.8em; font-family:ui-monospace,monospace; }
  .msg .chan { color:var(--accent); font-size:.8em; }
  .sys { color:var(--muted); font-style:italic; }
  #composer { display:flex; gap:.5rem; padding:.75rem 1rem; background:var(--panel); border-top:1px solid var(--line); }
  #composer input { flex:1; }
</style>
</head>
<body>
<header>
  <b>DaNTe</b>
  <span>you are <span class="fp" id="me">…</span></span>
</header>
<div id="bar">
  <input id="peer" placeholder="peer fingerprint (base32 or 24 words), or #channel-id" spellcheck="false" />
  <button id="settarget">set target</button>
  <button id="newserver" class="ghost">new server</button>
  <button id="newchannel" class="ghost">new channel</button>
  <button id="invite" class="ghost">invite</button>
</div>
<div id="chans"><span class="lbl">channels:</span></div>
<div id="targetbar"><span id="target">no target</span></div>
<div id="log"></div>
<form id="composer">
  <input id="text" placeholder="message…" autocomplete="off" autofocus />
  <button>send</button>
</form>
<script>
const $ = s => document.querySelector(s);
const log = $("#log");
let target = null;       // a fingerprint, or "#<channel-id>"
let seen = 0;
let channels = [];       // [{id,name,server}]

function line(cls, who, text, chan) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (chan) { const c = document.createElement("div"); c.className = "chan"; c.textContent = "#" + chan; d.appendChild(c); }
  if (who) { const w = document.createElement("div"); w.className = "who"; w.textContent = who; d.appendChild(w); }
  const t = document.createElement("div"); t.textContent = text; d.appendChild(t);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function sys(t){ const d=document.createElement("div"); d.className="sys"; d.textContent=t; log.appendChild(d); log.scrollTop=log.scrollHeight; }

function setTarget(v) {
  target = v ? v.trim() : null;
  $("#target").textContent = target ? ("target: " + target) : "no target";
  renderChans();
}

function renderChans() {
  const box = $("#chans");
  box.querySelectorAll(".chip").forEach(e => e.remove());
  for (const c of channels) {
    const chip = document.createElement("span");
    chip.className = "chip" + (target === "#" + c.id ? " active" : "");
    chip.textContent = "#" + c.name + " (" + c.server + ")";
    chip.title = c.id;
    chip.onclick = () => setTarget("#" + c.id);
    box.appendChild(chip);
  }
  if (!channels.length) {
    const s = document.createElement("span");
    s.className = "chip"; s.style.cursor = "default"; s.style.opacity = ".6";
    s.textContent = "none yet";
    box.appendChild(s);
  }
}

async function refreshChans() {
  try { channels = await (await fetch("/api/channels")).json(); renderChans(); }
  catch (e) { /* transient */ }
}

async function init() {
  const me = await (await fetch("/api/me")).json();
  $("#me").textContent = me.fingerprint;
  sys("your word phrase: " + me.words);
  setTarget(null);
  await refreshChans();
  poll();
  setInterval(poll, 2000);
  setInterval(refreshChans, 5000);
}

async function poll() {
  try {
    const items = await (await fetch("/api/messages?since=" + seen)).json();
    for (const it of items) {
      seen = it.seq;
      if (it.kind === "message") line("", it.from, it.text);
      else if (it.kind === "channel") line(it.from === "you" ? "me" : "", it.from, it.text, it.channel_name || it.channel.split("-")[0]);
      else if (it.kind === "file") sys(`${it.from} sent file "${it.filename}" (${it.size} bytes) — saved to ${it.saved}`);
    }
  } catch (e) { /* transient */ }
}

async function post(url, obj) {
  const r = await fetch(url, { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(obj) });
  const body = await r.text();
  if (!r.ok) { sys(url + " failed: " + body); return null; }
  try { return JSON.parse(body); } catch (e) { return {}; }
}

$("#settarget").onclick = () => { setTarget($("#peer").value); sys(target ? "target set" : "target cleared"); };

$("#newserver").onclick = async () => {
  const name = prompt("server name?"); if (!name) return;
  const r = await post("/api/server", { name });
  if (r) sys(`server "${name}" created — root ${r.ok}`);
};

$("#newchannel").onclick = async () => {
  const server = prompt("server root key (base32)?"); if (!server) return;
  const name = prompt("channel name?"); if (!name) return;
  const r = await post("/api/channel", { server, name });
  if (r) { sys(`channel "${name}" created — #${r.ok}`); refreshChans(); }
};

$("#invite").onclick = async () => {
  let channel = target && target.startsWith("#") ? target : prompt("channel id (base32)?");
  if (!channel) return;
  const peer = prompt("invitee fingerprint (base32)?"); if (!peer) return;
  const r = await post("/api/invite", { channel, peer });
  if (r) sys("invite sent");
};

$("#composer").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("#text").value;
  if (!text) return;
  if (!target) { sys("set a target first"); return; }
  $("#text").value = "";
  const r = await fetch("/api/send", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ to: target, text }) });
  if (r.ok) {
    if (target.startsWith("#")) { /* echoed back by the server via the inbox */ }
    else line("me", "you", text);
  } else sys("send failed: " + (await r.text()));
};
init();
</script>
</body>
</html>
