<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DaNTe</title>
<style>
/* ============================================================================
   DaNTe web client — a deliberately throwaway UI, but structured so panes can
   be replaced piece by piece. Layout mirrors Discord: server rail | channel
   list | chat | member list. Baseline 800x500; below 800px the shell scrolls
   rather than collapsing.
   ========================================================================== */

/* Toggling visibility with el.hidden / the [hidden] attribute must win over
   any `display:` set by an id/class rule below (e.g. #onboard, .icon-btn). */
[hidden] { display: none !important; }

:root {
  /* ---- type -------------------------------------------------------------- */
  --font-sans: "Inter var", "Inter", -apple-system, BlinkMacSystemFont,
    "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto,
    "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", "Cascadia Code",
    "JetBrains Mono", "Fira Code", "Roboto Mono", Menlo, Consolas, monospace;

  /* ---- brand accents (from the project's inspiration set) --------------- */
  --blazing-flame:  #ff3c00;
  --space-indigo:   #2e294e;
  --alabaster-grey: #e6e6ef;
  --orange:         #ffae03;
  --cornflower-blue:#8aa0ff;

  --accent:      var(--blazing-flame);
  --accent-warm: var(--orange);
  --link:        var(--cornflower-blue);
  --ok:          #3fd07a;

  /* ---- surfaces (dark, the app's native look) ------------------------- */
  --bg-app:     #0e0c17;
  --bg-rail:    #131022;
  --bg-pane:    #191532;
  --bg-chat:    #1d1940;
  --bg-input:   #14112a;
  --bg-hover:   rgba(255, 255, 255, 0.045);
  --bg-active:  color-mix(in srgb, var(--cornflower-blue) 20%, transparent);
  --bg-raised:  #221d43;

  --text:        var(--alabaster-grey);
  --text-muted:  #a29ec2;
  --text-faint:  #726d95;
  --divider:     rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);

  --ring: color-mix(in srgb, var(--cornflower-blue) 65%, transparent);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.25);
  --shadow-md: 0 8px 24px -6px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  --shadow-lg: 0 32px 64px -16px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.4);

  /* ---- metrics --------------------------------------------------------- */
  --rail:    64px;
  --pane:    236px;
  --members: 208px;
  --header-h: 50px;
  --radius-sm:   8px;
  --radius:      11px;
  --radius-lg:   16px;
  --radius-pill: 999px;

  color-scheme: dark;
}

/* Light theme tokens — shared by the explicit choice and the OS default. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --alabaster-grey: #1c1a2b;
    --cornflower-blue:#4257d6;
    --bg-app:     #eceaf3;
    --bg-rail:    #e4e1ee;
    --bg-pane:    #f4f2f9;
    --bg-chat:    #fbfaff;
    --bg-input:   #ffffff;
    --bg-hover:   rgba(46, 41, 78, 0.055);
    --bg-active:  color-mix(in srgb, var(--cornflower-blue) 15%, transparent);
    --bg-raised:  #ffffff;
    --text:        #1c1a2b;
    --text-muted:  #575279;
    --text-faint:  #8b86a6;
    --divider:     rgba(46, 41, 78, 0.11);
    --border-strong: rgba(46, 41, 78, 0.2);
    --ring: color-mix(in srgb, var(--cornflower-blue) 55%, transparent);
    --shadow-sm: 0 1px 2px rgba(30,26,60,.08);
    --shadow-md: 0 10px 28px -8px rgba(30,26,60,.18), 0 2px 6px rgba(30,26,60,.08);
    --shadow-lg: 0 36px 70px -18px rgba(30,26,60,.28), 0 10px 26px rgba(30,26,60,.14);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --alabaster-grey: #1c1a2b;
  --cornflower-blue:#4257d6;
  --bg-app:     #eceaf3;
  --bg-rail:    #e4e1ee;
  --bg-pane:    #f4f2f9;
  --bg-chat:    #fbfaff;
  --bg-input:   #ffffff;
  --bg-hover:   rgba(46, 41, 78, 0.055);
  --bg-active:  color-mix(in srgb, var(--cornflower-blue) 15%, transparent);
  --bg-raised:  #ffffff;
  --text:        #1c1a2b;
  --text-muted:  #575279;
  --text-faint:  #8b86a6;
  --divider:     rgba(46, 41, 78, 0.11);
  --border-strong: rgba(46, 41, 78, 0.2);
  --ring: color-mix(in srgb, var(--cornflower-blue) 55%, transparent);
  --shadow-sm: 0 1px 2px rgba(30,26,60,.08);
  --shadow-md: 0 10px 28px -8px rgba(30,26,60,.18), 0 2px 6px rgba(30,26,60,.08);
  --shadow-lg: 0 36px 70px -18px rgba(30,26,60,.28), 0 10px 26px rgba(30,26,60,.14);
  color-scheme: light;
}
/* an explicit dark choice must beat the light OS default */
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: auto;                 /* shell overflows & scrolls under 800px */
  font: 15px/1.5 var(--font-sans);
  font-feature-settings: "cv05", "cv11", "ss01";
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  background: var(--bg-app);
  color: var(--text);
}
h1, h2, h3 { letter-spacing: -0.02em; text-wrap: balance; }
button, input, textarea { font: inherit; color: inherit; font-feature-settings: inherit; }
code, kbd, pre, .mono { font-family: var(--font-mono); }
::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }

:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}
button, a, [role="button"] { -webkit-tap-highlight-color: transparent; }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--text-faint) 45%, transparent);
  border-radius: var(--radius-pill);
  border: 2px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text-faint) 70%, transparent); background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text-faint) 45%, transparent) transparent; }

/* ============================ shell ====================================== */
#app {
  display: grid;
  grid-template-columns: var(--rail) var(--pane) minmax(320px, 1fr) var(--members);
  grid-template-rows: 100vh;
  min-width: 800px;
  min-height: 500px;
}
#app[data-members="hidden"] {
  grid-template-columns: var(--rail) var(--pane) minmax(320px, 1fr) 0;
}
#app[data-members="hidden"] #members { display: none; }

.col { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

/* ======================== server rail =================================== */
#rail {
  background: var(--bg-rail);
  align-items: center;
  padding: 10px 0;
  gap: 8px;
  overflow-y: auto;
}
.rail-btn .ic { width: 20px; height: 20px; }
.rail-btn {
  position: relative;
  width: 44px; height: 44px;
  flex: 0 0 44px;
  border: 0;
  border-radius: 30%;
  background: var(--bg-raised);
  color: var(--text);
  font-weight: 650;
  font-size: 15px;
  letter-spacing: -0.01em;
  cursor: pointer;
  display: grid;
  place-items: center;
  box-shadow: var(--shadow-sm);
  transition: border-radius .18s cubic-bezier(.2,.9,.3,1), background .16s ease, color .16s ease, box-shadow .16s ease;
}
.rail-btn:hover { border-radius: 38%; background: var(--accent-warm); color: #1b1832; }
.rail-btn.active { border-radius: 38%; background: var(--accent); color: #fff; box-shadow: 0 4px 16px -4px color-mix(in srgb, var(--accent) 60%, transparent); }
.rail-btn.active::before,
.rail-btn:hover::before {
  content: "";
  position: absolute;
  left: -10px; top: 50%;
  width: 4px; height: 22px;
  background: var(--text);
  border-radius: 0 4px 4px 0;
  transform: translateY(-50%);
}
.rail-btn.active::before { height: 30px; }
.rail-sep { width: 32px; height: 2px; background: var(--divider); border-radius: 2px; flex: 0 0 2px; }
.rail-btn.add { color: var(--accent-warm); background: var(--bg-pane); }
.rail-btn.add:hover { color: #1b1832; }

/* ====================== channel / dm pane ============================== */
#pane { background: var(--bg-pane); }
.pane-head {
  height: var(--header-h);
  flex: 0 0 var(--header-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px;
  font-weight: 650;
  letter-spacing: -0.01em;
  border-bottom: 1px solid var(--divider);
}
.pane-head .head-actions { display: flex; gap: 2px; }
.icon-btn {
  border: 0; background: transparent; color: var(--text-muted);
  width: 28px; height: 28px; border-radius: var(--radius-sm); cursor: pointer;
  display: grid; place-items: center; font-size: 16px; line-height: 1;
}
.icon-btn:hover { color: var(--text); background: var(--bg-hover); }
.icon-btn.has-dot { position: relative; }
.icon-btn.has-dot::after { content: ""; position: absolute; top: 3px; right: 3px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--blazing-flame); }
#btn-verify.verified { color: var(--cornflower-blue); }
/* monochrome UI icons */
.ic { width: 18px; height: 18px; display: block; pointer-events: none; }
.icon-btn .ic { width: 17px; height: 17px; }
/* custom emoji render at a fixed emoji-ish size inline in messages */
:root { --emoji-size: 20px; }
img.emoji { width: var(--emoji-size); height: var(--emoji-size); object-fit: contain;
  vertical-align: -0.35em; margin: 0 1px; }
.react-chip img.emoji { width: 16px; height: 16px; vertical-align: -0.2em; }
.emoji-cell img.emoji { width: 22px; height: 22px; vertical-align: middle; }
/* a lone-sticker message renders large and blockish */
img.sticker { display: block; max-width: 180px; max-height: 180px; object-fit: contain;
  margin: 2px 0; border-radius: var(--radius); }
/* opt-in link preview card */
.embed-card { display: flex; gap: 10px; margin: 6px 0 2px; max-width: 460px;
  border: 1px solid var(--divider); border-left: 3px solid var(--accent);
  border-radius: var(--radius); background: var(--bg-raised); padding: 8px 10px;
  text-decoration: none; color: inherit; overflow: hidden; }
.embed-card:hover { background: var(--bg-hover); }
.embed-img { width: 76px; height: 76px; object-fit: cover; border-radius: 4px; flex: 0 0 auto; }
.embed-text { min-width: 0; }
.embed-site { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .03em; }
.embed-title { font-size: 13px; font-weight: 600; color: var(--link, var(--accent));
  margin: 1px 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.embed-desc { font-size: 12px; color: var(--text-muted); display: -webkit-box;
  -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.emoji-cell img.sticker { width: 48px; height: 48px; margin: 0; }
.chan-row .tag { margin-left: auto; font-size: 11px; color: var(--cornflower-blue); }
.chan-row.blocked .name { text-decoration: line-through; opacity: .55; }
#btn-contact.on { color: var(--orange); }
#btn-block.on { color: var(--blazing-flame); }
#btn-call.active, #btn-groupcall.active { color: var(--cornflower-blue); }

#callbar, #gcallbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  background: var(--bg-active); border-bottom: 1px solid var(--divider);
  font-size: 13px; color: var(--text); }
#callbar .dot, #gcallbar .dot { width: 8px; height: 8px; border-radius: 50%;
  background: var(--cornflower-blue); animation: pulse 1.2s ease-in-out infinite; }
#callbar.connected .dot, #gcallbar.joined .dot { background: #3fbf6f; animation: none; }
#callbar .spacer, #gcallbar .spacer { flex: 1; }
#callbar button, #gcallbar button { border: 0; border-radius: 6px; padding: 6px 12px;
  font-weight: 700; font-size: 12px; cursor: pointer; }
#callbar button.accept, #gcallbar button.accept { background: #3fbf6f; color: #08240f; }
#callbar button.hangup, #gcallbar button.hangup { background: var(--blazing-flame); color: #fff; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

#call-toast, #gcall-toast { position: fixed; right: 18px; z-index: 90;
  background: var(--bg-pane); border: 1px solid var(--divider); border-radius: 10px;
  box-shadow: 0 16px 40px rgba(0,0,0,.45); padding: 14px 16px; display: flex;
  gap: 10px; align-items: center; font-size: 13px; color: var(--text); }
#call-toast { bottom: 18px; }
#gcall-toast { bottom: 92px; }
#call-toast button, #gcall-toast button { border: 0; border-radius: 6px; padding: 6px 12px;
  font-weight: 700; font-size: 12px; cursor: pointer; }
#call-toast .accept, #gcall-toast .accept { background: #3fbf6f; color: #08240f; }
#call-toast .decline, #gcall-toast .decline { background: var(--blazing-flame); color: #fff; }

.pane-scroll { flex: 1; overflow-y: auto; padding: 10px 8px; }
.group-label {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 8px 4px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-faint);
}
.group-label button { border: 0; background: transparent; color: var(--text-faint); cursor: pointer; font-size: 15px; }
.group-label button:hover { color: var(--text); }

.chan-row {
  display: flex; align-items: center; gap: 7px;
  width: 100%;
  padding: 8px 9px;
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-muted);
  cursor: pointer; text-align: left;
  font-size: 14px; font-weight: 500;
}
.chan-row:hover { background: var(--bg-hover); color: var(--text); }
.chan-row.active { background: var(--bg-active); color: var(--text); font-weight: 600; }
.chan-row .hash { color: var(--text-faint); font-weight: 600; }
.chan-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chan-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: 0 0 8px; }
.chan-row .badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-pill);
  background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px;
  font-variant-numeric: tabular-nums; text-align: center; flex: 0 0 auto; }
.chan-row .badge.muted { background: var(--text-faint); }
.chan-row.muted .name { opacity: .55; }
.chan-row.muted .hash { opacity: .55; }
.chan-row .avatar { width: 20px; height: 20px; font-size: 10px; }

/* voice channel: participants nested under the sidebar row */
.voice-members { display: flex; flex-direction: column; gap: 2px; margin: 1px 0 4px 22px; }
.voice-member { display: flex; align-items: center; gap: 6px; padding: 2px 6px;
  font-size: 12px; color: var(--text-muted); border-radius: var(--radius-sm); }
.voice-member .avatar { width: 18px; height: 18px; font-size: 9px; }

/* voice channel: the room view that replaces the message log */
.voice-room { display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; min-height: 100%; padding: 40px 20px; text-align: center; }
.voice-room-icon { opacity: .8; color: var(--text-faint); }
.voice-room-icon .ic { width: 40px; height: 40px; }
.chan-row .hash .ic { width: 15px; height: 15px; display: block; }
#chat-title .hash .ic { width: 16px; height: 16px; vertical-align: -3px; }
.voice-room-name { font-size: 20px; font-weight: 700; color: var(--text); }
.voice-room-sub { font-size: 13px; color: var(--text-faint); }
.voice-stage { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin: 14px 0 4px; }
.voice-tile { display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 14px 18px; border-radius: var(--radius-lg); background: var(--bg-raised);
  border: 1px solid var(--divider); min-width: 96px; }
.voice-tile.me { border-color: var(--accent); }
.voice-tile.live { border-color: var(--ok, #3ba55d); box-shadow: 0 0 0 1px var(--ok, #3ba55d) inset; }
.voice-tile .avatar.big { width: 56px; height: 56px; font-size: 18px; transition: box-shadow .1s ease; }
/* speaking aura (Discord-style green ring while talking) */
.voice-tile.speaking .avatar.big { box-shadow: 0 0 0 3px var(--ok, #3ba55d),
  0 0 12px 2px color-mix(in srgb, var(--ok, #3ba55d) 55%, transparent); }
.voice-member .avatar { transition: box-shadow .1s ease; }
.voice-member.speaking .avatar { box-shadow: 0 0 0 2px var(--ok, #3ba55d); }
.voice-tile-name { font-size: 12px; color: var(--text-muted); max-width: 140px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.voice-room-controls { display: flex; gap: 10px; margin-top: 10px; }
.voice-join-btn { padding: 10px 24px; border: 0; border-radius: var(--radius-pill);
  background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
.voice-join-btn:hover { filter: brightness(1.08); }
.voice-join-btn.leave { background: var(--bg-raised); color: var(--text); border: 1px solid var(--divider); }
.voice-mic-btn { padding: 10px 18px; border: 1px solid var(--divider); border-radius: var(--radius-pill);
  background: var(--bg-raised); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
.voice-mic-btn.off { background: var(--danger, #d83c3e); color: #fff; border-color: transparent; }
.voice-screens { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center;
  margin: 16px 0 4px; width: 100%; }
.voice-screen { display: flex; flex-direction: column; gap: 6px; align-items: center;
  background: #000; border-radius: var(--radius-lg); border: 1px solid var(--divider);
  padding: 6px; max-width: 520px; }
.voice-screen video { width: 100%; max-height: 300px; border-radius: var(--radius); background: #000; }
.voice-screen-off { display: none; }
.voice-screen.preview-off video { display: none; }
.voice-screen.preview-off .voice-screen-off {
  display: flex; align-items: center; justify-content: center; text-align: center;
  width: 100%; min-height: 160px; border-radius: var(--radius); background: var(--bg-raised);
  color: var(--text-faint); font-size: 12.5px; padding: 12px;
}
.voice-screen-label { font-size: 12px; color: var(--text-muted); }
.voice-soundboard { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin: 12px 0 2px; max-width: 460px; }
.voice-sound-btn { padding: 7px 12px; border: 1px solid var(--divider); border-radius: var(--radius-pill);
  background: var(--bg-raised); color: var(--text); font-size: 12px; cursor: pointer; }
.voice-sound-btn:hover { filter: brightness(1.1); }
.voice-sound-btn:disabled { opacity: .5; cursor: default; }

/* right-click context menus (replace the browser's) */
.ctx-menu {
  position: fixed; z-index: 9999; min-width: 172px; max-width: 260px;
  padding: 5px; border-radius: var(--radius, 11px);
  background: var(--bg-raised, #221d43); border: 1px solid var(--border-strong, var(--divider));
  box-shadow: var(--shadow-lg, 0 12px 40px rgba(0,0,0,.5));
  font-size: 13px; animation: pop-in .1s ease;
}
.ctx-menu button {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 7px 10px; border: 0; border-radius: var(--radius-sm, 8px);
  background: transparent; color: var(--text); text-align: left; cursor: pointer;
  font: inherit;
}
.ctx-menu button:hover { background: var(--bg-hover); }
.ctx-menu button.danger { color: var(--danger, #d83c3e); }
.ctx-menu button.danger:hover { background: var(--danger, #d83c3e); color: #fff; }
.ctx-menu button:disabled { opacity: .4; cursor: default; }
.ctx-menu .sep { height: 1px; margin: 5px 4px; background: var(--divider); }
.ctx-menu button .ic { width: 15px; height: 15px; flex: 0 0 15px; color: var(--text-faint); }

/* emoji picker */
.emoji-pop {
  position: fixed; z-index: 9999; width: 320px; max-width: calc(100vw - 16px);
  display: flex; flex-direction: column;
  border-radius: var(--radius-lg, 16px);
  background: var(--bg-raised, #221d43); border: 1px solid var(--border-strong, var(--divider));
  box-shadow: var(--shadow-lg, 0 12px 40px rgba(0,0,0,.5)); overflow: hidden;
  animation: pop-in .1s ease;
}
.emoji-tabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--divider); overflow-x: auto; }
.emoji-tab {
  flex: 0 0 auto; border: 0; background: transparent; cursor: pointer;
  width: 30px; height: 30px; border-radius: var(--radius-sm, 8px); font-size: 17px; line-height: 1;
}
.emoji-tab:hover { background: var(--bg-hover); }
.emoji-tab.on { background: var(--bg-active); }
.emoji-grid {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
  padding: 8px; max-height: 260px; overflow-y: auto;
}
.emoji-cell {
  border: 0; background: transparent; cursor: pointer;
  height: 34px; border-radius: var(--radius-sm, 8px); font-size: 20px; line-height: 1;
  display: grid; place-items: center;
}
.emoji-cell:hover { background: var(--bg-hover); }

.composer .ghost-icon { border: 0; cursor: pointer; }

/* profile card */
.avatar.clickable { cursor: pointer; }
.avatar.clickable:hover { box-shadow: inset 0 0 0 2px var(--cornflower-blue); }
#profile-card { position: fixed; inset: 0; z-index: 120; background: rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center; animation: fade-in .14s ease; }
.pc-box { width: min(340px, 92vw); background: var(--bg-pane); border: 1px solid var(--divider);

/* file / image messages */

/* public-server browser */

#log { flex: 1; overflow-y: auto; padding: 12px 8px 8px; }

.msg-line { color: var(--text); white-space: pre-wrap; word-wrap: break-word; text-wrap: pretty; line-height: 1.375; }

#settings-overlay, #server-settings-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.55);
  display: flex; align-items: flex-start; justify-content: center; padding-top: 8vh; overflow-y: auto; }
.settings-box { width: min(520px, 92vw); background: var(--bg-pane); border: 1px solid var(--divider);

.settings-box h3 { margin: 0 0 12px; font-size: 16px; }

#search-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.5);

.search-box { width: min(560px, 92vw); background: var(--bg-pane); border: 1px solid var(--divider);
  border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.5); overflow: hidden; }
.search-box > input { width: 100%; border: 0; border-bottom: 1px solid var(--divider); background: var(--bg-input);
  color: var(--text); font-size: 15px; padding: 14px 16px; outline: none; }
.search-results { max-height: 56vh; overflow-y: auto; }

/* ---- markdown message formatting ---- */

.md-list li { margin: 1px 0; }
/* ---- date separator in the chat ---- */
.date-divider { display: flex; align-items: center; gap: 10px; margin: 16px 6px 8px; }
.date-divider::before, .date-divider::after { content: ""; flex: 1; height: 1px; background: var(--divider); }

/* ---- mute / deafen in the user panel ---- */

#me-deafen.on::after { content: ""; position: absolute; left: 5px; right: 5px; top: 50%; height: 2px;
  background: #e0555c; transform: rotate(-20deg); border-radius: 2px; }
/* ---- category "+" add buttons ---- */
.cat-add { border: 0; background: transparent; color: var(--text-faint); cursor: pointer;
  width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; margin-left: auto; }
.cat-add:hover { color: var(--text); background: var(--bg-hover); }

/* ---- instant CSS tooltips (replace slow native title=) ---- */
[data-tip] { position: relative; }
[data-tip]:hover::after {
  content: attr(data-tip); position: absolute; z-index: 60; pointer-events: none;
  bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: var(--bg-raised); color: var(--text); border: 1px solid var(--border-strong, var(--divider));
  padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap;
  box-shadow: var(--shadow-md, 0 6px 20px -6px rgba(0,0,0,.5)); }
/* rail sits at the far left — show its tooltips to the right instead of above */

  bottom: auto; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); }
#mention-popup { position: fixed; z-index: 95; background: var(--bg-pane); border: 1px solid var(--divider);

#mention-popup .mrow { padding: 6px 12px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
#mention-popup .mrow.sel, #mention-popup .mrow:hover { background: var(--bg-active); color: var(--text); }
.reply-quote { font-size: 12px; color: var(--text-faint); border-left: 2px solid var(--divider);
  padding-left: 6px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#replybar { display: flex; align-items: center; gap: 8px; padding: 6px 16px; font-size: 12px;
  color: var(--text-muted); background: var(--bg-active); border-top: 1px solid var(--divider); }
#replybar .reply-quote { border: 0; padding: 0; margin: 0; flex: 1; }
#replybar button { border: 0; background: none; color: var(--text-faint); cursor: pointer; font-size: 13px; }
#replybar button:hover { color: var(--text); }
.msg-group { position: relative; }
.msg-actions { position: absolute; top: 2px; right: 6px; gap: 2px; }
.msg-actions button { border: 1px solid var(--divider); background: var(--bg-pane); color: var(--text-muted);
  border-radius: 5px; padding: 1px 5px; font-size: 11px; cursor: pointer; }
.msg-actions button:hover { color: var(--text); border-color: var(--cornflower-blue); }

/* icon-with-text: align an inline svg next to label text */
#callbar .ic, #call-toast .ic, .voice-mic-btn .ic, .voice-room-sub .ic, h3 .ic {
  display: inline-block; vertical-align: -3px; margin-right: 5px; width: 15px; height: 15px; }
.sys { color: var(--text-faint); font-style: italic; padding: 4px 0; font-size: 13px; }
.pin-tag { color: var(--orange); font-size: 11px; font-weight: 600; margin-bottom: 1px; }
.fwd-tag { color: var(--text-faint); font-size: 11px; font-style: italic; margin-bottom: 1px; }
#fwd-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.5);
  display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }

#pins-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.5);

.pins-box { width: min(560px, 92vw); background: var(--bg-pane); border: 1px solid var(--divider);
  border-radius: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.5); overflow: hidden; }

.reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

#typing { height: 22px; padding: 0 18px; font-size: 12px; color: var(--text-muted); font-style: italic; }

.composer { padding: 6px 16px 16px; }

}

}

/* ========================== members ================================== */

/* misc */
.hint { padding: 16px; color: var(--text-faint); font-size: 13px; }

/* onboarding */
#onboard { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg-rail); z-index: 50; padding: 24px; overflow: auto; }
#onboard .card { width: 460px; max-width: 100%; background: var(--bg-pane); border: 1px solid var(--divider); border-radius: 12px; padding: 26px; }
#onboard h1 { margin: 0 0 4px; font-size: 22px; }

  monitor: '<rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
};
function svgIcon(name) {
  return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || "") + '</svg>';
}
// A small icon button with an instant CSS tooltip (used for message/voice
// affordances) — replaces the old emoji-glyph buttons.
function actBtn(iconName, tip, cls) {
  const b = el("button", cls || null);
  b.innerHTML = svgIcon(iconName);
  if (tip) b.dataset.tip = tip;
  return b;
}
function setIcon(elm, name) { if (elm) elm.innerHTML = svgIcon(name); }

/* ---------- context menus (our own, not the browser's) ----------------- */
let ctxEl = null;
function ctxOutside(e) { if (ctxEl && !ctxEl.contains(e.target)) ctxClose(); }
function ctxClose() {
  if (ctxEl) { ctxEl.remove(); ctxEl = null; removeEventListener("click", ctxOutside); }
}
// items: { label, run, danger, disabled, iconName } or the string "sep".
function ctxShow(x, y, items) {
  ctxClose();
  const menu = el("div", "ctx-menu");
  for (const it of items) {
    if (it === "sep") { menu.appendChild(el("div", "sep")); continue; }
    const b = el("button", it.danger ? "danger" : null);
    if (it.iconName) { const s = el("span"); s.innerHTML = svgIcon(it.iconName); b.appendChild(s); }
    b.appendChild(Object.assign(el("span"), { textContent: it.label }));
    b.disabled = !!it.disabled;
    b.onclick = () => { ctxClose(); try { it.run(); } catch (e) { ui && ui.sys && ui.sys(String(e)); } };
    menu.appendChild(b);
  }
  document.body.appendChild(menu);
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + "px";
  menu.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + "px";
  ctxEl = menu;
  // Attach the dismiss handler on the NEXT tick so the opening click doesn't
  // immediately close it.
  setTimeout(() => addEventListener("click", ctxOutside), 0);
}
function ctxAnchor(elm, items) {
  const r = elm.getBoundingClientRect();
  ctxShow(r.right - 4, r.bottom + 4, items);
}
addEventListener("keydown", e => { if (e.key === "Escape") ctxClose(); });
addEventListener("resize", ctxClose);
addEventListener("scroll", ctxClose, true);

// One global right-click handler: suppress the native menu everywhere inside
// the app and offer a context-appropriate one instead.
addEventListener("contextmenu", e => {
  const app = e.target.closest && e.target.closest("#app");
  if (!app) return;                                  // onboarding etc. — leave it
  const editable = e.target.closest("input, textarea, [contenteditable]");
  const sel = String(getSelection());
  const chanRow = e.target.closest(".chan-row");
  const msgGroup = e.target.closest(".msg-group");

  if (chanRow && chanRow._ctx) { e.preventDefault(); ctxShow(e.clientX, e.clientY, chanRow._ctx()); return; }
  if (msgGroup && msgGroup._ctx) { e.preventDefault(); ctxShow(e.clientX, e.clientY, msgGroup._ctx()); return; }

  if (editable) {
    e.preventDefault();
    const t = e.target;
    ctxShow(e.clientX, e.clientY, [
      { label: "Cut", iconName: "x", disabled: !sel, run: async () => { await navigator.clipboard.writeText(sel); document.execCommand("delete"); } },
      { label: "Copy", iconName: "copy", disabled: !sel, run: () => navigator.clipboard.writeText(sel) },
      { label: "Paste", iconName: "copy", run: async () => { const txt = await navigator.clipboard.readText(); insertAtCaret(t, txt); } },
      "sep",
      { label: "Select all", run: () => t.select && t.select() },
    ]);
    return;
  }
  e.preventDefault();
  if (sel) ctxShow(e.clientX, e.clientY, [{ label: "Copy", iconName: "copy", run: () => navigator.clipboard.writeText(sel) }]);
});
function insertAtCaret(t, text) {
  const s = t.selectionStart ?? t.value.length, e = t.selectionEnd ?? t.value.length;
  t.value = t.value.slice(0, s) + text + t.value.slice(e);
  t.selectionStart = t.selectionEnd = s + text.length;
  t.dispatchEvent(new Event("input", { bubbles: true }));
}

// Collapse the chat-header icon row: keep a few, fold the rest under ⋯.
function collapseHeader() {
  const head = document.querySelector(".chat-head");
  if (!head) return;
  const keep = new Set(["btn-more", "btn-search", "btn-members", "btn-call"]);
  const items = [];
  for (const b of head.querySelectorAll(".icon-btn")) {
    if (keep.has(b.id) || b.hidden) continue;
    const handler = b.onclick;
    b.hidden = true;
    if (!handler) continue;
    const label = (b.title || "").replace(/\s*[—-].*$/, "").trim();
    items.push({ iconName: b.dataset.icon, label: label || b.id, run: () => handler.call(b) });
  }
  const more = $("#btn-more");
  more.hidden = items.length === 0;
  more.onclick = () => ctxAnchor(more, items);
}

/* messaging yourself is a local-only "Private Note" — no relay round-trip,
   so it never comes back and doubles. */
const isSelf  = fp => !!fp && store.me.fingerprint &&
  (fp === store.me.fingerprint || short(fp) === short(store.me.fingerprint));
const petname = fp => { const c = store.contacts.find(c => c.fp === fp); return c && c.petname ? c.petname : null; };
const isBlocked = fp => store.blocked.includes(fp);
// Self-asserted username from the ledger (keyed by full fp, tolerant of short).
const username = fp => {
  if (!fp) return null;
  if (store.usernames[fp]) return store.usernames[fp];
  const s = short(fp);
  for (const k in store.usernames) if (short(k) === s) return store.usernames[k];
  return null;
};
// Display name for a peer: your petname wins, then their chosen username,
// then the raw block-id prefix.
const dmLabel = fp => isSelf(fp)
  ? "Private Note"
  : (petname(fp) || username(fp) || short(fp));
// Like dmLabel but "you" stays "you" for message authors.
// A channel message's author label prefers a per-server nickname over the
// ledger username (but never over a petname — that's the viewer's own
// choice); DMs have no server context, so nicknames never apply there.
const authorLabel = fp => {
  if (fp === "you") return "you";
  const root = !isDM() && store.rootOf(store.view.server);
  return petname(fp) || (root && nicknameOf(root, fp)) || username(fp) || short(fp);
};
// Voice contexts want your real name, not the "Private Note" DM label.
const voiceName = fp => isSelf(fp)
  ? (store.me.username || short(fp))
  : (petname(fp) || username(fp) || short(fp));

const LS = {
  get(k, d) { try { const v = localStorage.getItem("dante." + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("dante." + k, JSON.stringify(v)); } catch (_) {} },
};

/* ---------- store ------------------------------------------------------- */
const store = {
  me: { fingerprint: "", words: "", username: "" },
  usernames: {},                      // fp -> self-asserted username (ledger)
  channels: [],                       // [{id,name,server}]
  dms: LS.get("dms", []),             // [{fp}]
  messages: [],                       // flat inbox, each tagged with _target
  seen: 0,
  unread: new Map(),                  // target -> count of unseen messages
  mentions: new Set(),               // targets where I was @-mentioned
  invites: [],                       // [{channel,channel_name,server_name}] pending
  notices: [],                       // [{tag,text,scope,at}] standalone notices
  muted: new Set(LS.get("muted", [])), // targets with notifications silenced
  view: LS.get("view", { server: "@dm", target: null }),
  typingText: "",
  policies: {},                       // server root -> policy JSON
  reactions: {},                      // ref_seq -> [{emoji,count,by}]
  pins: {},                           // "#channel" -> { ref_seq: {by, at_ms} }
  dmEdits: {},                        // dm msg_id (hex) -> { text, deleted }
  safety: {},                         // dm fp -> {number,verified,available}
  emojis: {},                         // server root -> { shortcode: hexhash }
  stickers: {},                       // server root -> { name: hexhash }
  sounds: {},                         // server root -> { name: hexhash }
  embedsOn: LS.get("embeds_on", false), // opt-in link previews (leaks IP)
  embeds: {},                         // url -> preview | null (miss) | "pending"
  contacts: [],                       // [{fp,petname,verified,added_ms}]
  blocked: [],                        // [fp]
  calls: [],                          // [{peer,state,incoming}]
  voice: {},                          // channel id -> { joined, participants:[fp] }
  groupCalls: {},                     // channel id -> { channel_name, joined, participants:[fp], invited_by }

  roleName(root, memberFp) {
    const p = this.policies[root];
    if (!p) return null;
    if (memberFp === p.owner) return "Owner";
    const a = (p.assignments || []).find(x => x.member === memberFp);
    if (!a) return null;
    const rs = p.roles.filter(r => a.roles.includes(r.id)).sort((x, y) => y.rank - x.rank);
    return rs[0] ? rs[0].name : null;
  },
  myPerms(root) { return (this.policies[root] || {}).me_perms || PERM_SEND; },
  // Effective permission mask for any member (owner = everything).
  permsOf(root, fp) {
    const p = this.policies[root];
    if (!p) return PERM_SEND;
    if (fp === p.owner) return 0xffffffff;
    const a = (p.assignments || []).find(x => x.member === fp);
    let allow = PERM_SEND, deny = 0;
    for (const r of (p.roles || [])) {
      if (a && a.roles.includes(r.id)) { allow |= (r.allow || 0); deny |= (r.deny || 0); }
    }
    return allow & ~deny;
  },

  servers() {
    const names = [];
    for (const c of this.channels) if (!names.includes(c.server)) names.push(c.server);
    return names;
  },
  channelsOf(server) { return this.channels.filter(c => c.server === server); },
  rootOf(server) { const c = this.channels.find(c => c.server === server); return c ? c.root : null; },
  channelName(id) { const c = this.channels.find(c => c.id === id); return c ? c.name : short(id); },
  msgsFor(target) { return this.messages.filter(m => m._target === target); },
  membersFor(target) {
    // Authoritative: the channel's live MLS roster (minus us). Falls back to
    // message senders for DMs / channels not yet loaded.
    if (target && target.startsWith("#")) {
      const ch = this.channels.find(c => "#" + c.id === target);
      if (ch && ch.members) {
        return ch.members.filter(fp => fp !== this.me.fingerprint && short(fp) !== short(this.me.fingerprint))
          .sort((a, b) => a.localeCompare(b));
      }
    }
    const set = new Set();
    for (const m of this.msgsFor(target)) if (m.from && m.from !== "you") set.add(m.from);
    return [...set].sort((a, b) => a.localeCompare(b));
  },

  unreadFor(t) { return this.unread.get(t) || 0; },
  bumpUnread(t) { this.unread.set(t, this.unreadFor(t) + 1); },
  totalUnread() { let n = 0; for (const [t, c] of this.unread) if (!this.muted.has(t)) n += c; return n; },
  isMuted(t) { return this.muted.has(t); },
  toggleMute(t) {
    if (this.muted.has(t)) this.muted.delete(t); else this.muted.add(t);
    LS.set("muted", [...this.muted]);
  },
};

/* ---------- api ------------------------------------------------------- */
const api = {
  async get(p) { const r = await fetch(p); if (!r.ok) throw new Error(await r.text()); return r.json(); },
  async post(p, body) {
    const r = await fetch(p, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    const t = await r.text();
    if (!r.ok) throw new Error(t || r.statusText);
    try { return JSON.parse(t); } catch (_) { return {}; }
  },
  me()        { return this.get("/api/me"); },
  channels()  { return this.get("/api/channels"); },
  messages(since) { return this.get("/api/messages?since=" + since); },
  typing()    { return this.get("/api/typing"); },
  send(to, text, replyTo) { return this.post("/api/send", replyTo ? { to, text, reply_to: replyTo } : { to, text }); },
  editDm(peer, msgId, text) { return this.post("/api/dm/edit", { peer, msg_id: msgId, text }); },
  forward(to, origin, text) { return this.post("/api/forward", { to, origin, text }); },
  createServer(name)      { return this.post("/api/server", { name }); },
  createChannel(server, name, voice) { return this.post("/api/channel", { server, name, voice: !!voice }); },
  voice()                { return this.get("/api/voice"); },
  voiceJoin(channel)     { return this.post("/api/voice/join", { channel }); },
  voiceLeave(channel)    { return this.post("/api/voice/leave", { channel }); },
  groupCalls()           { return this.get("/api/groupcalls"); },
  groupCallStart(channel) { return this.post("/api/groupcall/start", { channel }); },
  groupCallJoin(channel)  { return this.post("/api/groupcall/join", { channel }); },
  groupCallLeave(channel) { return this.post("/api/groupcall/leave", { channel }); },
  invite(channel, peer)   { return this.post("/api/invite", { channel, peer }); },
  setNickname(server, member, nickname) { return this.post("/api/nickname", { server, member, nickname }); },
  requestNickname(server, nickname) { return this.post("/api/nickname/request", { server, nickname }); },
  inviteRespond(channel, accept) { return this.post("/api/invite/" + (accept ? "accept" : "decline"), { channel }); },
  policy(root)            { return this.get("/api/policy?server=" + encodeURIComponent(root)); },
  sendTyping(to)          { return fetch("/api/typing", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ to }) }).catch(() => {}); },
};

/* ---------- in-app modal dialogs -------------------------------------- */
/* Renders `msg` with pre-wrap; a fragment wrapped in <code>…</code> is kept
   as an element (so long fingerprints/links wrap nicely). */
function modalMsg(msg) {
  const box = el("div", "msg");
  const parts = String(msg).split(/(<code>[\s\S]*?<\/code>)/);
  for (const p of parts) {
    const m = p.match(/^<code>([\s\S]*)<\/code>$/);
    if (m) box.appendChild(Object.assign(el("code"), { textContent: m[1] }));
    else if (p) box.appendChild(document.createTextNode(p));
  }
  return box;
}

let modalDepth = 0;
function openModal({ title, msg, fields, buttons }) {
  return new Promise(resolve => {
    const layer = el("div"); layer.id = "modal-layer";
    const card = el("div", "modal");
    if (title) card.appendChild(Object.assign(el("h2"), { textContent: title }));
    if (msg != null) card.appendChild(modalMsg(msg));

    const inputs = {};
    for (const f of (fields || [])) {
      if (f.type === "check") {
        const wrap = el("label"); wrap.style.cssText = "display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px;color:var(--text);text-transform:none;letter-spacing:0";
        const cb = el("input"); cb.type = "checkbox"; cb.checked = !!f.value;
        cb.style.cssText = "width:auto;margin:0";
        wrap.appendChild(cb);
        wrap.appendChild(document.createTextNode(f.label));
        card.appendChild(wrap);
        inputs[f.name] = cb;
        continue;
      }
      if (f.label) card.appendChild(Object.assign(el("label"), { textContent: f.label, style: "display:block;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px" }));
      const inp = el(f.multiline ? "textarea" : "input");
      if (!f.multiline) inp.type = f.password ? "password" : "text";
      if (f.placeholder) inp.placeholder = f.placeholder;
      if (f.value != null) inp.value = f.value;
      card.appendChild(inp);
      inputs[f.name] = inp;
    }

    const row = el("div", "row");
    const done = val => {
      layer.classList.add("closing");
      setTimeout(() => layer.remove(), 120);
      modalDepth--;
      document.removeEventListener("keydown", onKey);
      resolve(val);
    };
    const cancelVal = () => buttons.find(b => b.cancel)?.value ?? null;
    let primaryBtn = null;
    for (const b of buttons) {
      const btn = Object.assign(el("button", b.class || ""), { textContent: b.label });
      btn.onclick = () => done(typeof b.value === "function" ? b.value(inputs) : b.value);
      if (b.primary) primaryBtn = btn;
      row.appendChild(btn);
    }
    card.appendChild(row);
    layer.appendChild(card);
    layer.onclick = e => { if (e.target === layer) done(cancelVal()); };
    const onKey = e => {
      if (e.key === "Escape") { e.preventDefault(); done(cancelVal()); }
      else if (e.key === "Enter" && !e.shiftKey && primaryBtn && document.activeElement.tagName !== "TEXTAREA") {
        e.preventDefault();
        primaryBtn.click();
      }
    };
    document.addEventListener("keydown", onKey);
    document.body.appendChild(layer);
    modalDepth++;
    const first = card.querySelector("input, textarea, button");
    if (first) first.focus();
  });
}

const ui = {
  /* Prompt for one line of text. Returns the trimmed value, or null if cancelled. */
  async ask(msg, def, opts = {}) {
    const v = await openModal({
      title: opts.title || "",
      msg,
      fields: [{ name: "v", value: def || "", password: !!opts.password, multiline: !!opts.multiline, placeholder: opts.placeholder || "" }],
      buttons: [
        { label: "Cancel", class: "ghost", value: null, cancel: true },
        { label: opts.ok || "OK", primary: true, value: i => i.v.value },
      ],
    });
    return v == null ? null : v.trim();
  },
  /* Show a message with an OK button. */
  say(msg, opts = {}) {
    return openModal({
      title: opts.title || "",
      msg,
      buttons: [{ label: opts.ok || "OK", primary: true, value: true, cancel: true, class: opts.danger ? "danger" : "" }],
    });
  },
  /* Ask a yes/no question. Resolves true / false. */
  async confirm(msg, opts = {}) {
    return !!(await openModal({
      title: opts.title || "",
      msg,
      buttons: [
        { label: opts.cancelLabel || "Cancel", class: "ghost", value: false, cancel: true },
        { label: opts.ok || "OK", primary: true, value: true, class: opts.danger ? "danger" : "" },
      ],
    }));
  },
  /* Collect several fields at once. `fields`: [{name,label,value,password,multiline,placeholder}].
     Resolves an object of trimmed values, or null if cancelled. */
  async form(title, fields, opts = {}) {
    const r = await openModal({
      title, msg: opts.msg,
      fields,
      buttons: [
        { label: "Cancel", class: "ghost", value: null, cancel: true },
        { label: opts.ok || "Save", primary: true, value: i => {
          const out = {};
          for (const f of fields) out[f.name] = f.type === "check" ? i[f.name].checked : i[f.name].value.trim();
          return out;
        } },
      ],
    });
    return r;
  },
  sys(text) {
    const log = $("#log");
    if (log.querySelector(".empty")) log.innerHTML = "";
    log.appendChild(el("div", "sys", text));
    log.scrollTop = log.scrollHeight;
  },
};

const isDM      = () => store.view.server === "@dm";

function selectTarget(server, target) {

  $("#attach").disabled = !target || target.startsWith("#") || isSelf(target);
  if (target) box.focus();
}

async function discoverFlow() {
  if ($("#discover-overlay")) return;
  const ov = el("div"); ov.id = "discover-overlay";
  const box = el("div", "disc-box");
  box.appendChild(el("h3", null, "Public servers"));
  const grid = el("div", "disc-grid");
  box.appendChild(grid);
  ov.appendChild(box);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.addEventListener("keydown", function esc(e) {
    if (e.key === "Escape" && $("#discover-overlay")) { ov.remove(); document.removeEventListener("keydown", esc); }
  });
  document.body.appendChild(ov);

  let list;
  try { list = await api.get("/api/discover"); }
  catch (e) { grid.appendChild(el("div", "disc-empty", "Could not load: " + e.message)); return; }
  if (!list.length) { grid.appendChild(el("div", "disc-empty", "No public servers listed right now.")); return; }

  for (const s of list) {
    const card = el("div", "disc-card");
    const banner = el("div", "disc-banner");
    banner.appendChild(Object.assign(el("div", "disc-avatar"), { textContent: initials(s.name) }));
    const body = el("div", "disc-body");
    body.appendChild(el("div", "disc-name", s.name));
    body.appendChild(el("div", "disc-desc", s.summary || "No description."));
    const tags = el("div", "disc-tags");
    for (const t of (s.tags || [])) tags.appendChild(el("span", "disc-tag", t));
    body.appendChild(tags);
    const join = el("button", "disc-join", "Join");
    join.onclick = async () => {
      const password = await ui.ask(`Join "${s.name}" — server password (leave blank if none):`, "");
      if (password === null) return;
      join.disabled = true; join.textContent = "Joining…";
      try { await api.post("/api/discover/join", { server: s.root, password }); }
      catch (e) { ui.say("Join failed: " + e.message); join.disabled = false; join.textContent = "Join"; return; }
      // The host validates the password and adds us out of band — wait for a
      // channel to appear, then say if it didn't.
      ov.remove();
      const before = store.channels.length;
      let joined = false;
      for (let i = 0; i < 12 && !joined; i++) {
        await new Promise(r => setTimeout(r, 1500));
        await refreshChannels();
        joined = store.channels.some(c => c.root === s.root);
      }
      if (joined) ui.sys(`Joined "${s.name}".`);
      else ui.say(`No response from "${s.name}". The password may be wrong, or the host is offline — try again later.`);
      void before;
    };
    body.appendChild(join);
    card.append(banner, body);
    grid.appendChild(card);
  }
}

async function publishFlow(server) {
  const root = store.rootOf(server);
  if (!root) return ui.say("Unknown server root.");
  if (!await ui.confirm('List "' + server + '" on the public discovery directory? Anyone will be able to join (subject to a join password if set).', { ok: "List it" })) {
    if (await ui.confirm("Remove it from discovery instead?", { ok: "Unlist" })) {
      try { await api.post("/api/discover", { server: root, on: false }); ui.sys("Unlisted."); }
      catch (e) { ui.say("Failed: " + e.message); }
    }
    return;
  }
  const f = await ui.form("Public listing", [
    { name: "summary", label: "Short description (optional)" },
    { name: "tags", label: "Tags, comma-separated (optional)" },
  ], { ok: "Publish" });
  if (!f) return;
  const tags = (f.tags || "").split(",").map(t => t.trim()).filter(Boolean);
  try {
    await api.post("/api/discover", { server: root, on: true, summary: f.summary || "", tags });
    ui.sys("Server is now public.");
  } catch (e) { ui.say("Could not publish (host only): " + e.message); }
}

// Calendar-day key + a friendly label (Today / Yesterday / full date) for the
// chat's date separators.
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
function dayLabel(ts) {
  const now = Date.now();
  if (dayKey(ts) === dayKey(now)) return "Today";
  if (dayKey(ts) === dayKey(now - 86400000)) return "Yesterday";
  return new Date(ts).toLocaleDateString([], { year: "numeric", month: "long", day: "numeric" });
}

let msgPaintTs = 0;
function renderChat() {
  const target = curTarget();

    groupCallBtn.onclick = () => {

      groupCallAction(target.slice(1), gc ? "join" : "start");
    };

    const chName = store.channelName(target.slice(1));

    if (iOwn && !isGeneral) {

        try { await api.post("/api/leave", { channel: target }); await refreshChannels(); selectTarget("@dm", null); }
        catch (e) { ui.sys("leave failed: " + e.message); }

  } else if (isSelf(target)) {

    callBtn.onclick = () => { if (!ac) callAction(target, "start"); };

    const blk = isBlocked(target);
    blockBtn.hidden = false;
    blockBtn.classList.toggle("on", blk);
    blockBtn.title = blk ? "Unblock" : "Block";
    blockBtn.onclick = async () => {
      try { await api.post(blk ? "/api/unblock" : "/api/block", { peer: target }); await refreshBlocked(); }

    if (blk) {
      $("#chat-topic").textContent = "blocked — their messages are hidden";

      $("#typing").textContent = "";
      $("#text").disabled = true; $("#send").disabled = true;
      return;
    }

    const s = store.safety[target];
    if (s === undefined) { loadSafety(target); }
    else if (s && s.available) {
      verifyBtn.hidden = false;
      setIcon(verifyBtn, "shield");
      verifyBtn.classList.toggle("verified", !!s.verified);
      verifyBtn.title = s.verified ? "Verified — safety number confirmed" : "Unverified — compare the safety number";
      verifyBtn.onclick = () => verifyFlow(target);
    }
  }

  const msgs = store.msgsFor(target);
  // Preserve the reader's scroll: the log is rebuilt on every poll/render, and
  // it used to snap to the bottom each time — yanking you down while you were
  // reading history. Only auto-scroll if you were already near the bottom, or
  // you just switched into this conversation.
  const switched = log.dataset.target !== target;
  const nearBottom = switched || (log.scrollHeight - log.scrollTop - log.clientHeight < 80);
  const keepScroll = log.scrollTop;
  log.dataset.target = target;
  log.innerHTML = "";
  if (!msgs.length) {
    log.appendChild(el("div", "empty", "No messages yet — say hello."));
    renderCallbar();
    return;
  }

  let lastAuthor = null;
  let lastDay = null;
  const freshCut = msgPaintTs;   // groups newer than the last paint slide in
  for (const m of msgs) {
    // Discord-style day separator when the calendar day changes.
    if (m._at) {
      const dk = dayKey(m._at);
      if (dk !== lastDay) {
        const div = el("div", "date-divider");
        div.appendChild(el("span", null, dayLabel(m._at)));
        log.appendChild(div);
        lastDay = dk;
        lastAuthor = null;   // re-show the author line after a divider
      }
    }
    if (m.kind === "file") {
      const g = groupShell(m, m.from === lastAuthor);
      if (m._at && m._at > freshCut - 80) g.node.classList.add("msg-fresh");
      g.body.appendChild(renderFile(m));
      log.appendChild(g.node); lastAuthor = m.from;
      continue;
    }
    const g = groupShell(m, m.from === lastAuthor);
    if (m._at && m._at > freshCut - 80) g.node.classList.add("msg-fresh");
    if (m.reply_to && !m._deleted) {
      const tgt = store.messages.find(x => x.kind === "channel" && x._target === target && x.ref_seq === m.reply_to);
      const q = el("div", "reply-quote");
      if (tgt) {
        const who = tgt.from === "you" ? "you" : short(tgt.from);
        q.textContent = "↩ " + who + ": " + (tgt._deleted ? "(deleted)" : (tgt.text || "").slice(0, 100));
      } else {
        q.textContent = "↩ replying to an earlier message";
      }
      g.body.appendChild(q);
    }
    const pinned = target.startsWith("#") && store.pins[target] && store.pins[target][m.ref_seq];
    if (pinned && !m._deleted) {
      g.body.appendChild(Object.assign(el("div", "pin-tag"), { textContent: "📌 pinned" }));
    }
    const dmEd = (!target.startsWith("#") && m.msg_id) ? store.dmEdits[m.msg_id] : null;
    const deleted = m._deleted || (dmEd && dmEd.deleted);
    let bodyText = dmEd ? dmEd.text : m.text;
    let fwdOrigin = null;
    if (!deleted) {
      if (target.startsWith("#") && m.forwarded_from) {
        fwdOrigin = m.forwarded_from;
      } else if (!target.startsWith("#") && bodyText.startsWith(FWD_PREFIX)) {
        const nl = bodyText.indexOf("\n");
        fwdOrigin = bodyText.slice(FWD_PREFIX.length, nl < 0 ? undefined : nl);
        bodyText = nl < 0 ? "" : bodyText.slice(nl + 1);
      }
    }
    if (fwdOrigin) g.body.appendChild(Object.assign(el("div", "fwd-tag"),
      { textContent: "↪ Forwarded from " + fwdOrigin }));
    const line = el("div", "msg-line");
    if (deleted) {
      line.className = "msg-line deleted";
      line.textContent = "(message deleted)";
    } else if (target.startsWith("#")) {
      line.innerHTML = richText(bodyText);
      if (m._edited) line.appendChild(Object.assign(el("span", "edited-tag"), { textContent: " (edited)" }));
    } else {
      // DMs get the same markdown / emoji / mention rendering as channels
      // (richText is XSS-safe: it escapes before introducing any markup).
      line.innerHTML = richText(bodyText);
      if (dmEd) line.appendChild(Object.assign(el("span", "edited-tag"), { textContent: " (edited)" }));
    }
    g.body.appendChild(line);
    if (!deleted && store.embedsOn) maybeEmbed(g.body, bodyText);
    if (target.startsWith("#") && m.ref_seq && !m._deleted) {
      addMsgActions(g.body, target, m);
      renderReactions(g.body, target, m.ref_seq);
    }
    if (!target.startsWith("#") && !deleted && !isSelf(target)) {
      addDmActions(g.body, target, m, bodyText);
    }
    if (m.ref_seq) g.node._refSeq = m.ref_seq;
    if (!deleted) {
      const bt = bodyText;
      g.node._ctx = () => msgCtxItems(m, target, bt);
    }
    log.appendChild(g.node);
    lastAuthor = m.from;
  }
  // Stick to the bottom only when appropriate; otherwise hold the reader's spot.
  log.scrollTop = nearBottom ? log.scrollHeight : keepScroll;
  msgPaintTs = Date.now();
  renderCallbar();
  renderReplyBar();
}

// Opt-in link preview. Pulls the first http(s) URL out of `text`; asks
// `dante serve` (once, cached per URL) to unfurl it; appends a card.
const URL_RE = /https?:\/\/[^\s<>"')\]]+/;
function maybeEmbed(container, text) {
  const m = String(text || "").match(URL_RE);
  if (!m) return;
  const url = m[0].replace(/[.,;:!?)\]}'"]+$/, "");
  const hit = store.embeds[url];
  if (hit === "pending") return;
  if (hit === null || hit === undefined) {
    if (hit === undefined) {
      store.embeds[url] = "pending";
      api.post("/api/unfurl", { url })
        .then(res => {
          store.embeds[url] = (res && !res.error && (res.title || res.description || res.image))
            ? res : null;
          renderChat();
        })
        .catch(() => { store.embeds[url] = null; });
    }
    return;
  }
  const card = embedCard(hit);
  if (card) container.appendChild(card);
}
function embedCard(p) {
  if (!p || !/^https?:\/\//i.test(p.url || "")) return null;
  const card = el("a", "embed-card");
  card.href = p.url; card.target = "_blank"; card.rel = "noopener noreferrer";
  if (p.image && /^data:image\//.test(p.image)) {
    const im = el("img", "embed-img");
    im.src = p.image; im.alt = "";
    card.appendChild(im);
  }
  const t = el("div", "embed-text");
  if (p.site) t.appendChild(el("div", "embed-site", p.site));
  if (p.title) t.appendChild(el("div", "embed-title", p.title));
  if (p.description) t.appendChild(el("div", "embed-desc", p.description));

// A voice channel: no message log, just the room and a Join / Leave control.
function renderVoiceRoom(c, target) {
  const titleEl = $("#chat-title");
  const log = $("#log");
  titleEl.innerHTML = '<span class="hash">' + svgIcon("volume") + '</span> ' + esc(c.name);
  $("#chat-topic").textContent = store.view.server;
  document.querySelector(".composer").hidden = true;
  $("#replybar").hidden = true;
  $("#callbar").hidden = true;

  const room = store.voice[c.id] || { joined: false, participants: [] };
  const connected = voiceRtc.channelId === c.id;
  const people = room.participants.slice().sort();

  log.innerHTML = "";
  const wrap = el("div", "voice-room");
  wrap.appendChild(Object.assign(el("div", "voice-room-icon"), { innerHTML: svgIcon("volume") }));
  wrap.appendChild(el("div", "voice-room-name", c.name));
  wrap.appendChild(el("div", "voice-room-sub",
    people.length ? (people.length === 1 ? "1 person connected" : people.length + " people connected")
                  : "No one's here yet — jump in."));
  if (connected) {
    const sec = el("div", "voice-room-sub");
    sec.innerHTML = svgIcon("lock") + " " + (sframeActive()
      ? "SFrame — audio also encrypted under the channel key"
      : "transport-encrypted (DTLS-SRTP)");
    wrap.appendChild(sec);
  }

  if (people.length) {
    const stage = el("div", "voice-stage");
    for (const fp of people) {
      const mine = isSelf(fp);
      const link = !mine && voiceRtc.peers.get(fp);
      const live = mine ? connected : !!(link && link.pc.connectionState === "connected");
      const tile = el("div", "voice-tile" + (mine ? " me" : "") + (live ? " live" : ""));
      tile.dataset.fp = fp;                    // for the speaking-indicator monitor
      if (speakingSet.has(fp)) tile.classList.add("speaking");
      tile.appendChild(avatar(voiceName(fp), fp, "avatar big"));
      const nm = el("span", "voice-tile-name", mine ? "You" : voiceName(fp));
      if (mine && connected && !micEnabled()) nm.textContent += " · muted";
      tile.appendChild(nm);
      stage.appendChild(tile);
    }
    wrap.appendChild(stage);
  }

  if (connected) {
    const shares = [];
    if (voiceRtc.screenStream) shares.push(["me", "You — sharing", voiceRtc.screenStream]);
    for (const fp of people) {
      const link = voiceRtc.peers.get(fp);
      if (link && link.remoteScreen)
        shares.push([fp, (dmLabel(fp) || short(fp)) + " — sharing", link.remoteScreen]);
    }
    if (shares.length) wrap.appendChild(renderScreenShareGrid(shares));
    else releaseScreenTiles();
  } else {
    releaseScreenTiles();
  }

  if (connected) {
    const sroot = store.rootOf(store.view.server);
    const clips = Object.entries((sroot && store.sounds[sroot]) || {});
    if (clips.length) {
      const board = el("div", "voice-soundboard");
      for (const [nm, hash] of clips) {
        const b = el("button", "voice-sound-btn", nm);
        b.title = "Play :" + nm + ": for the room";
        b.onclick = () => triggerRoomSound(hash);
        board.appendChild(b);
      }
      wrap.appendChild(board);
    }
  }

  const row = el("div", "voice-room-controls");
  const btn = el("button", "voice-join-btn" + (connected ? " leave" : ""),
    connected ? "Disconnect" : "Join voice");
  btn.onclick = () => voiceAction(c.id, !connected);
  row.appendChild(btn);
  if (connected) {
    const mic = el("button", "voice-mic-btn" + (voiceRtc.micOn ? "" : " off"));
    mic.innerHTML = svgIcon(voiceRtc.micOn ? "mic" : "mic-off") + (voiceRtc.micOn ? " Mute" : " Unmute");
    mic.onclick = voiceToggleMic;
    row.appendChild(mic);
    const scr = el("button", "voice-mic-btn" + (voiceRtc.screenStream ? " off" : ""));
    scr.innerHTML = svgIcon("monitor") + (voiceRtc.screenStream ? " Stop sharing" : " Share screen");
    scr.onclick = voiceToggleScreen;
    row.appendChild(scr);
  }
  wrap.appendChild(row);

  log.appendChild(wrap);
}

/* Screen-share preview tiles are kept in a DOM cache keyed by "me" or a
   peer's fingerprint, instead of being torn down and rebuilt on every
   render() — renderChat() clears and rebuilds `#log` on every poll tick,
   voice presence update and SFrame epoch bump, and re-creating the <video>
   element each time (fresh srcObject, fresh .play()) is what made shares
   look choppy independent of the encoder settings above: the picture was
   restarting several times a second. Reusing the same element keeps
   playback continuous across those rebuilds. */
const screenTileEls = new Map(); // key -> { cell, video, labelEl, offEl, stream }

// Mirrors Discord: while the window isn't focused (or the tab isn't visible),
// pause preview playback and show a placeholder instead of decoding video no
// one is looking at.
function previewsSuspended() {
  return document.visibilityState === "hidden" || !document.hasFocus();
}

function applyPreviewFocusState(t) {
  const off = previewsSuspended();
  t.cell.classList.toggle("preview-off", off);
  if (off) {
    if (!t.video.paused) t.video.pause();
  } else if (t.stream && t.video.paused) {
    t.video.play().catch(() => {});
  }
}

function refreshScreenPreviewFocus() {
  for (const t of screenTileEls.values()) applyPreviewFocusState(t);
}
window.addEventListener("focus", refreshScreenPreviewFocus);
window.addEventListener("blur", refreshScreenPreviewFocus);
document.addEventListener("visibilitychange", refreshScreenPreviewFocus);

function renderScreenShareGrid(shares) {
  const grid = el("div", "voice-screens");
  const liveKeys = new Set();
  for (const [key, label, stream] of shares) {
    liveKeys.add(key);
    let t = screenTileEls.get(key);
    if (!t) {
      const cell = el("div", "voice-screen");
      const v = el("video");
      v.autoplay = true; v.playsInline = true; v.muted = true;
      const labelEl = el("div", "voice-screen-label");
      const offEl = el("div", "voice-screen-off", "Preview paused — window not focused");
      cell.append(v, offEl, labelEl);
      t = { cell, video: v, labelEl, offEl, stream: null };
      screenTileEls.set(key, t);
    }
    if (t.stream !== stream) {
      t.stream = stream;
      t.video.srcObject = stream;
      if (!previewsSuspended()) t.video.play().catch(() => {});
    }
    t.labelEl.textContent = label;
    applyPreviewFocusState(t);
    grid.appendChild(t.cell);
  }
  for (const key of [...screenTileEls.keys()]) {
    if (!liveKeys.has(key)) {
      const t = screenTileEls.get(key);
      try { t.video.pause(); t.video.srcObject = null; } catch (_) {}
      screenTileEls.delete(key);
    }
  }
  return grid;
}

// Called when the room has no active shares, or we've left/disconnected —
// there is nothing left worth caching a paused <video> element for.
function releaseScreenTiles() {
  if (!screenTileEls.size) return;
  for (const t of screenTileEls.values()) {
    try { t.video.pause(); t.video.srcObject = null; } catch (_) {}
  }
  screenTileEls.clear();
}

const FWD_PREFIX = "↪ Forwarded from ";

// Reply / forward / edit / delete affordances on channel messages.
function addMsgActions(body, channelTarget, m) {
  if (!m.ref_seq) return;
  const bar = el("div", "msg-actions");
  const reply = actBtn("reply", "Reply");
  reply.onclick = () => {
    store._replyTo = { target: channelTarget, seq: m.ref_seq, from: m.from, text: m.text };
    renderReplyBar();
    $("#text").focus();
  };
  bar.appendChild(reply);
  const fwd = actBtn("forward", "Forward");
  fwd.onclick = () => openForwardPicker(m, channelTarget);
  bar.appendChild(fwd);
  const isPinned = store.pins[channelTarget] && store.pins[channelTarget][m.ref_seq];
  const pin = actBtn("pin", isPinned ? "Unpin" : "Pin", isPinned ? "on" : null);
  pin.onclick = async () => {
    try { await api.post("/api/pin", { channel: channelTarget, seq: m.ref_seq, pinned: !isPinned }); }
    catch (e) { ui.say("Pin failed: " + e.message); }
  };
  bar.appendChild(pin);
  if (m.from === "you") {
    const edit = actBtn("edit", "Edit");
    edit.onclick = async () => {
      const t = await ui.ask("Edit message", m.text);
      if (t == null || t === m.text) return;
      try { await api.post("/api/edit", { channel: channelTarget, seq: m.ref_seq, text: t }); }
      catch (e) { ui.say("Edit failed: " + e.message); }
    };
    const del = actBtn("trash", "Delete");
    del.onclick = async () => {
      if (!await ui.confirm("Delete this message for everyone?")) return;
      try { await api.post("/api/edit", { channel: channelTarget, seq: m.ref_seq, text: "" }); }
      catch (e) { ui.say("Delete failed: " + e.message); }
    };
    bar.append(edit, del);
  }
  body.appendChild(bar);
}

// Right-click menu for a message group (channel or DM).
function msgCtxItems(m, target, bodyText) {
  const isChan = target.startsWith("#");
  const mine = m.from === "you";
  const items = [];
  if (isChan && m.ref_seq) {
    items.push({ label: "Reply", iconName: "reply", run: () => {
      store._replyTo = { target, seq: m.ref_seq, from: m.from, text: m.text };
      renderReplyBar(); $("#text").focus();
    }});
  }
  items.push({ label: "Copy text", iconName: "copy", run: () => navigator.clipboard.writeText(bodyText || m.text || "") });
  items.push({ label: "Forward…", iconName: "forward", run: () => openForwardPicker(isChan ? m : { ...m, text: bodyText }, target) });
  if (isChan && m.ref_seq) {
    const isPinned = store.pins[target] && store.pins[target][m.ref_seq];
    items.push({ label: isPinned ? "Unpin" : "Pin", iconName: "pin", run: async () => {
      try { await api.post("/api/pin", { channel: target, seq: m.ref_seq, pinned: !isPinned }); }
      catch (e) { ui.say("Pin failed: " + e.message); }
    }});
  }
  if (mine && ((isChan && m.ref_seq) || (!isChan && m.msg_id))) {
    items.push("sep");
    items.push({ label: "Edit…", iconName: "edit", run: async () => {
      const cur = isChan ? m.text : ((store.dmEdits[m.msg_id] && store.dmEdits[m.msg_id].text) || m.text);
      const t = await ui.ask("Edit message", cur);
      if (t == null || t === cur) return;
      try {
        if (isChan) await api.post("/api/edit", { channel: target, seq: m.ref_seq, text: t });
        else { await api.editDm(target, m.msg_id, t); store.dmEdits[m.msg_id] = { text: t, deleted: false }; renderChat(); }
      } catch (e) { ui.say("Edit failed: " + e.message); }
    }});
    items.push({ label: "Delete", iconName: "trash", danger: true, run: async () => {
      if (!await ui.confirm("Delete this message for everyone?")) return;
      try {
        if (isChan) await api.post("/api/edit", { channel: target, seq: m.ref_seq, text: "" });
        else { await api.editDm(target, m.msg_id, ""); store.dmEdits[m.msg_id] = { text: "", deleted: true }; renderChat(); }
      } catch (e) { ui.say("Delete failed: " + e.message); }
    }});

}

// Pick a destination conversation and forward `m` there.
function openForwardPicker(m, srcTarget) {
  if ($("#fwd-overlay")) return;
  const text = (m.text || "").replace(new RegExp("^" + FWD_PREFIX.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ".*\\n?"), "");
  if (!text) return;
  const origin = m.from === "you" ? "you" : (dmLabel(m.from) || short(m.from) || "someone");

  const ov = el("div"); ov.id = "fwd-overlay";
  const box = el("div", "pins-box");
  box.appendChild(el("h3", null, "↪ Forward to…"));
  box.appendChild(Object.assign(el("div", "pins-empty"), {
    textContent: (text.length > 80 ? text.slice(0, 80) + "…" : text), style: "text-align:left;color:var(--text)"
  }));
  const list = el("div", "pins-list");
  box.appendChild(list);
  ov.appendChild(box);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  document.addEventListener("keydown", function esc(e) {
    if (e.key === "Escape" && $("#fwd-overlay")) { ov.remove(); document.removeEventListener("keydown", esc); }
  });
  document.body.appendChild(ov);

  const dests = [];
  for (const s of store.servers())
    for (const c of store.channelsOf(s)) dests.push({ to: "#" + c.id, label: "#" + c.name + "  ·  " + s });
  for (const c of store.contacts) if (!isSelf(c.fp)) dests.push({ to: c.fp, label: dmLabel(c.fp) });
  for (const d of store.dms) if (!isSelf(d.fp) && !dests.some(x => x.to === d.fp)) dests.push({ to: d.fp, label: dmLabel(d.fp) });

  for (const d of dests) {
    if (d.to === srcTarget) continue;
    const row = el("div", "pin-row");
    row.textContent = d.label;
    row.onclick = async () => {
      ov.remove();
      try {
        const res = await api.forward(d.to, origin, text);
        if (!d.to.startsWith("#")) {
          const mid = res && typeof res.ok === "string" && /^[0-9a-f]{32}$/.test(res.ok) ? res.ok : undefined;
          store.messages.push({ kind: "message", from: "you", text: FWD_PREFIX + origin + "\n" + text, _target: d.to, _at: Date.now(), seq: -1, msg_id: mid });
        }
        ui.sys("Forwarded to " + d.label);
        render();
      } catch (e) { ui.say("Forward failed: " + e.message); }
    };
    list.appendChild(row);
  }
  if (!list.children.length) list.appendChild(el("div", "pins-empty", "No other conversation to forward to."));
}

async function emojiFlow(root) {
  if (!root) { ui.say("Open one of your own server's channels to manage its emoji."); return; }
  const listed = Object.keys(store.emojis[root] || {});
  const name = await ui.ask(
    "Custom emoji shortcode — letters, digits, underscore.\n" +
    "Prefix with '-' to remove one instead.\n\n" +
    (listed.length ? "current: " + listed.map(n => ":" + n + ":").join("  ") : "none yet"),
    "");
  if (!name) return;
  if (name.startsWith("-")) {
    api.post("/api/emoji/remove", { server: root, name: name.slice(1).trim() })
      .then(refreshPolicies)
      .catch(e => ui.sys("remove failed: " + e.message));
    return;
  }
  const inp = $("#emoji-file");
  inp.onchange = async () => {
    const f = inp.files[0];
    inp.value = "";
    if (!f) return;
    if (!/\.(png|jpe?g)$/i.test(f.name) && !/^image\/(png|jpeg)$/.test(f.type)) {
      ui.say("custom emoji must be a PNG or JPEG"); return;
    }
    if (f.size > 1024 * 1024) { ui.say("image must be 1 MB or smaller"); return; }
    const bytes = new Uint8Array(await f.arrayBuffer());
    let hex = "";
    for (const b of bytes) hex += b.toString(16).padStart(2, "0");
    try {
      await api.post("/api/emoji", { server: root, name, image_hex: hex });
      await refreshPolicies();
      ui.sys("added :" + name + ":");
    } catch (e) { ui.sys("upload failed: " + e.message); }
  };
  inp.click();
}
