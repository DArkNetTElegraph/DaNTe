[package]
name = "dante-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DaNTe orchestration engine: wires identity, ledger, networking and DMs into one async API for clients."

[dependencies]
dante-crypto.workspace = true
dante-identity.workspace = true
dante-ledger.workspace = true
dante-proto.workspace = true
dante-net.workspace = true
dante-dm.workspace = true
dante-mls.workspace = true
dante-voice.workspace = true
dante-p2p = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[features]
default = ["p2p"]
# libp2p transport + DHT. On by default (this is a P2P-first project); build
# with `--no-default-features` for a relay-only client with no libp2p tree.
p2p = ["dep:dante-p2p", "dante-net/p2p"]

[dev-dependencies]
dante-relay = { path = "../dante-relay", version = "0.0.1" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
