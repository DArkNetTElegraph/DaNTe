[package]
name = "dante-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cryptographic primitives for DaNTe: X25519, Ed25519, AEAD, HKDF, Argon2id PoW, Double Ratchet and MLS wrappers."

[features]
default = []
serde = ["dep:serde"]

[dependencies]
thiserror.workspace = true
zeroize.workspace = true
serde = { workspace = true, optional = true }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
x25519-dalek = { version = "3.0.0", features = ["zeroize", "static_secrets"] }
chacha20poly1305 = "0.11.0"
aes-gcm = "0.11.1"
hkdf = "0.13.0"
sha2 = "0.11.0"
argon2 = { version = "0.6.0", features = ["zeroize"] }
rand = "0.8"

[dev-dependencies]
hex-literal = "0.4"

[lints.rust]
unsafe_code = "forbid"
