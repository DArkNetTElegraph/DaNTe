[package]
name = "dante-mls"
version.workspace = true
edition.workspace = true
# OpenMLS 0.9 requires Rust 1.91; the rest of the workspace still builds on 1.85.
rust-version = "1.91"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MLS (RFC 9420) groups for DaNTe channels and group calls — a thin wrapper over OpenMLS."

[dependencies]
thiserror.workspace = true
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
openmls_basic_credential = "0.6"
tls_codec = { version = "0.4.2", features = ["std", "derive"] }

[lints.rust]
unsafe_code = "forbid"
