# Part of the workspace, but only built when a downstream crate turns on its
# `p2p` feature (dante-core / dante-cli). A default `cargo build` does not pull
# the libp2p tree. See docs/DESIGN.md Phase 3.
#
# `deny.toml` carries an `advisories.ignore` for RUSTSEC-2024-0436 (`paste`,
# unmaintained) which the libp2p-tcp -> if-watch -> netlink stack drags in on
# Linux; it is a build-time proc-macro with no runtime surface.
[package]
name = "dante-p2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "libp2p transport for DaNTe: Kademlia key directory + gossipsub for the ledger and channel logs."

[dependencies]
# No "dns" feature on purpose: it pulls hickory-proto 0.25, which carries an
# unfixed DoS advisory (RUSTSEC / GHSA-q2qq-hmj6-3wpp). Bootstrap peers are
# configured by IP multiaddr; add "dns" back once libp2p ships hickory >= 0.26.1.
#
# Dependabot (2026-09-14, after Dependency graph was enabled on the repo)
# flagged 3 findings against this crate's transitive tree. Both were verified
# unreachable, not just theoretically unlikely:
#   - hickory-proto (GHSA-3v94-mw7p-v465 / GHSA-q2qq-hmj6-3wpp): only reaches
#     Cargo.lock via libp2p's optional "dns" and "mdns" features, neither of
#     which is requested below. Confirmed with `cargo tree -i hickory-proto
#     --all-features --target all` (empty — nothing in the resolved build
#     graph reaches it) and by deleting Cargo.lock and regenerating from
#     scratch (it reappears in the lockfile regardless, since Cargo.lock
#     records the full optional-dependency graph independent of which
#     features are actually turned on — but `cargo tree -i` reflects what's
#     actually compiled, and that stays empty). Dead lockfile weight, not
#     shipped code.
#   - yamux 0.12.1 (GHSA-vxx9-2994-q338, remote panic on a malformed Data
#     frame): `libp2p-yamux` 0.47.0 genuinely compiles in BOTH yamux 0.12.1
#     and 0.13.10 side by side (aliased `yamux012`/`yamux013` in its own
#     Cargo.toml) as part of a migration — but its public `Config::default()`
#     (what `yamux::Config::default` below resolves to) builds the safe
#     `Config013` variant. Only the crate's own deprecated `Config::client()`
#     / `Config::server()` constructors select the vulnerable `Config012`
#     path, and nothing in this workspace calls them (verified by grep — the
#     only yamux config construction anywhere in dante-p2p is
#     `yamux::Config::default` in src/lib.rs). The vulnerable code is in the
#     binary but never invoked. Revisit once libp2p-yamux drops 0.12 entirely.
libp2p = { version = "0.57", features = [
    "tokio", "tcp", "noise", "yamux",
    "kad", "gossipsub", "identify", "ping", "macros", "request-response",
] }
tokio = { workspace = true }
futures = "0.3"
async-trait = "0.1"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
