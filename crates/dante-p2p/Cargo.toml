# Part of the workspace, but only built when a downstream crate turns on its
# `p2p` feature (dante-core / dante-cli). A default `cargo build` does not pull
# the libp2p tree. See docs/DESIGN.md Phase 3.
#
# `deny.toml` carries an `advisories.ignore` for RUSTSEC-2024-0436 (`paste`,
# unmaintained) which the libp2p-tcp -> if-watch -> netlink stack drags in on
# Linux; it is a build-time proc-macro with no runtime surface.
[package]
name = "dante-p2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "libp2p transport for DaNTe: Kademlia key directory + gossipsub for the ledger and channel logs."

[dependencies]
# No "dns" feature on purpose: it pulls hickory-proto 0.25, which carries an
# unfixed DoS advisory (RUSTSEC / GHSA-q2qq-hmj6-3wpp). Bootstrap peers are
# configured by IP multiaddr; add "dns" back once libp2p ships hickory >= 0.26.1.
libp2p = { version = "0.56", features = [
    "tokio", "tcp", "noise", "yamux",
    "kad", "gossipsub", "identify", "ping", "macros", "request-response",
] }
tokio = { workspace = true }
futures = "0.3"
async-trait = "0.1"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
