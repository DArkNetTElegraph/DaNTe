[package]
name = "dante-relay-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Checks the opt-in relay registry (relays/registry.toml) and publishes a status page."

[[bin]]
name = "dante-relay-check"
path = "src/main.rs"

[dependencies]
dante-net = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
