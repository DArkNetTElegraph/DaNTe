[package]
name = "dante-relay-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Checks the opt-in relay registry (relays/registry.toml) and publishes a status page."

[[bin]]
name = "dante-relay-check"
path = "src/main.rs"

[dependencies]
# The `p2p` feature is what lets this crate dial a discovered libp2p multiaddr
# (a federation sibling nobody listed directly) rather than only the plain TCP
# addresses in the registry.
dante-net = { workspace = true, features = ["p2p"] }
dante-p2p = { workspace = true }
dante-crypto = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
