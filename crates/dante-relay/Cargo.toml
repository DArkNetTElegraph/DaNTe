[package]
name = "dante-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A DaNTe relay node: sealed-sender mailbox store-and-forward, ledger replication, rate limiting."

[[bin]]
name = "dante-relay"
path = "src/main.rs"

[features]
# Also accept clients over a libp2p `/dante/relay/1` stream (`--p2p-listen`).
p2p = ["dep:dante-p2p", "dante-net/p2p"]

[dependencies]
dante-crypto.workspace = true
dante-proto.workspace = true
dante-identity.workspace = true
dante-ledger.workspace = true
dante-net.workspace = true
dante-dm.workspace = true
dante-p2p = { workspace = true, optional = true }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
async-trait = "0.1"
turn = "0.17"
webrtc-util = "0.17"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
