[package]
name = "dante-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A DaNTe relay node: sealed-sender mailbox store-and-forward, ledger replication, rate limiting."

[[bin]]
name = "dante-relay"
path = "src/main.rs"

[dependencies]
dante-crypto.workspace = true
dante-proto.workspace = true
dante-identity.workspace = true
dante-ledger.workspace = true
dante-net.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
