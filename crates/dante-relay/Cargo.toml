[package]
name = "dante-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A DaNTe relay node: sealed-sender mailbox store-and-forward, ledger replication, rate limiting."

[[bin]]
name = "dante-relay"
path = "src/main.rs"

[features]
default = ["p2p"]
# Accept clients over a libp2p `/dante/relay/1` stream (`--p2p-listen`) and
# federate the ledger with sibling relays. On by default; build with
# `--no-default-features` for a TCP-only relay with no libp2p tree.
p2p = ["dep:dante-p2p", "dante-net/p2p"]
# Host the group-call SFU signalling (`SfuJoin`/`SfuIce`/`SfuPull`/`SfuLeave`).
# Off by default because it pulls the WebRTC dependency tree into the relay
# binary — the browser SPA and the CLI/engine path both drive it when it's
# enabled (see docs/SFU.md), the client integration is not the reason it's
# off.
sfu = ["dep:dante-sfu"]
# Opt-in relay-side link unfurler: fetches a linked URL's metadata on a
# client's behalf so the client's own IP never reaches the linked site. Off
# by default like every other relay capability that changes what the relay
# does or sees (this one especially — it makes outbound requests and learns
# which URLs a client asked about). See docs/THREAT_MODEL.md §4.
unfurl = ["dante-net/unfurl"]

[dependencies]
dante-crypto.workspace = true
dante-proto.workspace = true
dante-identity.workspace = true
dante-ledger.workspace = true
dante-net = { workspace = true, features = ["unfurl"] }
dante-dm.workspace = true
dante-p2p = { workspace = true, optional = true }
dante-sfu = { workspace = true, optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
async-trait = "0.1"
turn = "0.17"
webrtc-util = "0.17"

[dev-dependencies]
dante-voice = { path = "../dante-voice" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
