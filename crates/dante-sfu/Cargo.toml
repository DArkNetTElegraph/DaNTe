[package]
name = "dante-sfu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SFU media component for large DaNTe voice rooms: terminates DTLS-SRTP per participant and forwards RTP payloads opaquely."

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
webrtc = "0.21.0-rc.2"
rtc = "0.21.0-rc.2"
async-trait = "0.1"

[dev-dependencies]
dante-voice = { path = "../dante-voice" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
