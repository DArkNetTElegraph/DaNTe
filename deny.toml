# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error2 is unmaintained (not vulnerable). It is a build-time
    # proc-macro dependency of hax-lib-macros, deep inside the OpenMLS /
    # libcrux crypto stack (openmls -> openmls_rust_crypto -> hpke-rs ->
    # libcrux-*). It does not ship in any binary and has no runtime attack
    # surface. The advisory states no safe upgrade exists; it will drop out
    # when the libcrux stack moves off hax-lib. Reassess on OpenMLS bumps.
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
# The project is AGPL-3.0-or-later. Dependencies must be under permissive or
# weak-copyleft licenses compatible with (A)GPL distribution.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates are referenced by path with no version; that is not a real
# wildcard-version dependency.
allow-wildcard-paths = true
# Reject unmaintained TLS / crypto stacks; we standardize on rustls + a vetted
# crypto stack chosen per-phase.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
